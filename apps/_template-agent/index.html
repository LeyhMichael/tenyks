<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f8f9fb;
      color: #111827;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-title { font-size: 15px; font-weight: 700; color: #111827; }
    .header-sub   { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .clear-btn {
      font-size: 12px; color: #6b7280; background: none;
      border: 1px solid #e5e7eb; border-radius: 6px;
      padding: 6px 12px; cursor: pointer;
    }
    .clear-btn:hover { background: #f3f4f6; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 680px;
      line-height: 1.6;
      font-size: 14px;
    }
    .msg.user {
      align-self: flex-end;
      background: #6366f1;
      color: #fff;
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid #e5e7eb;
      padding: 12px 16px;
      border-radius: 4px 16px 16px 16px;
      white-space: pre-wrap;
    }
    .msg.assistant.streaming { border-color: #6366f1; }

    .typing {
      align-self: flex-start;
      color: #9ca3af;
      font-size: 13px;
      padding: 8px 0;
      display: none;
    }
    .typing.visible { display: block; }

    /* ── Input bar ── */
    #input-area {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    #input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 120px;
      outline: none;
    }
    #input:focus { border-color: #6366f1; }
    #send-btn {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
    #send-btn:not(:disabled):hover { background: #4f46e5; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-title">My Agent</div>
    <div class="header-sub">Powered by Claude · BCG TDA Vantage Platform</div>
  </div>
  <button class="clear-btn" id="clear-btn">Clear chat</button>
</header>

<div id="messages">
  <div class="msg assistant">Hi! I'm your agent. How can I help you today?</div>
  <div class="typing" id="typing">Claude is typing…</div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="Type a message…"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const typingEl   = document.getElementById('typing');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send-btn');
  const clearBtn   = document.getElementById('clear-btn');

  let busy = false;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // Send on Enter (Shift+Enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener('click', send);
  clearBtn.addEventListener('click', async () => {
    await fetch('api/chat', { method: 'DELETE' });
    messagesEl.innerHTML = '<div class="msg assistant">Chat cleared. How can I help you?</div>';
    messagesEl.appendChild(typingEl);
  });

  function appendMsg(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    messagesEl.insertBefore(div, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMsg('user', message);
    typingEl.classList.add('visible');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // Create assistant bubble for streaming
    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'msg assistant streaming';
    messagesEl.insertBefore(assistantDiv, typingEl);

    try {
      const res = await fetch('api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      });

      if (!res.ok) throw new Error(`Server error ${res.status}`);

      typingEl.classList.remove('visible');

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;
          try {
            const { text } = JSON.parse(payload);
            assistantDiv.textContent += text;
            messagesEl.scrollTop = messagesEl.scrollHeight;
          } catch {}
        }
      }

      assistantDiv.classList.remove('streaming');

    } catch (err) {
      typingEl.classList.remove('visible');
      assistantDiv.textContent = `Error: ${err.message}`;
      assistantDiv.style.color = '#ef4444';
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>

</body>
</html>
