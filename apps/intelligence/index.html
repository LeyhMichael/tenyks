<!DOCTYPE html>
<html>
<head>
    <title>Intelligence Dashboards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', Arial, sans-serif; background: #0f1117; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { background: linear-gradient(135deg, #1a1f2e 0%, #0f1117 100%); border-bottom: 1px solid #2a2f3e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { color: #6b7280; font-size: 12px; text-decoration: none; padding: 5px 12px; border: 1px solid #2a2f3e; border-radius: 6px; transition: all 0.2s; }
        .back-btn:hover { color: #fff; border-color: #4b5563; }
        .topbar-title { font-size: 15px; font-weight: 700; color: #fff; }
        .topbar-sub { font-size: 11px; color: #6b7280; margin-top: 1px; }
        .nav-wrapper { background: #1a1f2e; border-bottom: 1px solid #2a2f3e; padding: 0 24px; display: flex; align-items: flex-end; overflow-x: auto; flex-shrink: 0; }
        .nav-wrapper::-webkit-scrollbar { height: 3px; }
        .nav-wrapper::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 2px; }
        .nav-group-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #374151; padding: 0 16px 6px 4px; white-space: nowrap; align-self: flex-end; }
        .nav-tab { padding: 11px 18px; font-size: 12px; font-weight: 500; color: #6b7280; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .nav-tab:hover { color: #d1d5db; }
        .nav-tab.active { color: #818cf8; border-bottom-color: #6366f1; font-weight: 600; }
        .nav-tab.deepdive.active { color: #34d399; border-bottom-color: #10b981; }
        .frame-wrapper { flex: 1; position: relative; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f1117; color: #4b5563; font-size: 13px; gap: 10px; transition: opacity 0.3s; }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 18px; height: 18px; border: 2px solid #2a2f3e; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbar-left">
        <a href="/" class="back-btn">← Platform</a>
        <div>
            <div class="topbar-title">📊 Intelligence Dashboards</div>
            <div class="topbar-sub">TDA analytics · 15 dashboards</div>
        </div>
    </div>
</div>
<div class="nav-wrapper">
    <span class="nav-group-label">Main</span>
    <div class="nav-tab active" onclick="loadDash('dashboards/tda_leadership_dashboard.html', this)">Leadership</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_volume_trends.html', this)">Volume Trends</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_nordics_dashboard.html', this)">Nordics</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_pdlc.html', this)">PDLC</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_bff_dashboard.html', this)">BFF</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_aipg.html', this)">AIPG</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_qc_report.html', this)">QC Report</div>
    <div class="nav-tab" onclick="loadDash('dashboards/tda_topic_deepdive.html', this)">Topic Deep Dive</div>
    <span class="nav-group-label" style="padding-left:20px;">Deep Dives</span>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_ai_strategy_vision.html', this)">AI Strategy</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_agentic_genai.html', this)">Agentic GenAI</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_ai_governance.html', this)">AI Governance</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_digital_it.html', this)">Digital & IT</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_ai_use_cases.html', this)">AI Use Cases</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_ai_technology.html', this)">AI Technology</div>
    <div class="nav-tab deepdive" onclick="loadDash('dashboards/deepdives/tda_deepdive_ai_talent.html', this)">AI Talent</div>
</div>
<div class="frame-wrapper">
    <div class="loading" id="loading"><div class="spinner"></div> Loading dashboard…</div>
    <iframe id="frame" src="dashboards/tda_leadership_dashboard.html" onload="document.getElementById('loading').classList.add('hidden')"></iframe>
</div>
<script>
function loadDash(url, tab) {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('loading').classList.remove('hidden');
    document.getElementById('frame').src = url;
}
</script>
</body>
</html>
