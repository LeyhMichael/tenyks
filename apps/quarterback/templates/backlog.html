<!DOCTYPE html>
<html>
<head>
    <title>Backlog</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', Arial, sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

        header {
            background: linear-gradient(135deg, #1a1f2e 0%, #0f1117 100%);
            border-bottom: 1px solid #2a2f3e;
            padding: 14px 28px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 17px; font-weight: 700; color: #fff; }
        header .subtitle { font-size: 12px; color: #6b7280; margin-top: 2px; }
        header a { color: #6b7280; font-size: 12px; text-decoration: none; padding: 6px 12px; border: 1px solid #2a2f3e; border-radius: 6px; transition: all 0.2s; }
        header a:hover { color: #fff; border-color: #4b5563; }

        .nav-tabs { display: flex; padding: 0 28px; background: #1a1f2e; border-bottom: 1px solid #2a2f3e; }
        .nav-tab { padding: 12px 20px; font-size: 13px; font-weight: 600; color: #6b7280; text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .nav-tab:hover { color: #e0e0e0; }
        .nav-tab.active { color: #60a5fa; border-bottom-color: #3b82f6; }

        .toolbar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 28px; background: #0f1117; border-bottom: 1px solid #2a2f3e;
            flex-wrap: wrap;
        }
        .toolbar select, .toolbar input {
            padding: 6px 10px; background: #1a1f2e; border: 1px solid #2a2f3e;
            border-radius: 7px; color: #e0e0e0; font-size: 12px; cursor: pointer;
        }
        .toolbar select:focus, .toolbar input:focus { outline: none; border-color: #3b82f6; }
        .toolbar .spacer { flex: 1; }
        .btn-add {
            padding: 7px 16px; background: #3b82f6; color: white;
            border: none; border-radius: 7px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .btn-add:hover { background: #2563eb; }

        .backlog-wrap { overflow-y: auto; height: calc(100vh - 135px); padding: 0 28px 40px; }

        .group-header {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 4px 8px;
            font-size: 12px; font-weight: 700; color: #9ca3af;
            text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; user-select: none;
        }
        .group-header:hover { color: #e0e0e0; }
        .group-count { background: #2a2f3e; color: #6b7280; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .group-chevron { font-size: 10px; transition: transform 0.2s; }
        .group-chevron.collapsed { transform: rotate(-90deg); }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 8px 10px; font-size: 11px; font-weight: 600;
            color: #6b7280; text-align: left; white-space: nowrap;
            border-bottom: 1px solid #2a2f3e; position: sticky; top: 0;
            background: #0f1117; z-index: 5;
        }
        tbody tr {
            border-bottom: 1px solid #1e2330;
            cursor: pointer; transition: background 0.12s;
        }
        tbody tr:hover { background: #1a1f2e; }
        tbody td { padding: 10px 10px; font-size: 12px; vertical-align: middle; }

        .col-name { font-weight: 600; color: #e5e7eb; max-width: 220px; }
        .col-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-lead { color: #9ca3af; white-space: nowrap; }
        .col-team { color: #9ca3af; }
        .col-team .team-pill {
            display: inline-block; background: rgba(139,92,246,0.12); color: #a78bfa;
            border: 1px solid rgba(139,92,246,0.25); border-radius: 10px;
            padding: 1px 7px; font-size: 10px; font-weight: 600; margin: 1px 2px 1px 0;
            white-space: nowrap;
        }
        .col-timeline { font-size: 11px; color: #6b7280; white-space: nowrap; }
        .col-hours { color: #9ca3af; text-align: right; }
        .col-alloc { text-align: center; }

        /* Status badges */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; white-space: nowrap; }
        .s-working     { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .s-backlog     { background: rgba(107,114,128,0.15); color: #9ca3af; border: 1px solid rgba(107,114,128,0.3); }
        .s-complete    { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
        .s-on-hold     { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
        .s-deprioritized { background: rgba(107,114,128,0.1); color: #6b7280; border: 1px solid rgba(107,114,128,0.2); }

        /* Priority badges */
        .p-high     { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
        .p-medium   { background: rgba(251,191,36,0.12); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
        .p-low      { background: rgba(16,185,129,0.12); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
        .p-unset    { background: rgba(107,114,128,0.1);  color: #6b7280; border: 1px solid rgba(107,114,128,0.2); }
        .p-other    { background: rgba(139,92,246,0.12); color: #a78bfa; border: 1px solid rgba(139,92,246,0.25); }

        /* Allocation % badge */
        .alloc-0   { color: #374151; font-size: 11px; }
        .alloc-25  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .alloc-50  { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
        .alloc-75  { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
        .alloc-100 { background: rgba(239,68,68,0.25); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }

        /* ── Modal ─────────────────────────────────────────────────────── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
            z-index: 200; align-items: flex-start; justify-content: center;
            padding: 40px 20px; overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1f2e; border: 1px solid rgba(59,130,246,0.35);
            border-radius: 16px; width: 620px; max-width: 100%;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6);
            margin-bottom: 40px;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px 16px; border-bottom: 1px solid #2a2f3e;
        }
        .modal-title { font-size: 16px; font-weight: 700; color: #fff; }
        .modal-close { background: none; border: none; color: #6b7280; font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.15s; }
        .modal-close:hover { background: #2a2f3e; color: #e0e0e0; }
        .modal-body { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 8px 10px; background: #0f1117; border: 1px solid #2a2f3e;
            border-radius: 7px; color: #e0e0e0; font-size: 13px; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .team-pickers { display: flex; flex-direction: column; gap: 6px; }
        .team-pickers select { width: 100%; }
        .modal-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-top: 1px solid #2a2f3e;
        }
        .btn-save {
            padding: 9px 22px; background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 12px rgba(59,130,246,0.3); transition: all 0.2s;
        }
        .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
        .btn-cancel { padding: 9px 18px; background: #2a2f3e; color: #9ca3af; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-cancel:hover { background: #374151; color: #e0e0e0; }
        .btn-delete { padding: 9px 18px; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .btn-delete:hover { background: rgba(239,68,68,0.25); }

        /* Toast */
        .toast-notification {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a1f2e; border: 1px solid #3b82f6;
            color: #e0e0e0; padding: 14px 22px; border-radius: 10px;
            font-size: 13px; font-weight: 600;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 9999; opacity: 0; pointer-events: none;
        }
        .toast-notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast-error { border-color: #ef4444; color: #f87171; background: #1a0f0f; }

        .empty-group { color: #4b5563; font-size: 12px; padding: 12px 4px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🏈 Quarterback Dashboard</h1>
            <div class="subtitle">Vantage Request Staffing</div>
        </div>
        <a href="/logout">Sign out</a>
    </header>

    <div class="nav-tabs">
        <a href="/" class="nav-tab">📋 Requests</a>
        <a href="/staffing-tab" class="nav-tab">👥 Case Staffing</a>
        <a href="/pto-tab" class="nav-tab">🏖️ PTO & Absences</a>
        <a href="/backlog-tab" class="nav-tab active">📌 Backlog</a>
    </div>

    <div class="toolbar">
        <select id="filterGroup" onchange="renderTable()">
            <option value="">All Groups</option>
        </select>
        <select id="filterStatus" onchange="renderTable()">
            <option value="">All Statuses</option>
            <option>Working</option><option>Backlog</option>
            <option>Complete</option><option>On Hold</option><option>Deprioritized</option>
        </select>
        <select id="filterPriority" onchange="renderTable()">
            <option value="">All Priorities</option>
            <option>High</option><option>Medium</option><option>Low</option><option>Unset</option>
        </select>
        <input id="filterSearch" type="text" placeholder="🔍 Search projects…" oninput="renderTable()" style="width:180px;">
        <div class="spacer"></div>
        <button class="btn-add" onclick="openModal(-1)">+ New Project</button>
    </div>

    <div class="backlog-wrap">
        <table>
            <thead>
                <tr>
                    <th style="min-width:220px">Project</th>
                    <th>Lead</th>
                    <th>Team</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Timeline</th>
                    <th style="text-align:right">Hours</th>
                    <th>Practice</th>
                    <th style="text-align:center">Alloc %</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- Edit / New Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">New Project</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group full">
                    <label>Project Name</label>
                    <input type="text" id="fName" placeholder="Project name">
                </div>
                <div class="form-group">
                    <label>Group</label>
                    <select id="fGroup">
                        <option value="">— Select —</option>
                        <option>IP & Product</option>
                        <option>Operations & Reporting</option>
                        <option>Marketing & Promotion</option>
                        <option>50% time</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Practice</label>
                    <select id="fPractice">
                        <option value="">—</option>
                        <option>POP</option><option>TDA</option>
                        <option>POP/TDA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Lead</label>
                    <select id="fLead">
                        <option value="">— None —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="fStatus">
                        <option>Working</option><option>Backlog</option>
                        <option>Complete</option><option>On Hold</option>
                        <option>Deprioritized</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="fPriority">
                        <option>Unset</option><option>Low</option>
                        <option>Medium</option><option>High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="fStartDate">
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="fEndDate">
                </div>
                <div class="form-group">
                    <label>Completion Date</label>
                    <input type="date" id="fCompletionDate">
                </div>
                <div class="form-group">
                    <label>Hours (total)</label>
                    <input type="number" id="fHours" min="0" step="0.5">
                </div>
                <div class="form-group">
                    <label>Daily Allocation % <span style="color:#4b5563;font-weight:400">(reduces request cap)</span></label>
                    <select id="fAlloc">
                        <option value="0">0% — no impact</option>
                        <option value="25">25%</option>
                        <option value="50">50%</option>
                        <option value="75">75%</option>
                        <option value="100">100% — fully blocked</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>Team (up to 3)</label>
                    <div class="team-pickers">
                        <select id="fTeam1"><option value="">— Person 1 —</option></select>
                        <select id="fTeam2"><option value="">— Person 2 —</option></select>
                        <select id="fTeam3"><option value="">— Person 3 —</option></select>
                    </div>
                </div>
                <div class="form-group full">
                    <label>Stakeholders</label>
                    <input type="text" id="fStakeholders" placeholder="Comma-separated names">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-delete" id="btnDelete" onclick="deleteItem()" style="display:none">🗑 Delete</button>
                <div style="display:flex;gap:10px;">
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                    <button class="btn-save" onclick="saveItem()">Save →</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toastNotification" class="toast-notification"><span id="toastMsg"></span></div>

    <script>
        const teamNames = {{ team_names | tojson }};
        let allItems = [];
        let editingId = -1;
        let collapsedGroups = new Set();

        // ── Populate selects ────────────────────────────────────────────
        function populateSelects() {
            ["fLead","fTeam1","fTeam2","fTeam3"].forEach(id => {
                const sel = document.getElementById(id);
                const first = sel.options[0];
                sel.innerHTML = "";
                sel.appendChild(first);
                teamNames.forEach(n => {
                    const o = document.createElement("option");
                    o.value = n; o.textContent = n;
                    sel.appendChild(o);
                });
            });
        }

        // ── Helpers ─────────────────────────────────────────────────────
        function statusCls(s) {
            const m = {Working:"s-working",Backlog:"s-backlog",Complete:"s-complete","On Hold":"s-on-hold",Deprioritized:"s-deprioritized"};
            return m[s] || "s-backlog";
        }
        function priorityCls(p) {
            const m = {High:"p-high",Medium:"p-medium",Low:"p-low",Unset:"p-unset"};
            return m[p] || "p-other";
        }
        function allocCls(a) {
            if (a === 0) return "alloc-0";
            if (a <= 25) return "badge alloc-25";
            if (a <= 50) return "badge alloc-50";
            if (a <= 75) return "badge alloc-75";
            return "badge alloc-100";
        }
        function fmtDate(d) {
            if (!d) return "";
            return d.slice(5).replace("-","/"); // MM/DD
        }
        function fmtTimeline(s, e) {
            if (!s && !e) return "—";
            return (s ? fmtDate(s) : "?") + " – " + (e ? fmtDate(e) : "…");
        }
        function firstNames(str) {
            if (!str) return [];
            return str.split(",").map(n => n.trim().split(" ")[0]).filter(Boolean);
        }

        // ── Render table ─────────────────────────────────────────────────
        function getFiltered() {
            const grp = document.getElementById("filterGroup").value;
            const sta = document.getElementById("filterStatus").value;
            const pri = document.getElementById("filterPriority").value;
            const q   = document.getElementById("filterSearch").value.toLowerCase();
            return allItems.filter(it =>
                (!grp || it.Group === grp) &&
                (!sta || it.Status === sta) &&
                (!pri || it.Priority === pri) &&
                (!q   || it.Name.toLowerCase().includes(q) || (it.Lead||"").toLowerCase().includes(q))
            );
        }

        function renderTable() {
            const items = getFiltered();
            // Group items
            const groups = {};
            items.forEach(it => {
                const g = it.Group || "Other";
                if (!groups[g]) groups[g] = [];
                groups[g].push(it);
            });

            let html = "";
            Object.entries(groups).forEach(([grp, rows]) => {
                const collapsed = collapsedGroups.has(grp);
                html += `<tr class="group-row">
                    <td colspan="9" style="padding:0">
                        <div class="group-header" onclick="toggleGroup('${grp.replace(/'/g,"\\'")}')">
                            <span class="group-chevron ${collapsed ? 'collapsed' : ''}">▼</span>
                            ${grp}
                            <span class="group-count">${rows.length}</span>
                        </div>
                    </td>
                </tr>`;
                if (!collapsed) {
                    rows.forEach(it => {
                        const teamPills = (it.Team || "").split(",").map(n => n.trim()).filter(Boolean).slice(0,3)
                            .map(n => `<span class="team-pill">${n.split(" ")[0]}</span>`).join("");
                        const alloc = it["Allocation %"] || 0;
                        const allocHtml = alloc > 0
                            ? `<span class="${allocCls(alloc)}">${alloc}%</span>`
                            : `<span class="alloc-0">—</span>`;
                        html += `<tr onclick="openModal(${it.id})">
                            <td class="col-name"><span title="${it.Name}">${it.Name}</span></td>
                            <td class="col-lead">${it.Lead ? it.Lead.split(" ")[0] : "—"}</td>
                            <td class="col-team">${teamPills || "<span style='color:#374151'>—</span>"}</td>
                            <td><span class="badge ${statusCls(it.Status)}">${it.Status || "—"}</span></td>
                            <td><span class="badge ${priorityCls(it.Priority)}">${it.Priority || "—"}</span></td>
                            <td class="col-timeline">${fmtTimeline(it["Start Date"], it["End Date"])}</td>
                            <td class="col-hours">${it.Hours ? it.Hours.toFixed(1) : "—"}</td>
                            <td><span style="font-size:10px;color:#6b7280">${it.Practice || "—"}</span></td>
                            <td class="col-alloc">${allocHtml}</td>
                        </tr>`;
                    });
                }
            });
            if (!html) html = `<tr><td colspan="9" style="padding:24px;text-align:center;color:#4b5563">No projects match the current filters.</td></tr>`;
            document.getElementById("tableBody").innerHTML = html;
        }

        function toggleGroup(grp) {
            if (collapsedGroups.has(grp)) collapsedGroups.delete(grp);
            else collapsedGroups.add(grp);
            renderTable();
        }

        // ── Populate group filter ────────────────────────────────────────
        function populateGroupFilter() {
            const groups = [...new Set(allItems.map(i => i.Group).filter(Boolean))].sort();
            const sel = document.getElementById("filterGroup");
            sel.innerHTML = '<option value="">All Groups</option>';
            groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; sel.appendChild(o); });
        }

        // ── Modal ────────────────────────────────────────────────────────
        function openModal(id) {
            editingId = id;
            const item = id >= 0 ? allItems.find(i => i.id === id) : null;
            document.getElementById("modalTitle").textContent = item ? "Edit Project" : "New Project";
            document.getElementById("btnDelete").style.display = item ? "block" : "none";

            document.getElementById("fName").value          = item?.Name || "";
            document.getElementById("fGroup").value         = item?.Group || "";
            document.getElementById("fPractice").value      = item?.Practice || "";
            document.getElementById("fLead").value          = item?.Lead || "";
            document.getElementById("fStatus").value        = item?.Status || "Working";
            document.getElementById("fPriority").value      = item?.Priority || "Unset";
            document.getElementById("fStartDate").value     = item?.["Start Date"] || "";
            document.getElementById("fEndDate").value       = item?.["End Date"] || "";
            document.getElementById("fCompletionDate").value= item?.["Completion Date"] || "";
            document.getElementById("fHours").value         = item?.Hours || "";
            document.getElementById("fAlloc").value         = String(item?.["Allocation %"] || 0);
            document.getElementById("fStakeholders").value  = item?.Stakeholders || "";

            // Team pickers
            const teamArr = (item?.Team || "").split(",").map(n => n.trim()).filter(Boolean);
            document.getElementById("fTeam1").value = teamArr[0] || "";
            document.getElementById("fTeam2").value = teamArr[1] || "";
            document.getElementById("fTeam3").value = teamArr[2] || "";

            document.getElementById("modalOverlay").classList.add("show");
        }

        function closeModal() {
            document.getElementById("modalOverlay").classList.remove("show");
        }

        function saveItem() {
            const team = [
                document.getElementById("fTeam1").value,
                document.getElementById("fTeam2").value,
                document.getElementById("fTeam3").value
            ].filter(Boolean).join(", ");

            const payload = {
                id: editingId,
                "Group":           document.getElementById("fGroup").value,
                "Name":            document.getElementById("fName").value.trim(),
                "Lead":            document.getElementById("fLead").value,
                "Team":            team,
                "Status":          document.getElementById("fStatus").value,
                "Start Date":      document.getElementById("fStartDate").value,
                "End Date":        document.getElementById("fEndDate").value,
                "Priority":        document.getElementById("fPriority").value,
                "Hours":           parseFloat(document.getElementById("fHours").value) || 0,
                "Completion Date": document.getElementById("fCompletionDate").value,
                "Practice":        document.getElementById("fPractice").value,
                "Stakeholders":    document.getElementById("fStakeholders").value,
                "Allocation %":    parseInt(document.getElementById("fAlloc").value) || 0,
            };

            if (!payload["Name"]) { alert("Project name is required."); return; }

            fetch("/api/backlog/save", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(data => {
                if (data.success) {
                    closeModal();
                    loadBacklog();
                    showToast(editingId >= 0 ? "✓ Project saved" : "✓ Project created");
                } else {
                    showToast("Error saving project", "error");
                }
            });
        }

        function deleteItem() {
            if (!confirm("Delete this project? This cannot be undone.")) return;
            fetch("/api/backlog/delete", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({id: editingId})
            }).then(r => r.json()).then(data => {
                if (data.success) { closeModal(); loadBacklog(); showToast("Project deleted"); }
            });
        }

        // ── Toast ────────────────────────────────────────────────────────
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toastNotification');
            toast.querySelector('#toastMsg').textContent = msg;
            toast.className = 'toast-notification show' + (type === 'error' ? ' toast-error' : '');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ── Load data ────────────────────────────────────────────────────
        function loadBacklog() {
            fetch("/api/backlog")
                .then(r => r.json())
                .then(data => {
                    allItems = data;
                    populateGroupFilter();
                    renderTable();
                });
        }

        // Close modal on overlay click
        document.getElementById("modalOverlay").addEventListener("click", e => {
            if (e.target === document.getElementById("modalOverlay")) closeModal();
        });

        populateSelects();
        loadBacklog();
    </script>
</body>
</html>
