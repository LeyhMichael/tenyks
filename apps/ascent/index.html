      <div className="border border-stone-800 bg-[#070a0b] p-6">
        <div className="grid grid-cols-8 gap-px bg-stone-900">
          {DOMAIN_KEYS.map((domKey) => {
            const playerScore = Math.round(playerDomains[domKey] ?? 0);
            const benchScore = Math.round(benchDomains?.[domKey] ?? 0);
            const delta = playerScore - benchScore;
            const stageCol = playerScore >= 75 ? "text-emerald-400" : playerScore >= 50 ? "text-lime-400" : playerScore >= 25 ? "text-amber-400" : "text-rose-400";
            const barCol = playerScore >= 75 ? "bg-emerald-400" : playerScore >= 50 ? "bg-lime-400" : playerScore >= 25 ? "bg-amber-400" : "bg-rose-400";
            const isExpanded = expandedDomain === domKey;
            return (
              <button key={domKey}
                onClick={() => setExpandedDomain(isExpanded ? null : domKey)}
                className={`bg-[#070a0b] p-3 text-left transition hover:bg-[#0a1112] ${isExpanded ? "ring-1 ring-emerald-400 z-10 relative" : ""}`}>
                <div className="text-[9px] uppercase tracking-wider text-stone-500 mb-2 flex items-center justify-between">
                  <span>{DOMAIN_LABELS[domKey]}</span>
                  <Icon path={isExpanded ? icons.chevronDown : icons.arrowRight} size={8} className="text-stone-600" />
                </div>
                <div className={`font-display text-2xl mb-1 ${stageCol}`}>{playerScore}</div>
                <div className="relative h-1 bg-stone-900 mb-2">
                  <div className={`absolute left-0 top-0 h-full ${barCol}`} style={{ width: `${playerScore}%` }} />
                  <div className="absolute top-0 h-full w-0.5 bg-stone-400" style={{ left: `${benchScore}%` }} title={`Benchmark: ${benchScore}`} />
                </div>
                <div className={`text-[9px] font-mono-custom ${delta >= 0 ? "text-emerald-400" : "text-rose-400"}`}>{delta > 0 ? "+" : ""}{delta} vs bench</div>
              </button>
            );
          })}
        </div>
        
        {/* Drill-down panel: shows BOTH player and benchmark per capability */}
        {expandedDomain && (() => {
          const caps = CAPABILITIES_BY_DOMAIN[expandedDomain] || [];
          const benchCaps = bench.cell.capabilities || {};
          const playerCaps = playerCapabilities || {};
          // Sort capabilities by player gap (worst first), so attention lands on what's most off
          const enriched = caps.map((cap, idx) => {
            const benchVal = benchCaps[cap.key] ?? null;
            const playerVal = playerCaps[cap.label] ?? null;
            const delta = (playerVal != null && benchVal != null) ? playerVal - benchVal : null;
            // For Operations, swap the display label to the sector-specific name.
            // Other domains use the original label.
            const displayLabel = (expandedDomain === "Operations" && getSectorOpsLabel(sector, idx)) || cap.label;
            return { ...cap, displayLabel, benchVal, playerVal, delta };
          });
          // Sort: largest negative delta first (where you're weakest vs bench)
          enriched.sort((a, b) => {
            if (a.delta === null && b.delta === null) return 0;
            if (a.delta === null) return 1;
            if (b.delta === null) return -1;
            return a.delta - b.delta;
          });
          return (
            <div className="mt-4 border-t border-stone-800 pt-4 animate-fadeIn">
              <div className="text-[10px] uppercase tracking-[0.25em] text-emerald-400 mb-3">
                {DOMAIN_LABELS[expandedDomain]} · {caps.length} capabilities · sorted by your gap, weakest first · benchmark: {bench.label}
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                {enriched.map((cap) => {
                  if (cap.benchVal == null) return null;
                  const playerScore = cap.playerVal != null ? Math.round(cap.playerVal) : null;
                  const benchScore = Math.round(cap.benchVal);
                  const deltaCol = cap.delta == null ? "text-stone-600" 
                    : cap.delta >= 5 ? "text-emerald-400" 
                    : cap.delta >= -5 ? "text-stone-400" 
                    : "text-rose-400";
                  return (
                    <div key={cap.key} className="bg-black/30 px-3 py-2.5">
                      <div className="flex items-center justify-between gap-2 mb-1.5">
                        <div className="text-xs text-stone-300 truncate">{cap.displayLabel}</div>
                        <div className={`text-xs font-mono-custom shrink-0 ${deltaCol}`}>
                          {cap.delta == null ? "no answer" : `${cap.delta > 0 ? "+" : ""}${Math.round(cap.delta)}`}
                        </div>
                      </div>
                      {/* Bar with both markers: player as colored fill, bench as tick mark */}
                      <div className="relative h-1.5 bg-stone-900">
                        {playerScore != null && (
                          <div 
                            className={`absolute left-0 top-0 h-full ${
                              playerScore >= 75 ? "bg-emerald-400" 
                              : playerScore >= 50 ? "bg-lime-400" 
                              : playerScore >= 25 ? "bg-amber-400" 
                              : "bg-rose-400"
                            }`} 
                            style={{ width: `${playerScore}%` }} 
                          />
                        )}
                        <div 
                          className="absolute top-0 h-full w-0.5 bg-stone-300" 
                          style={{ left: `${benchScore}%` }} 
                          title={`Benchmark: ${benchScore}`} 
                        />
                      </div>
                      <div className="flex items-center justify-between mt-1 text-[10px] font-mono-custom">
                        <span className="text-stone-400">you {playerScore != null ? playerScore : "n/a"}</span>
                        <span className="text-stone-600">bench {benchScore}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="flex items-center gap-4 mt-3 text-[10px] text-stone-600">
                <span className="flex items-center gap-1.5">
                  <span className="w-3 h-1 bg-lime-400 inline-block"></span>
                  <span>your score</span>
                </span>
                <span className="flex items-center gap-1.5">
                  <span className="w-0.5 h-3 bg-stone-300 inline-block"></span>
                  <span>benchmark</span>
                </span>
              </div>
            </div>
          );
        })()}
      </div>
    </section>
  );
}

/* ============ COMPARE YOURSELF ============ */
function CompareYourselfSection({ playerScore, playerDomains, industryKey, sectorName, regions }) {
  const [filterMode, setFilterMode] = React.useState("sector");  // "sector" | "industry" | "region"
  const [regionFilter, setRegionFilter] = React.useState(null);
  
  // Resolve the bench based on current filter
  const bench = React.useMemo(() => {
    if (filterMode === "industry") return getBenchmark(industryKey, null, null);
    if (filterMode === "region") return getBenchmark(industryKey, sectorName, regionFilter);
    return getBenchmark(industryKey, sectorName, null);  // sector default
  }, [filterMode, regionFilter, industryKey, sectorName]);
  
  const dist = bench.cell.dist;  // may be undefined for region cuts that lacked enough samples
  const DOMAIN_LABELS = ASCENT_DATA.meta.domainLabels;
  
  // Where does the player sit in the distribution? Returns {bucket, pct, narrative}.
  // Bucket is a stage label, pct is the rough percentile, narrative is one sentence.
  const positionAnalysis = React.useMemo(() => {
    if (!dist) return null;
    const { p10, p25, p50, p75, p90 } = dist;
    let bucket, narrative;
    
    if (playerScore < p10) {
      bucket = "Bottom decile";
      narrative = `Below the 10th percentile (${p10.toFixed(1)}). The bench's median climber is ${(p50 - playerScore).toFixed(0)} points ahead.`;
    } else if (playerScore < p25) {
      bucket = "Bottom quartile";
      narrative = `Below the bottom-quartile threshold (${p25.toFixed(1)}). Around three-quarters of the bench is ahead.`;
    } else if (playerScore < p50) {
      bucket = "Below median";
      narrative = `Below the median (${p50.toFixed(1)}). The typical climber in this bench is ${(p50 - playerScore).toFixed(0)} points ahead.`;
    } else if (playerScore < p75) {
      bucket = "Above median";
      narrative = `Above the median (${p50.toFixed(1)}) but below the top-quartile threshold (${p75.toFixed(1)}). Real leaders (top decile) reach ${p90.toFixed(0)}, which is ${(p90 - playerScore).toFixed(0)} points away.`;
    } else if (playerScore < p90) {
      bucket = "Top quartile";
      narrative = `In the top quartile. Top-decile climbers reach ${p90.toFixed(0)}, which is ${(p90 - playerScore).toFixed(0)} points ahead.`;
    } else {
      bucket = "Top decile";
      narrative = `In the top decile of this bench. Above 90% of climbers.`;
    }
    
    // Approximate percentile via linear interpolation between known points
    let approxPct;
    const breaks = [
      [0, 0], [10, p10], [25, p25], [50, p50], [75, p75], [90, p90], [100, 100]
    ];
    for (let i = 0; i < breaks.length - 1; i++) {
      const [pcA, scoreA] = breaks[i];
      const [pcB, scoreB] = breaks[i + 1];
      if (playerScore >= scoreA && playerScore <= scoreB) {
        const frac = scoreB === scoreA ? 0 : (playerScore - scoreA) / (scoreB - scoreA);
        approxPct = pcA + frac * (pcB - pcA);
        break;
      }
    }
    
    return { bucket, narrative, approxPct: approxPct == null ? null : Math.round(approxPct) };
  }, [playerScore, dist]);
  
  // Headroom narrative: how spread is this bench?
  const headroomNarrative = React.useMemo(() => {
    if (!dist) return null;
    const spread = dist.p90 - dist.p50;  // distance from median to top decile
    if (spread > 22) {
      return {
        flavor: "wide",
        text: `This bench has wide headroom: real leaders (top decile, ${dist.p90.toFixed(0)}) are ${spread.toFixed(0)} points above the median (${dist.p50.toFixed(0)}). There is real room for differentiation.`,
      };
    } else if (spread > 14) {
      return {
        flavor: "moderate",
        text: `This bench has moderate spread: top-decile leaders (${dist.p90.toFixed(0)}) sit ${spread.toFixed(0)} points above the median (${dist.p50.toFixed(0)}). A focused move can close the leadership gap.`,
      };
    } else {
      return {
        flavor: "tight",
        text: `This bench is compressed: top-decile leaders (${dist.p90.toFixed(0)}) sit only ${spread.toFixed(0)} points above the median (${dist.p50.toFixed(0)}). Differentiation here is harder than the score gap suggests.`,
      };
    }
  }, [dist]);
  
  return (
    <section className="mb-20">
      <SectionHeader numeral="iii." title="Compare yourself" sub="Where you sit in the distribution, not just versus the average" />
      
      <div className="border border-stone-800 bg-[#070a0b] p-6">
        {/* Filter pills */}
        <div className="flex items-center gap-2 mb-6 flex-wrap">
          <span className="text-[10px] uppercase tracking-widest text-stone-500 mr-2">Compare against:</span>
          {sectorName && (
            <button onClick={() => { setFilterMode("sector"); setRegionFilter(null); }}
              className={`px-3 py-1.5 text-[10px] uppercase tracking-wider border transition ${filterMode === "sector" ? "border-emerald-400 text-emerald-400 bg-emerald-400/5" : "border-stone-800 text-stone-500 hover:border-stone-600"}`}>
              My sector ({sectorName})

          <div className="text-xs text-stone-500 italic py-8 text-center">

        {/* Position interpretation */}
        {positionAnalysis && (
          <div className="grid grid-cols-1 md:grid-cols-12 gap-px bg-stone-900 mt-5">
            <div className="md:col-span-4 bg-[#070a0b] p-4">
              <div className="text-[9px] uppercase tracking-[0.25em] text-stone-500 mb-2">Where you sit</div>
              <div className="font-display text-2xl text-emerald-400 mb-1">{positionAnalysis.bucket}</div>
              {positionAnalysis.approxPct != null && (
                <div className="text-[10px] text-stone-500 font-mono-custom">
                  ~{positionAnalysis.approxPct}th percentile
                </div>
              )}
            </div>
            <div className="md:col-span-8 bg-[#070a0b] p-4">
              <div className="text-[9px] uppercase tracking-[0.25em] text-stone-500 mb-2">In context</div>
              <p className="text-sm text-stone-300 leading-relaxed">{positionAnalysis.narrative}</p>
            </div>
          </div>

        {/* Headroom narrative */}

          <div className={`mt-4 border-l-2 pl-5 py-3 ${

            : "border-emerald-400/40 bg-emerald-400/[0.03]"

              : "text-emerald-400"

            <p className="text-xs text-stone-400 italic leading-relaxed">{headroomNarrative.text}</p>

        {/* Per-domain delta strip with full domain names */}
        {bench.cell.domains && (
          <div className="mt-6 pt-5 border-t border-stone-900">
            <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-3">Per-domain delta vs {bench.label}</div>

                const b = Math.round(bench.cell.domains[d] ?? 0);
                const dlt = p - b;

                  <div key={d} className="bg-[#070a0b] p-3 text-center">

      </div>
    </section>
  );
}


/* DistributionPlot: horizontal box-and-whisker showing 10th/25th/50th/75th/90th
   percentiles of the bench, with the player's score marked. Stage bands in the
   background (Stagnating 0-25, etc.) provide context. */
function DistributionPlot({ dist, playerScore }) {
  const W = 800, H = 130;
  const padX = 24;
  const trackY = 60;
  const trackH = 30;
  const scoreToX = (s) => padX + (W - 2 * padX) * (s / 100);
  
  return (
    <div className="bg-black/30 border border-stone-900 px-4 py-3">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" preserveAspectRatio="xMidYMid meet" style={{ display: "block" }}>
        {/* Stage bands (background) */}
        {[
          { from: 0,  to: 25,  fill: "rgba(244, 63, 94, 0.06)" },
          { from: 25, to: 50,  fill: "rgba(245, 158, 11, 0.06)" },
          { from: 50, to: 75,  fill: "rgba(132, 204, 22, 0.06)" },
          { from: 75, to: 100, fill: "rgba(52, 211, 153, 0.06)" },
        ].map((band, i) => (
          <rect 
            key={i} 
            x={scoreToX(band.from)} 
            y={trackY - 4} 
            width={scoreToX(band.to) - scoreToX(band.from)} 
            height={trackH + 8} 
            fill={band.fill} 
          />
        ))}
        
        {/* Whisker line: p10 → p90 */}
        <line 
          x1={scoreToX(dist.p10)} 
          y1={trackY + trackH / 2} 
          x2={scoreToX(dist.p90)} 
          y2={trackY + trackH / 2} 
          stroke="#57534e" 
          strokeWidth="1" 
        />
        {/* Whisker caps */}
        {[dist.p10, dist.p90].map((v, i) => (
          <line 
            key={i} 
            x1={scoreToX(v)} 
            y1={trackY + 6} 
            x2={scoreToX(v)} 
            y2={trackY + trackH - 6} 
            stroke="#57534e" 
            strokeWidth="1.5" 
          />
        ))}
        
        {/* Box: p25 → p75 */}
        <rect 
          x={scoreToX(dist.p25)} 
          y={trackY} 
          width={scoreToX(dist.p75) - scoreToX(dist.p25)} 
          height={trackH} 
          fill="#1c1917" 
          stroke="#78716c" 
          strokeWidth="0.8" 
        />
        
        {/* Median line inside the box */}
        <line 
          x1={scoreToX(dist.p50)} 
          y1={trackY} 
          x2={scoreToX(dist.p50)} 
          y2={trackY + trackH} 
          stroke="#a8a29e" 
          strokeWidth="2" 
        />
        
        {/* Player marker: large amber dot */}
        <g>
          <circle 
            cx={scoreToX(playerScore)} 
            cy={trackY + trackH / 2} 
            r="9" 
            fill="rgba(251, 191, 36, 0.25)" 
          />
          <circle 
            cx={scoreToX(playerScore)} 
            cy={trackY + trackH / 2} 
            r="5" 
            fill="#fbbf24" 
            stroke="#0a0c0d" 
            strokeWidth="2" 
          />
          <text 
            x={scoreToX(playerScore)} 
            y={trackY - 8} 
            textAnchor="middle" 
            fill="#fbbf24" 
            fontSize="11" 
            fontFamily="JetBrains Mono, monospace" 
            fontWeight="bold"
          >
            YOU · {playerScore}
          </text>
        </g>
        
        {/* Percentile labels below the track */}
        {[
          { label: "p10", value: dist.p10 },
          { label: "p25", value: dist.p25 },
          { label: "p50", value: dist.p50 },
          { label: "p75", value: dist.p75 },
          { label: "p90", value: dist.p90 },
        ].map((m, i) => (
          <g key={i}>
            <text 
              x={scoreToX(m.value)} 
              y={trackY + trackH + 16} 
              textAnchor="middle" 
              fill="#78716c" 
              fontSize="9" 
              fontFamily="JetBrains Mono, monospace"
            >
              {m.value.toFixed(0)}
            </text>
            <text 
              x={scoreToX(m.value)} 
              y={trackY + trackH + 27} 
              textAnchor="middle" 
              fill="#52525b" 
              fontSize="7" 
              fontFamily="JetBrains Mono, monospace"
            >
              {m.label}
            </text>
          </g>
        ))}
        
        {/* X-axis stage labels */}
        {[
          { label: "Stagnating", center: 12.5 },
          { label: "Emerging", center: 37.5 },
          { label: "Scaling", center: 62.5 },
          { label: "Future-Built", center: 87.5 },
        ].map((s, i) => (
          <text 
            key={i} 
            x={scoreToX(s.center)} 
            y={trackY - 22} 
            textAnchor="middle" 
            fill="#3f3f46" 
            fontSize="7" 
            fontFamily="JetBrains Mono, monospace"
          >
            {s.label.toUpperCase()}
          </text>
        ))}
      </svg>
    </div>
  );
}

/* ============ PDF CHART HELPERS ============
   Module-scope functions called from the full-report generator. All draw
   into a jsPDF doc using primitives only. */

/* drawSCurveOnPdf: score-on-curve chart with player marker.
   x, y: top-left corner. w, h: chart dimensions.
   ctx: { playerScore, benchAvg, distribution, C } */
function drawSCurveOnPdf(doc, x, y, w, h, ctx) {
  const { playerScore, benchAvg, distribution, C } = ctx;
  const Y_TOP = y + 16;
  const Y_BOTTOM = y + h - 24;
  const X_LEFT = x + 30;
  const X_RIGHT = x + w - 16;
  
  const scoreToX = (s) => X_LEFT + ((s / 100) * (X_RIGHT - X_LEFT));
  const sigmoid = (s) => 1 / (1 + Math.exp(-0.06 * (s - benchAvg)));
  const getCurveY = (s) => Y_BOTTOM - (Y_BOTTOM - Y_TOP) * sigmoid(s);
  
  // Background area (very light fill under curve)
  doc.setFillColor(248, 250, 250);
  doc.rect(X_LEFT, Y_TOP, X_RIGHT - X_LEFT, Y_BOTTOM - Y_TOP, "F");
  
  // X-axis labels (0, 25, 50, 75, 100)
  [0, 25, 50, 75, 100].forEach(score => {
    const sx = scoreToX(score);
    doc.setDrawColor(...C.hairline);
    doc.setLineWidth(0.3);
    doc.line(sx, Y_BOTTOM, sx, Y_BOTTOM + 4);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(...C.muted);
    doc.text(`${score}`, sx, Y_BOTTOM + 12, { align: "center" });
  });
  // Stage labels
  doc.setFont("helvetica", "normal");
  doc.setFontSize(6);
  doc.setTextColor(...C.muted);
  ["Stagnating", "Emerging", "Scaling", "Future-Built"].forEach((s, i) => {
    const cx = scoreToX(12.5 + i * 25);
    doc.text(s.toUpperCase(), cx, Y_BOTTOM + 22, { align: "center" });
  });
  
  // Draw the S-curve as a polyline
  doc.setDrawColor(...C.brandGreen);
  doc.setLineWidth(1.5);
  let prevX = null, prevY = null;
  for (let s = 0; s <= 100; s += 2) {
    const cx = scoreToX(s);
    const cy = getCurveY(s);
    if (prevX !== null) {
      doc.line(prevX, prevY, cx, cy);
    }
    prevX = cx;
    prevY = cy;
  }
  
  // Benchmark average vertical line
  const benchX = scoreToX(benchAvg);
  doc.setDrawColor(...C.muted);
  doc.setLineWidth(0.5);
  doc.setLineDashPattern([2, 2], 0);
  doc.line(benchX, Y_TOP, benchX, Y_BOTTOM);
  doc.setLineDashPattern([], 0);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  doc.setTextColor(...C.muted);
  doc.text(`bench avg ${benchAvg.toFixed(1)}`, benchX, Y_TOP - 4, { align: "center" });
  
  // Summit threshold vertical line at 75
  const summitX = scoreToX(75);
  doc.setDrawColor(...C.emerald);
  doc.setLineWidth(0.5);
  doc.setLineDashPattern([3, 3], 0);
  doc.line(summitX, Y_TOP, summitX, Y_BOTTOM);
  doc.setLineDashPattern([], 0);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  doc.setTextColor(...C.emerald);
  doc.text("summit · 75", summitX, Y_TOP - 4, { align: "center" });
  
  // Player marker

/* drawRadarOnPdf: 8-axis radar with archetype + player overlay.
   cx, cy: center. r: outer radius.
   ctx: { archetypeProfile, playerDomains, domainKeys, domainLabels, C } */
function drawRadarOnPdf(doc, cx, cy, r, ctx) {
  const { archetypeProfile, playerDomains, domainKeys, domainLabels, C } = ctx;
  const N = domainKeys.length;
  
  const angleFor = (i) => -Math.PI / 2 + (i * 2 * Math.PI / N);
  const pointFor = (i, score) => {
    const rr = (score / 100) * r;
    const a = angleFor(i);
    return { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr };
  };
  
  // Concentric reference rings
  [25, 50, 75, 100].forEach((s, i) => {
    const rr = (s / 100) * r;
    doc.setDrawColor(...C.hairline);
    doc.setLineWidth(0.3);
    if (s !== 100) {
      doc.setLineDashPattern([1, 2], 0);
    }
    doc.circle(cx, cy, rr, "S");
    doc.setLineDashPattern([], 0);
  });
  
  // Radial axis lines
  domainKeys.forEach((d, i) => {
    const outer = pointFor(i, 100);
    doc.setDrawColor(...C.hairline);
    doc.setLineWidth(0.3);
    doc.line(cx, cy, outer.x, outer.y);
  });
  
  // Helper: build consecutive deltas for jsPDF.lines(); each entry is the
  // delta from the PREVIOUS vertex, not from the start
  const consecutiveDeltas = (pts) => {
    const out = [];
    for (let i = 1; i < pts.length; i++) {
      out.push([pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y]);
    }
    // Closing segment back to vertex 0
    out.push([pts[0].x - pts[pts.length - 1].x, pts[0].y - pts[pts.length - 1].y]);
    return out;
  };
  
  // Archetype polygon (filled)
  const archPoints = domainKeys.map((d, i) => pointFor(i, archetypeProfile[d] ?? 0));
  doc.setFillColor(220, 240, 232);
  doc.setDrawColor(...C.brandGreen);
  doc.setLineWidth(1.2);
  doc.lines(consecutiveDeltas(archPoints), archPoints[0].x, archPoints[0].y, [1, 1], "FD", false);
  
  // Player polygon (overlay, no fill, dashed)
  const playerPoints = domainKeys.map((d, i) => pointFor(i, playerDomains[d] ?? 0));
  doc.setDrawColor(251, 191, 36);
  doc.setLineWidth(1.2);
  doc.setLineDashPattern([2, 1.5], 0);
  doc.lines(consecutiveDeltas(playerPoints), playerPoints[0].x, playerPoints[0].y, [1, 1], "S", false);
  doc.setLineDashPattern([], 0);
  
  // Player vertex dots
  playerPoints.forEach(p => {
    doc.setFillColor(251, 191, 36);
    doc.circle(p.x, p.y, 1.8, "F");
  });
  
  // Domain labels around the outside
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7);
  doc.setTextColor(80, 80, 80);
  domainKeys.forEach((d, i) => {
    const a = angleFor(i);
    const lr = r + 12;
    const lx = cx + Math.cos(a) * lr;
    const ly = cy + Math.sin(a) * lr + 2;
    const align = lx < cx - 5 ? "right" : lx > cx + 5 ? "left" : "center";
    doc.text(domainLabels[d] || d, lx, ly, { align });
  });
}

/* renderActionBlock: block of bullets for practical actions sections.
   Returns the y position after rendering. */
function renderActionBlock(doc, x, y, title, items, accentColor, C, F) {
  // Heading
  doc.setFont(F.sans, "bold");
  doc.setFontSize(9);
  doc.setTextColor(...accentColor);
  doc.text(title, x, y);
  // Underline
  doc.setDrawColor(...accentColor);
  doc.setLineWidth(0.7);
  doc.line(x, y + 3, x + 80, y + 3);
  y += 18;
  
  // Items
  doc.setFont(F.sans, "normal");
  doc.setFontSize(9.5);
  doc.setTextColor(50, 60, 70);
  const w = 595.28 - 2 * 42 - 12;
  items.forEach(item => {
    // Bullet marker
    doc.setFillColor(...accentColor);
    doc.circle(x + 4, y + 4, 1.5, "F");
    // Item text (indent)
    const lines = doc.splitTextToSize(item, w);
    doc.text(lines, x + 14, y + 7);
    y += lines.length * 12 + 6;
  });
  return y;
}

  const percentile = (() => {
    const dist = bench.distribution;

    const scaling = dist.scaling;
    const futureBuilt = dist.futureBuilt ?? dist.futurebuilt ?? 0;
    if (playerScore >= 75) return 100 - futureBuilt / 2;
    if (playerScore >= 50) return stagnating + emerging + (scaling * (playerScore - 50) / 25);

  /* ============ FULL REPORT PDF GENERATOR ============

/* ============ S-CURVE CHART · shows player on benchmark curve with peer dots ============
   When zoomed into a sector: curve is the sector's distribution, peer dots are
   SIBLING sectors in the same industry (the most relevant comparison). Industry
   average is shown as a secondary marker.
   When not zoomed (industry-only): curve is the industry, peer dots are other industries. */
function SCurveChart({ bench, benchLabel, industryData, hasSectorZoom, playerScore, playerStage, highlightSibling }) {
  // Chart geometry (SVG coords: y=0 is top, y=360 is bottom where x-axis sits)
  const Y_TOP = 30;      // visual top of curve (at highest score)
  const Y_BOTTOM = 330;  // visual bottom of curve (at lowest score)

  // Map score to X (0-100 → 50-750 px)
  const scoreToX = (score) => 50 + (750 - 50) * (score / 100);

  // Rising S-curve: inflection at the benchmark average
  const getCurveY = (score, avg) => {
    const k = 0.06;
    const sigmoid = 1 / (1 + Math.exp(-k * (score - avg)));
    return Y_BOTTOM - (Y_BOTTOM - Y_TOP) * sigmoid;
  };

  // Player position ON the curve
  const playerX = scoreToX(playerScore);
  const playerY = getCurveY(playerScore, bench.avgScore);

  // Main curve path
  const samples = 50;
  const curvePath = Array.from({ length: samples + 1 }).map((_, i) => {
    const score = (i / samples) * 100;
    return `${i === 0 ? "M" : "L"} ${scoreToX(score).toFixed(1)} ${getCurveY(score, bench.avgScore).toFixed(1)}`;
  }).join(" ");
  const fillPath = `${curvePath} L ${scoreToX(100)} 360 L ${scoreToX(0)} 360 Z`;

  // Peer dots: when zoomed into a sector, show sibling sectors (same industry).
  // Otherwise show other industries.
  let peerDots;
  let peerLegendLabel;
  if (hasSectorZoom) {
    const industryKey = Object.keys(INDUSTRY_DATA).find(k => INDUSTRY_DATA[k] === industryData);
    const siblingSectors = SECTOR_DATA[industryKey] || {};
    peerDots = Object.entries(siblingSectors)
      .filter(([name]) => name !== benchLabel)
      .map(([name, d]) => ({
        key: name,
        label: name,
        avg: d.avgScore,
        x: scoreToX(d.avgScore),
        y: getCurveY(d.avgScore, bench.avgScore),
      }));
    peerLegendLabel = `Sibling sectors in ${industryData.label}`;
  } else {
    peerDots = INDUSTRY_KEYS.filter(k => INDUSTRY_DATA[k] !== bench).map(k => {
      const s = INDUSTRY_DATA[k];
      return {
        key: k,
        label: s.label,
        avg: s.avgScore,
        x: scoreToX(s.avgScore),
        y: getCurveY(s.avgScore, bench.avgScore),
      };
    });
    peerLegendLabel = "Peer industries";
  }

  // Industry-level reference (only shown when zoomed into a sector)
  const industryAvgX = hasSectorZoom ? scoreToX(industryData.avgScore) : null;
  const industryAvgY = hasSectorZoom ? getCurveY(industryData.avgScore, bench.avgScore) : null;

  // Global average
  const globalAvg = INDUSTRY_KEYS.reduce((sum, k) => sum + INDUSTRY_DATA[k].avgScore, 0) / INDUSTRY_KEYS.length;
  const globalAvgX = scoreToX(globalAvg);
  const globalAvgY = getCurveY(globalAvg, bench.avgScore);

  // Highlight rules for peer dots (extremes + adjacent-to-player-benchmark)
  const sortedByAvg = [...peerDots].sort((a, b) => a.avg - b.avg);
  const highlightKeys = new Set();
  if (sortedByAvg.length > 0) {
    highlightKeys.add(sortedByAvg[0].key);
    highlightKeys.add(sortedByAvg[sortedByAvg.length - 1].key);
    const below = [...sortedByAvg].reverse().find(p => p.avg < bench.avgScore);
    const above = sortedByAvg.find(p => p.avg > bench.avgScore);
    if (below) highlightKeys.add(below.key);
    if (above) highlightKeys.add(above.key);
  }
  // User-requested highlight: always include this sibling, even if it wouldn't
  // have been highlighted by the default rules. Marks it specially for amber tint.
  if (highlightSibling) {
    highlightKeys.add(highlightSibling);
  }

  const shortLabel = (label) => {
    const first = label.split(",")[0].split(" & ")[0].split(" / ")[0].trim();
    return first.length > 14 ? first.substring(0, 13) + "…" : first;
  };
  
  // ---- Collision-aware label placement ----
  // Build the set of peer labels to consider drawing. Then:
  //   1. Hide any peer label too close to the player marker (player's callout owns that zone)
  //   2. Hide any peer label too close to the global avg marker (global has its own label)
  //   3. Sort the remaining by x position, alternating above/below
  //   4. Within each side, hide labels that would overlap horizontally with the previous one
  const PLAYER_BLOCK_RADIUS = 8;   // score points around the player to keep clear
  const GLOBAL_BLOCK_RADIUS = 6;   // score points around the global avg
  const MIN_X_GAP = 70;            // px between consecutive same-side labels
  
  const labelPlacements = (() => {
    // Step 1+2: filter peers near player or global avg
    const candidates = peerDots
      .filter(d => highlightKeys.has(d.key))
      .filter(d => d.key !== highlightSibling)  // user-highlighted gets its own placement, below
      .filter(d => Math.abs(d.avg - playerScore) > PLAYER_BLOCK_RADIUS)
      .filter(d => Math.abs(d.avg - globalAvg) > GLOBAL_BLOCK_RADIUS);
    
    // Step 3+4: sort by x, alternate sides, suppress overlapping
    candidates.sort((a, b) => a.x - b.x);
    const placements = {};
    let lastAboveX = -Infinity;
    let lastBelowX = -Infinity;
    let nextSide = "above";
    for (const c of candidates) {
      const tryAbove = nextSide === "above";
      const lastX = tryAbove ? lastAboveX : lastBelowX;
      if (c.x - lastX >= MIN_X_GAP) {
        placements[c.key] = tryAbove ? "above" : "below";
        if (tryAbove) lastAboveX = c.x;
        else lastBelowX = c.x;
        nextSide = tryAbove ? "below" : "above";
      } else {
        // Try the OTHER side instead
        const otherSide = tryAbove ? "below" : "above";
        const otherLastX = tryAbove ? lastBelowX : lastAboveX;
        if (c.x - otherLastX >= MIN_X_GAP) {
          placements[c.key] = otherSide;
          if (otherSide === "above") lastAboveX = c.x;
          else lastBelowX = c.x;
          // Keep nextSide as is (we already used the other one)
        }
        // If neither side has room, drop the label entirely
      }
    }
    
    // The user-highlighted sibling ALWAYS gets a placement (user explicitly asked for it).
    // Choose the side away from the player callout to minimize overlap risk.
    if (highlightSibling) {
      const playerCalloutGoesUp = playerScore < 70;
      placements[highlightSibling] = playerCalloutGoesUp ? "below" : "above";
    }
    
    return placements;
  })();

  return (
    <div className="border border-stone-800 bg-black/40 backdrop-blur p-8 relative">
      <div className="text-sm text-stone-500 mb-6">
        The S-curve rising from base to summit, showing the distribution of all {bench.n.toLocaleString()} climbers in {benchLabel}. Your position is plotted on the curve. {hasSectorZoom ? `Sibling sectors in ${industryData.label} shown as reference dots.` : "Other industry averages shown as reference dots."}
      </div>

      <div className="relative" style={{ minHeight: "440px" }}>
        <svg viewBox="0 0 800 400" className="w-full h-full" style={{ maxHeight: "500px" }}>
          <defs>
            <linearGradient id="sCurveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#34d399" stopOpacity="0.4" />
              <stop offset="100%" stopColor="#34d399" stopOpacity="0.05" />
            </linearGradient>
          </defs>

          {/* Stage bands */}
          {[
            { y: 0, h: 90, color: "#34d399", label: "Future-built · 75–100", opacity: 0.05 },
            { y: 90, h: 90, color: "#84cc16", label: "Scaling · 50–75", opacity: 0.04 },
            { y: 180, h: 90, color: "#f59e0b", label: "Emerging · 25–50", opacity: 0.04 },
            { y: 270, h: 90, color: "#f43f5e", label: "Stagnating · 0–25", opacity: 0.04 },
          ].map((b, i) => (
            <g key={i}>
              <rect x="0" y={b.y} width="800" height={b.h} fill={b.color} opacity={b.opacity} />
              <line x1="0" y1={b.y + b.h} x2="800" y2={b.y + b.h} stroke="#1c1917" strokeWidth="1" />
              <text x="10" y={b.y + 14} fill={b.color} fontSize="10" fontFamily="monospace" opacity="0.6">{b.label}</text>
            </g>
          ))}

          {/* Main curve (fill + stroke) */}
          <path d={fillPath} fill="url(#sCurveGrad)" opacity="0.7" />
          <path d={curvePath} fill="none" stroke="#34d399" strokeWidth="2" />

          {/* Benchmark (sector or industry) average marker */}
          <line x1={scoreToX(bench.avgScore)} y1="30" x2={scoreToX(bench.avgScore)} y2="360" stroke="#44403c" strokeWidth="1" strokeDasharray="2,2" />
          <text x={scoreToX(bench.avgScore)} y="22" fill="#a8a29e" fontSize="10" fontFamily="monospace" textAnchor="middle">
            {hasSectorZoom ? "Sector avg" : "Industry avg"}: {bench.avgScore}
          </text>

          {/* Industry-level average (secondary, only when zoomed).
              Two placement modes:
                - Default: label sits directly above the dot, with the dashed
                  vertical line as the implicit connector
                - When the player is close in x (dense cluster zone): label
                  is pushed RIGHT into the open chart space, with an explicit
                  L-shaped leader line connecting it back to the dot. This
                  uses the empty right side of the chart instead of cramming
                  everything into the inflection cluster. */}
          {hasSectorZoom && Math.abs(industryData.avgScore - bench.avgScore) > 0.5 && (() => {
            const xDistanceToPlayer = Math.abs(industryData.avgScore - playerScore);
            const playerIsClose = xDistanceToPlayer < 10;
            
            if (!playerIsClose) {
              // Simple default: label above the dot, dashed vertical does the connecting
              return (
                <g opacity="0.7">
                  <line x1={industryAvgX} y1="30" x2={industryAvgX} y2="360" stroke="#78716c" strokeWidth="1" strokeDasharray="1,4" />
                  <circle cx={industryAvgX} cy={industryAvgY} r="3" fill="#a8a29e" stroke="#0a0c0d" strokeWidth="1" />
                  <text x={industryAvgX} y={industryAvgY - 14} fill="#a8a29e" fontSize="9" fontFamily="monospace" textAnchor="middle">
                    {industryData.label} · {industryData.avgScore}
                  </text>
                </g>
              );
            }
            
            // Crowded mode: push label to the right, into the empty zone.
            // Put it at score=70 horizontally (well past the cluster) and at the
            // industryAvg's y so the label sits on the curve's level visually.
            // Choose direction: by default go right; if player goes down-left
            // (score >= 70), go left instead.
            const pushRight = playerScore < 65;
            const labelAnchorX = pushRight ? scoreToX(62) : scoreToX(20);
            const textAnchor = pushRight ? "start" : "end";
            // Label sits at the dot's y (visually paired)
            const labelY = industryAvgY + 3;
            // Elbow leader: dot → small lateral offset → up/level to label
            const elbow1X = industryAvgX + (pushRight ? 10 : -10);
            const elbow1Y = industryAvgY;
            const elbow2X = labelAnchorX + (pushRight ? -4 : 4);
            const elbow2Y = labelY - 3;
            
            return (
              <g opacity="0.85">
                {/* Dashed vertical kept for x-position reference, but lighter */}
                <line x1={industryAvgX} y1="30" x2={industryAvgX} y2="360" stroke="#78716c" strokeWidth="1" strokeDasharray="1,4" opacity="0.5" />
                {/* The dot */}
                <circle cx={industryAvgX} cy={industryAvgY} r="3.5" fill="#a8a29e" stroke="#0a0c0d" strokeWidth="1.5" />
                {/* Elbow leader line: small horizontal stub at dot, then long horizontal to label */}
                <polyline 
                  points={`${industryAvgX},${industryAvgY} ${elbow1X},${elbow1Y} ${elbow2X},${elbow2Y}`} 
                  fill="none" 
                  stroke="#78716c" 
                  strokeWidth="0.8" 
                />
                {/* Label, anchored to start (left-aligned) on the right side */}
                <text 
                  x={labelAnchorX} 
                  y={labelY} 
                  fill="#a8a29e" 
                  fontSize="10" 
                  fontFamily="monospace" 
                  textAnchor={textAnchor}
                >
                  {industryData.label} · {industryData.avgScore}
                </text>
              </g>
            );
          })()}

          {/* Summit threshold at 75 */}
          <line x1={scoreToX(75)} y1="30" x2={scoreToX(75)} y2="360" stroke="#34d399" strokeWidth="1" strokeDasharray="3,4" opacity="0.4" />
          <text x={scoreToX(75)} y="22" fill="#34d399" fontSize="9" fontFamily="monospace" textAnchor="middle" opacity="0.7">Summit · 75</text>

          {/* Peer dots */}
          {peerDots.map((dot) => {
            const placement = labelPlacements[dot.key];  // "above" | "below" | undefined
            const showLabel = !!placement;
            const isHighlighted = highlightKeys.has(dot.key);
            const isUserPick = highlightSibling === dot.key;
            const labelY = placement === "above" ? dot.y - 10 : dot.y + 18;
            return (
              <g key={dot.key} opacity={isUserPick ? 1 : (isHighlighted ? 0.9 : 0.4)}>
                <title>{`${dot.label} · avg ${dot.avg}`}</title>
                {/* User-highlighted dot gets a soft amber halo to make it stand out */}
                {isUserPick && (
                  <circle cx={dot.x} cy={dot.y} r="11" fill="#fbbf24" opacity="0.18" />
                )}
                <circle
                  cx={dot.x} cy={dot.y}
                  r={isUserPick ? 5.5 : (isHighlighted ? 4.5 : 3)}
                  fill={isUserPick ? "#fbbf24" : (isHighlighted ? "#a8a29e" : "#57534e")}
                  stroke="#0a0c0d" strokeWidth="1.5" />
                {showLabel && (
                  <text 
                    x={dot.x} 
                    y={labelY} 
                    fill={isUserPick ? "#fbbf24" : "#d6d3d1"} 
                    fontSize={isUserPick ? "10" : "9"} 
                    fontFamily="monospace" 
                    textAnchor="middle"
                    fontWeight={isUserPick ? "bold" : "normal"}
                  >
                    {shortLabel(dot.label)} · {dot.avg}
                  </text>
                )}
              </g>
            );
          })}

          {/* Global average */}
          <g opacity="0.85">
            <title>{`Global average across all industries · ${globalAvg.toFixed(1)}`}</title>
            <circle cx={globalAvgX} cy={globalAvgY} r="5.5" fill="none" stroke="#60a5fa" strokeWidth="2" />
            <circle cx={globalAvgX} cy={globalAvgY} r="2" fill="#60a5fa" />
            {Math.abs(globalAvg - playerScore) > 6 && (
              <text x={globalAvgX} y={globalAvgY + 20} fill="#93c5fd" fontSize="9" fontFamily="monospace" textAnchor="middle" fontWeight="600">
                Global avg · {globalAvg.toFixed(1)}
              </text>
            )}
          </g>

          {/* PLAYER DOT */}
          <g>
            <circle cx={playerX} cy={playerY} r="18" fill="#fbbf24" opacity="0.15" className="pulse-slow" />
            <circle cx={playerX} cy={playerY} r="11" fill="#fbbf24" opacity="0.4" />
            <circle cx={playerX} cy={playerY} r="7" fill="#fbbf24" stroke="#0a0c0d" strokeWidth="2.5" />
            {(() => {
              const goDownLeft = playerScore >= 70;
              const boxW = 120, boxH = 36;
              const boxX = goDownLeft ? playerX - boxW - 50 : playerX + 50;
              const boxY = goDownLeft ? playerY + 30 : playerY - 65;
              const lineEndX = goDownLeft ? playerX - 50 : playerX + 50;
              const lineEndY = goDownLeft ? playerY + 30 : playerY - 45;
              const textX = boxX + 10;
              return (
                <>
                  <line x1={playerX} y1={playerY} x2={lineEndX} y2={lineEndY} stroke="#fbbf24" strokeWidth="1" />
                  <rect x={boxX} y={boxY} width={boxW} height={boxH} fill="#0a0c0d" stroke="#fbbf24" strokeWidth="1.5" />
                  <text x={textX} y={boxY + 16} fill="#fbbf24" fontSize="12" fontFamily="monospace" fontWeight="bold">YOU · {playerScore}</text>
                  <text x={textX} y={boxY + 29} fill="#fbbf24" fontSize="9" fontFamily="monospace" opacity="0.7">{playerStage}</text>
                </>
              );
            })()}
          </g>

          {/* X-axis */}
          <line x1="50" y1="360" x2="750" y2="360" stroke="#57534e" strokeWidth="1" />
          {[0, 25, 50, 75, 100].map((v) => {
            const x = scoreToX(v);
            return (
              <g key={v}>
                <line x1={x} y1="358" x2={x} y2="362" stroke="#57534e" strokeWidth="1" />
                <text x={x} y="378" fill="#78716c" fontSize="9" fontFamily="monospace" textAnchor="middle">{v}</text>
              </g>
            );
          })}
          <text x="400" y="395" fill="#78716c" fontSize="10" fontFamily="monospace" textAnchor="middle">BFF × AI Score →</text>
        </svg>

        {/* Legend */}
        <div className="absolute bottom-2 right-2 bg-black/80 border border-stone-800 p-3 flex flex-col gap-1.5 text-[10px] uppercase tracking-wider font-mono-custom">
          <div className="flex items-center gap-2"><div className="w-6 h-0.5 bg-emerald-400" /><span className="text-stone-300">{benchLabel}</span></div>
          {hasSectorZoom && <div className="flex items-center gap-2"><div className="w-6 h-px border-t border-dashed border-stone-500" /><span className="text-stone-400">{industryData.label} avg</span></div>}
          <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full border-2 border-blue-400" /><span className="text-blue-300">Global avg · {globalAvg.toFixed(1)}</span></div>
          <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-stone-400" /><span className="text-stone-400">{peerLegendLabel}</span></div>
          <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-amber-400" /><span className="text-amber-300">You · {playerScore}</span></div>
        </div>
      </div>

      <div className="mt-8 pt-8 border-t border-stone-900 grid grid-cols-3 gap-6">
        <div>
          <div className="text-[11px] uppercase tracking-widest text-stone-500 mb-2">Your score</div>
          <div className="font-display text-6xl text-emerald-400 leading-none">{playerScore}</div>
        </div>
        <div>
          <div className="text-[11px] uppercase tracking-widest text-stone-500 mb-2">{benchLabel} average</div>
          <div className="font-display text-6xl text-stone-300 leading-none">{bench.avgScore}</div>
          <div className={`text-xs mt-2 ${playerScore >= bench.avgScore ? "text-emerald-400" : "text-rose-400"}`}>
            You: {playerScore >= bench.avgScore ? "+" : ""}{(playerScore - bench.avgScore).toFixed(1)} {playerScore >= bench.avgScore ? "above" : "below"}
          </div>
        </div>
        <div>
          <div className="text-[11px] uppercase tracking-widest text-stone-500 mb-2">Summit threshold</div>
          <div className="font-display text-6xl text-stone-300 leading-none">75</div>
          <div className="text-xs text-amber-400 mt-2">{Math.max(0, 75 - playerScore)} points to Future-Built</div>
        </div>
      </div>
    </div>
  );
}

/* ============ RENDER ============ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
