<style>
  body { font-family: 'JetBrains Mono', monospace; background: #0a0c0d; margin: 0; }
  .font-display { font-family: 'Cormorant Garamond', serif; letter-spacing: -0.01em; }
  .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulseSlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  /* Cover page atmospherics: very slow horizontal mist drift, low opacity. The
     duration is intentionally long (60s+) so the motion is barely perceptible
     unless you stare at it; the goal is "this place is alive" not "look at me." */
  @keyframes mistDriftSlow { 
    0%   { transform: translateX(-60px); opacity: 0; } 
    20%  { opacity: 0.18; }
    80%  { opacity: 0.18; }
    100% { transform: translateX(60px); opacity: 0; } 
  }
  @keyframes mistDriftMed { 
    0%   { transform: translateX(60px); opacity: 0; } 
    20%  { opacity: 0.12; }
    80%  { opacity: 0.12; }
    100% { transform: translateX(-60px); opacity: 0; } 
  }
  /* Headlamp glow on the climber: gentle pulse that suggests a moving light. */
  @keyframes headlampPulse { 
    0%, 100% { opacity: 0.5; transform: scale(1); } 
    50%      { opacity: 1.0; transform: scale(1.4); } 
  }
  .animate-fadeIn { animation: fadeIn 0.8s ease-out; }
  .animate-slideUp { animation: slideUp 0.6s ease-out; }
  .pulse-slow { animation: pulseSlow 2.5s ease-in-out infinite; }
  .float-y { animation: floatY 4s ease-in-out infinite; }
  .mist-drift-slow { animation: mistDriftSlow 75s linear infinite; transform-origin: center; }
  .mist-drift-med  { animation: mistDriftMed 55s linear infinite; transform-origin: center; }
  .headlamp-pulse  { animation: headlampPulse 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .paper-noise {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
  }
  /* Custom slider styling */
  input[type="range"].ascent-slider {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: linear-gradient(to right, #f43f5e 0%, #f59e0b 25%, #84cc16 50%, #34d399 75%, #34d399 100%);
    outline: none;
  }
  input[type="range"].ascent-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fbbf24;
    border: 3px solid #0a0c0d;
    box-shadow: 0 0 0 2px #fbbf24, 0 0 20px rgba(251, 191, 36, 0.5);
    cursor: pointer;
  }
  input[type="range"].ascent-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fbbf24;
    border: 3px solid #0a0c0d;
    cursor: pointer;
  }
  input[type="range"].ascent-slider-target {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: #1c1917;
    outline: none;
  }
  input[type="range"].ascent-slider-target::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    background: transparent;
    border: 2px dashed #34d399;
    border-radius: 50%;
    cursor: pointer;
  }
  input[type="range"].ascent-slider-target::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: transparent;
    border: 2px dashed #34d399;
    border-radius: 50%;
    cursor: pointer;
  }
  /* details / summary: hide the default disclosure marker on all browsers,
     and rotate the chevron span when the parent details is open */
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::marker { display: none; }
  details[open] > summary .details-chevron { transform: rotate(90deg); }
  .details-chevron { display: inline-block; transition: transform 0.2s ease; }

/* ============== FACTION AVATAR ==============
   Faction taxonomy is pragmatic (Business / IT / DataAI / Transformation).
   Gartner's published work (CxO 5.0, Digital Vanguard) doesn't prescribe a
   4-way split (emphasises CIO/CxO co-ownership and fusion teams). Our
   factions map to how execs self-identify in BFF respondents. Each avatar
   shares a common silhouette but varies in accent colour, chest tool,
   headgear, and carried gear. */
const FACTION_PALETTE = {
  Business:       { light: "#fbbf24", dark: "#d97706", glow: "#f59e0b" }, // amber
  IT:             { light: "#34d399", dark: "#059669", glow: "#10b981" }, // emerald
  DataAI:         { light: "#c4b5fd", dark: "#7c3aed", glow: "#a78bfa" }, // violet
  Transformation: { light: "#7dd3fc", dark: "#0284c7", glow: "#38bdf8" }, // sky
};

function FactionAvatar({ faction }) {
  const p = FACTION_PALETTE[faction] || FACTION_PALETTE.Business;
  const gradBodyId = `avatarBody_${faction}`;
  const gradAccentId = `avatarAccent_${faction}`;

  // Chest equipment varies per faction
  const ChestGear = () => {
    if (faction === "Business") {
      // Briefcase / portfolio across chest
      return (
        <g>
          <rect x="48" y="92" width="24" height="18" rx="1.5" fill="#2a2520" stroke={p.light} strokeWidth="0.6" />
          <rect x="56" y="89" width="8" height="4" fill="#2a2520" stroke={p.light} strokeWidth="0.5" />
          <line x1="48" y1="101" x2="72" y2="101" stroke={p.light} strokeWidth="0.4" opacity="0.7" />
          <circle cx="60" cy="101" r="1" fill={p.light} />
        </g>
      );
    }
    if (faction === "IT") {
      // Circuit/server rack with blinking lights
      return (
        <g>
          <rect x="50" y="90" width="20" height="32" rx="2" fill="#1a2a2a" stroke={p.light} strokeWidth="0.4" />
          <rect x="54" y="94" width="12" height="1.5" fill={p.light} opacity="0.9" />
          <rect x="54" y="98" width="8" height="1.5" fill={p.light} opacity="0.6" />
          <rect x="54" y="102" width="12" height="1.5" fill={p.light} opacity="0.7" />
          <rect x="54" y="106" width="6" height="1.5" fill={p.light} opacity="0.5" />
          <rect x="54" y="110" width="10" height="1.5" fill={p.light} opacity="0.8" />
          <circle cx="67" cy="116" r="0.8" fill={p.light} className="pulse-slow" />
          <circle cx="64" cy="116" r="0.8" fill={p.light} opacity="0.4" />
        </g>
      );
    }
    if (faction === "DataAI") {
      // Neural network / connected nodes
      return (
        <g>
          <rect x="50" y="90" width="20" height="32" rx="2" fill="#1f1a2e" stroke={p.light} strokeWidth="0.4" />
          {/* Nodes */}
          <circle cx="55" cy="97" r="1.4" fill={p.light} />
          <circle cx="65" cy="97" r="1.4" fill={p.light} />
          <circle cx="60" cy="106" r="1.4" fill={p.light} />
          <circle cx="55" cy="115" r="1.4" fill={p.light} />
          <circle cx="65" cy="115" r="1.4" fill={p.light} />
          {/* Edges */}
          <line x1="55" y1="97" x2="60" y2="106" stroke={p.light} strokeWidth="0.5" opacity="0.6" />
          <line x1="65" y1="97" x2="60" y2="106" stroke={p.light} strokeWidth="0.5" opacity="0.6" />
          <line x1="60" y1="106" x2="55" y2="115" stroke={p.light} strokeWidth="0.5" opacity="0.6" />
          <line x1="60" y1="106" x2="65" y2="115" stroke={p.light} strokeWidth="0.5" opacity="0.6" />
        </g>
      );
    }
    // Transformation (compass / arrows radiating)
    return (
      <g>
        <rect x="50" y="90" width="20" height="32" rx="2" fill="#1a2230" stroke={p.light} strokeWidth="0.4" />
        <circle cx="60" cy="106" r="8" fill="none" stroke={p.light} strokeWidth="0.6" opacity="0.8" />

      </g>
    );

  // Carried gear (top of axe/antenna) varies per faction
  const CarriedGear = () => {

    if (faction === "IT") {

    if (faction === "DataAI") {

    }
    // Transformation (lantern, guiding light)
    return (
      <g>
        <line x1="84" y1="128" x2="96" y2="72" stroke="#8b7355" strokeWidth="1.5" />

        <line x1="96" y1="60" x2="96" y2="62" stroke={p.light} strokeWidth="1" />
      </g>
    );
  };

  // Headgear band varies per faction
  const HeadBand = () => (
    <rect x="50" y="48" width="20" height="3" fill={p.light} opacity="0.75" />
  );

  return (
    <svg viewBox="0 0 120 180" className="w-48 h-72">
      <defs>
        <linearGradient id={gradBodyId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1c2929" /><stop offset="100%" stopColor="#0f1717" />
        </linearGradient>
        <linearGradient id={gradAccentId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={p.light} /><stop offset="100%" stopColor={p.dark} />
        </linearGradient>
        <radialGradient id={`avatarGlow_${faction}`} cx="0.5" cy="0.5" r="0.5">
          <stop offset="0%" stopColor={p.glow} stopOpacity="0.3" />
          <stop offset="100%" stopColor={p.glow} stopOpacity="0" />
        </radialGradient>
      </defs>
      {/* Ambient faction glow */}
      <circle cx="60" cy="100" r="70" fill={`url(#avatarGlow_${faction})`} />
      {/* Shadow */}
      <ellipse cx="60" cy="172" rx="20" ry="3" fill="#000" opacity="0.4" />
      {/* Legs */}
      <path d="M 52 130 L 50 168 L 58 168 L 60 130 Z" fill="#1c2929" />
      <path d="M 60 130 L 64 168 L 72 168 L 68 130 Z" fill="#262f2f" />
      {/* Boots */}
      <rect x="46" y="165" width="14" height="6" fill="#0f1717" />
      <rect x="62" y="165" width="14" height="6" fill="#0f1717" />
      {/* Torso */}
      <path d="M 44 82 Q 42 78 48 76 L 72 76 Q 78 78 76 82 L 76 135 Q 76 138 72 138 L 48 138 Q 44 138 44 135 Z" fill={`url(#${gradBodyId})`} />
      {/* Side accent stripes */}
      <path d="M 46 84 Q 46 100 48 118" stroke={`url(#${gradAccentId})`} strokeWidth="1.5" fill="none" />
      <path d="M 74 84 Q 74 100 72 118" stroke={`url(#${gradAccentId})`} strokeWidth="1.5" fill="none" />
      {/* Faction-specific chest gear */}
      <ChestGear />
      {/* Arms */}
      <path d="M 44 88 Q 32 100 36 128" stroke="#1c2929" strokeWidth="7" fill="none" strokeLinecap="round" />
      <path d="M 76 88 Q 88 100 84 128" stroke="#1c2929" strokeWidth="7" fill="none" strokeLinecap="round" />
      {/* Hands */}
      <circle cx="36" cy="128" r="3.5" fill="#3a4a4a" />
      <circle cx="84" cy="128" r="3.5" fill="#3a4a4a" />
      {/* Faction-specific carried gear (top of staff/axe/antenna) */}
      <CarriedGear />
      {/* Neck */}
      <rect x="54" y="70" width="12" height="8" fill="#1c2929" />
      {/* Head */}
      <path d="M 48 50 Q 48 38 60 38 Q 72 38 72 50 L 72 68 Q 72 72 68 72 L 52 72 Q 48 72 48 68 Z" fill={`url(#${gradBodyId})`} />
      {/* Headband */}
      <HeadBand />
    </svg>
  );
}

/* ============== ADAPTER LAYER ==============
   Bridges ASCENT_DATA shape to what the rest of the code expects. The legs
   and questionnaire don't need to know we rebuilt the data layer underneath. */
const SECTOR_SMALL_SAMPLE_THRESHOLD = 25;
const INDUSTRY_KEYS = Object.keys(ASCENT_DATA.industries);

// Build the legacy-compatible INDUSTRY_DATA shape (what the World step renders)
const INDUSTRY_DATA = (() => {
  const out = {};
  for (const key of INDUSTRY_KEYS) {
    const ind = ASCENT_DATA.industries[key];
    const meta = INDUSTRY_META[key] || { label: key, terrain: "Unknown range", tagline: "" };
    out[key] = {
      label: meta.label,
      terrain: meta.terrain,
      tagline: meta.tagline,
      n: ind.n,
      avgScore: ind.avgScore,
      distribution: {
        stagnating: ind.distribution.stagnating,
        emerging: ind.distribution.emerging,
        scaling: ind.distribution.scaling,
        futureBuilt: ind.distribution.futurebuilt,  // adapter rename
      },
      domains: ind.domains,
    };
  }
  return out;
})();

const SECTOR_DATA = (() => {
  const out = {};
  for (const indKey of INDUSTRY_KEYS) {
    const sectors = ASCENT_DATA.sectors[indKey] || {};
    out[indKey] = {};
    for (const [secName, sec] of Object.entries(sectors)) {
      out[indKey][secName] = {
        n: sec.n,
        avgScore: sec.avgScore,
        distribution: {
          stagnating: sec.distribution.stagnating,
          emerging: sec.distribution.emerging,
          scaling: sec.distribution.scaling,
          futureBuilt: sec.distribution.futurebuilt,
        },
        domains: sec.domains,
        capabilities: sec.capabilities,
        regions: sec.regions || {},
      };
    }
  }
  return out;
})();

const getSectorsForIndustry = (industryKey) => {
  const m = SECTOR_DATA[industryKey] || {};
  return Object.entries(m).map(([name, d]) => ({ name, ...d })).sort((a, b) => b.avgScore - a.avgScore);
};

const getSectorData = (industryKey, sectorName) => {
  const m = SECTOR_DATA[industryKey] || {};
  return sectorName ? m[sectorName] : null;
};

/* getBenchmark: the unified benchmark resolver for the dashboard.
   Returns the most specific benchmark cell available given the filters,
   plus metadata about which filter actually got applied. Falls back
   gracefully when a region cut would produce too small a sample. */
const getBenchmark = (industryKey, sectorName, regionFilter) => {
  const ind = ASCENT_DATA.industries[industryKey];
  const sec = sectorName && ASCENT_DATA.sectors[industryKey] 
    ? ASCENT_DATA.sectors[industryKey][sectorName] 
    : null;
  
  // Try most specific first: sector × region
  if (sec && regionFilter && sec.regions && sec.regions[regionFilter]) {
    const rcell = sec.regions[regionFilter];
    return {
      cell: { ...sec, ...rcell },  // region cuts only have n+avgScore+domains; merge back over sector for capabilities
      label: `${sectorName} · ${regionFilter}`,
      level: "sector-region",
      n: rcell.n,
      smallSample: rcell.n < SECTOR_SMALL_SAMPLE_THRESHOLD,
    };
  }
  // Sector
  if (sec) {
    return {
      cell: sec,
      label: sectorName,
      level: "sector",
      n: sec.n,
      smallSample: sec.n < SECTOR_SMALL_SAMPLE_THRESHOLD,
    };
  }
  // Industry × region
  if (ind && regionFilter && ind.regions && ind.regions[regionFilter]) {
    const rcell = ind.regions[regionFilter];
    return {
      cell: { ...ind, ...rcell },
      label: `${INDUSTRY_META[industryKey]?.label || industryKey} · ${regionFilter}`,
      level: "industry-region",
      n: rcell.n,
      smallSample: rcell.n < SECTOR_SMALL_SAMPLE_THRESHOLD,
    };
  }
  // Industry only
  if (ind) {
    return {
      cell: ind,
      label: INDUSTRY_META[industryKey]?.label || industryKey,
      level: "industry",
      n: ind.n,
      smallSample: false,
    };
  }
  // Global fallback (shouldn't happen given valid inputs)
  return {
    cell: { avgScore: ASCENT_DATA.meta.globalAvgScore, n: ASCENT_DATA.meta.totalN, domains: {}, distribution: ASCENT_DATA.meta.globalDistribution, dist: ASCENT_DATA.meta.globalDist },
    label: "Global",
    level: "global",
    n: ASCENT_DATA.meta.totalN,
    smallSample: false,
  };
};

/* ============== ARCHETYPE MATCHING ==============
   For a given player domain profile, compute similarity to each of the 6
   archetype centroids using cosine similarity on mean-centered vectors.
   Returns scored, sorted archetype matches with a primary + shadow. */
const matchArchetypes = (playerDomains) => {
  const DOMAIN_ORDER = ASCENT_DATA.meta.domainKeys;
  const playerVec = DOMAIN_ORDER.map(d => playerDomains[d] ?? 0);
  // Mean-center the player vector (we match on shape, not magnitude)
  const playerMean = playerVec.reduce((s, v) => s + v, 0) / playerVec.length;
  const playerCentered = playerVec.map(v => v - playerMean);
  const playerNorm = Math.sqrt(playerCentered.reduce((s, v) => s + v * v, 0));

  if (playerNorm < 1e-6) {
    // Player is perfectly flat: return archetypes ordered by avg score (no shape signal)
    return ASCENT_DATA.archetypes.map(a => ({ ...a, similarity: 0, matchPct: 100 / ASCENT_DATA.archetypes.length }));
  }

  const matches = ASCENT_DATA.archetypes.map(arch => {
    const archVec = DOMAIN_ORDER.map(d => arch.profile[d] ?? 0);
    const archMean = archVec.reduce((s, v) => s + v, 0) / archVec.length;
    const archCentered = archVec.map(v => v - archMean);
    const archNorm = Math.sqrt(archCentered.reduce((s, v) => s + v * v, 0));

    // Cosine similarity on centered vectors
    const dot = playerCentered.reduce((s, v, i) => s + v * archCentered[i], 0);
    const cosSim = dot / (playerNorm * archNorm);  // -1 to +1

    // Convert to a 0-100 match percentage (using affine transform from cosine space)
    // cos=1 → 100%, cos=0 → 50%, cos=-1 → 0%
    const matchPct = Math.round(((cosSim + 1) / 2) * 100);

    return { ...arch, similarity: cosSim, matchPct };
  });

  // Sort by similarity descending
  matches.sort((a, b) => b.similarity - a.similarity);
  return matches;
};

  const out = {};
  for (const c of ASCENT_DATA.capabilities) {
    if (!out[c.domain]) out[c.domain] = [];
    out[c.domain].push(c);
  }
  return out;
})();

  { id: "baseCamp", label: "Base Camp", type: "camp" },
  { id: "leg5", label: "Technology", type: "leg", legNum: 5 },
  { id: "leg6", label: "Data", type: "leg", legNum: 6 },
  { id: "leg7", label: "Op Model", type: "leg", legNum: 7 },
  { id: "finalCamp", label: "Final Camp", type: "camp" },
  { id: "leg8", label: "People", type: "leg", legNum: 8 },
  { id: "summit", label: "Summit" },
];

// Multiplayer respondent journey: World is skipped (industry/sector locked by
// organizer); Character and Threshold gain context awareness via the session.
const RESPONDENT_JOURNEY = [
  { id: "cover", label: "Start" },
  { id: "respondentSetup", label: "Identify" },
  { id: "character", label: "Profile" },
  { id: "threshold", label: "Begin" },
  { id: "leg1", label: "Strategy", type: "leg", legNum: 1 },
  { id: "leg2", label: "Innovation", type: "leg", legNum: 2 },
  { id: "leg3", label: "CX", type: "leg", legNum: 3 },
  { id: "leg4", label: "Operations", type: "leg", legNum: 4 },
  { id: "baseCamp", label: "Base Camp", type: "camp" },
  { id: "leg5", label: "Technology", type: "leg", legNum: 5 },
  { id: "leg6", label: "Data", type: "leg", legNum: 6 },
  { id: "leg7", label: "Op Model", type: "leg", legNum: 7 },
  { id: "finalCamp", label: "Final Camp", type: "camp" },
  { id: "leg8", label: "People", type: "leg", legNum: 8 },
  { id: "summit", label: "Summit" },
];

// Organizer journey is just two steps: setup, then live dashboard.
const ORGANIZER_JOURNEY = [
  { id: "cover", label: "Start" },
  { id: "organizerSetup", label: "Configure" },
  { id: "organizerDashboard", label: "Dashboard" },
];

const getJourneyForMode = (mode) => {
  if (mode === "respondent") return RESPONDENT_JOURNEY;
  if (mode === "organizer-setup" || mode === "organizer-dashboard") return ORGANIZER_JOURNEY;
  return JOURNEY_STEPS;
};

/* ============== MAIN ============== */
function App() {
  // Mode: "single" | "respondent" | "organizer-setup" | "organizer-dashboard"
  // Default is single-player; the cover screen offers a path into team modes.
  const [mode, setMode] = useState("single");
  // Backend status: "checking" | "available" | "unavailable"
  // The health check runs once on mount; status drives UI affordances and the
  // amber warning banners in Cover/OrganizerSetup.
  const [backendStatus, setBackendStatus] = useState("checking");
  React.useEffect(() => {
    checkBackend().then(ok => setBackendStatus(ok ? "available" : "unavailable"));
  }, []);
  // Session config (only set in respondent / organizer modes). Stays null in single mode.
  // Shape: { code, industry, sector, departments: [...], createdAt }
  const [session, setSession] = useState(null);
  // Respondent identity in the current session (multiplayer only)
  const [respondentId, setRespondentId] = useState(null);
  const [respondentMeta, setRespondentMeta] = useState(null);  // { department, role }
  
  const [stepIdx, setStepIdx] = useState(0);
  const [industry, setIndustry] = useState("Industrial Goods");
  // Sector within the chosen industry. Defaults to the top-ranked sector for
  // the initial industry so previews work even before the user visits Realm.
  const [sector, setSector] = useState(() => {
    const secs = getSectorsForIndustry("Industrial Goods");
    return secs[0]?.name || null;
  });
  // Global answers: keyed by domain.key -> array of per-capability answer objects
  // (mirrors the BFF_QUESTIONS shape). Each answer: { current, target, dontKnow, importance, comment }
  // or null if not yet answered. Seeded at mount as arrays of nulls.
  const [answers, setAnswers] = useState(() => {
    const initial = {};
    Object.keys(BFF_QUESTIONS).forEach(k => {
      initial[k] = BFF_QUESTIONS[k].map(() => null);
    });
    return initial;
  });
  // Fresh-answers factory used by reset paths.
  const buildFreshAnswers = () => {
    const initial = {};
    Object.keys(BFF_QUESTIONS).forEach(k => {
      initial[k] = BFF_QUESTIONS[k].map(() => null);
    });
    return initial;
  };
  const [showSettings, setShowSettings] = useState(false);
  const [settings, setSettings] = useState({
    importanceRating: false,  // optional, OFF by default
    showArchitectHints: true,
    // Workshop mode: short version of the assessment for time-constrained audiences.
    // emphasizedDomains determines which capabilities get oversampled in the short list.
    workshopMode: false,
    emphasizedDomains: [],  // array of domain keys; empty means balanced selection
  });

  // Workshop mode: precompute the set of capability LABELS to include in the
  // questionnaire. Empty when workshop mode is off (everything is included).
  const workshopCapLabels = React.useMemo(() => {
    if (!settings.workshopMode) return null;
    const selectedKeys = new Set(selectWorkshopCapabilities(settings.emphasizedDomains, 12));
    // Map keys to labels using ASCENT_DATA.capabilities
    const labels = new Set();
    ASCENT_DATA.capabilities.forEach(c => {
      if (selectedKeys.has(c.key)) labels.add(c.label);
    });
    return labels;
  }, [settings.workshopMode, settings.emphasizedDomains]);
  
  // Multiplayer: auto-save answers to shared storage in respondent mode.
  // Debounced via timeout so we don't write on every slider tick.
  React.useEffect(() => {
    if (mode !== "respondent" || !session || !respondentId) return;
    const handle = setTimeout(() => {
      saveRespondent(session.code, respondentId, {
        meta: respondentMeta,
        answers,
        updatedAt: Date.now(),
      }).catch(err => console.error("respondent save failed:", err));
    }, 1000);
    return () => clearTimeout(handle);
  }, [mode, session, respondentId, respondentMeta, answers]);
  
  // Mode-aware journey
  const journey = React.useMemo(() => getJourneyForMode(mode), [mode]);
  const currentStep = journey[Math.min(stepIdx, journey.length - 1)] || journey[0];
  const goNext = () => setStepIdx(Math.min(journey.length - 1, stepIdx + 1));
  const goPrev = () => setStepIdx(Math.max(0, stepIdx - 1));
  const goTo = (id) => {
    const idx = journey.findIndex(s => s.id === id);
    if (idx >= 0) setStepIdx(idx);
  };
  
  // Path-launch helpers used by Cover to switch into multiplayer modes
  const startOrganizerMode = () => {
    setMode("organizer-setup");
    setStepIdx(1);  // jump straight to organizerSetup
  };
  const startRespondentMode = async (sessionMeta, respId, respMeta) => {
    setMode("respondent");
    setSession(sessionMeta);
    setRespondentId(respId);
    setRespondentMeta(respMeta || null);
    setIndustry(sessionMeta.industry);
    setSector(sessionMeta.sector);
    // Try to load existing answers from storage (re-entry case)
    const existing = await loadRespondent(sessionMeta.code, respId);
    if (existing && existing.answers) {
      setAnswers(existing.answers);
    }
    // After respondent setup, go to character step (index 2 in RESPONDENT_JOURNEY)
    setStepIdx(2);
  };
  const goToOrganizerDashboard = (sessionMeta) => {
    setMode("organizer-dashboard");
    setSession(sessionMeta);
    setStepIdx(2);
  };
  const exitToCover = () => {
    setMode("single");
    setSession(null);
    setRespondentId(null);
    setRespondentMeta(null);
    setStepIdx(0);
    // Clear answers so a fresh run starts from blank.
    // Note: in multiplayer mode, this only clears the local view; server-side
    // data for the previous respondent ID remains under the session. If the
    // user re-joins the same session, recallRespondentId/loadRespondent will
    // recover their old answers. To start truly fresh in a session, they'd
    // need to clear browser storage or the organizer would need to delete
    // their respondent record.
    setAnswers(buildFreshAnswers());
  };

  return (
    <div className="min-h-screen bg-[#0a0c0d] text-stone-100">
      {/* ============ DESIGNER NAVIGATOR (top, small, explicitly labeled) ============ */}
      <div className="fixed top-0 left-0 right-0 z-50 border-b border-stone-800/60 bg-black/90 backdrop-blur">
        <div className="flex items-center justify-between px-6 py-2">
          <div className="flex items-center gap-3 text-[10px] uppercase tracking-[0.2em] text-stone-500">
            <Icon path={icons.circle} size={6} fill="currentColor" stroke="none" className="text-rose-400 pulse-slow" />
            <span className="text-rose-400">Designer preview</span>
            <span className="text-stone-700">·</span>
            <span>The Ascent v0.7</span>
            <span className="text-stone-700">·</span>
            <span className="text-stone-600">Step {stepIdx + 1} of {journey.length}: {currentStep.label}</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={goPrev} disabled={stepIdx === 0}
              className="px-3 py-1 text-[10px] uppercase tracking-wider border border-stone-800 text-stone-400 hover:border-stone-600 transition disabled:opacity-30">
              ← Prev
            </button>
            <button onClick={goNext} disabled={stepIdx === journey.length - 1}
              className="px-3 py-1 text-[10px] uppercase tracking-wider border border-stone-800 text-stone-400 hover:border-stone-600 transition disabled:opacity-30">
              Next →
            </button>
            <button onClick={exitToCover} className="px-3 py-1 text-[10px] uppercase tracking-wider text-stone-500 hover:text-stone-200">Reset</button>
          </div>
        </div>
      </div>

      {/* ============ PLAYER JOURNEY BAR (visible, the real thing) ============ */}
      {currentStep.id !== "cover" && (
        <PlayerJourneyBar journey={journey} currentStepIdx={stepIdx} onStepClick={(i) => setStepIdx(i)} />
      )}

      {/* ============ SETTINGS OVERLAY ============ */}
      {showSettings && <SettingsPanel settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} />}

      <div className={currentStep.id === "cover" ? "pt-10" : "pt-24"}>
        {currentStep.id === "cover" && (
          <Cover 
            onStart={goNext} 
            onOpenSettings={() => setShowSettings(true)}
            onStartOrganizer={startOrganizerMode}
            onStartRespondent={startRespondentMode}
            onResumeOrganizer={goToOrganizerDashboard}
            backendStatus={backendStatus}
          />
        )}
        {currentStep.id === "character" && <Character onNext={goNext} />}
        {currentStep.id === "world" && <World selected={industry} setSelected={setIndustry} sector={sector} setSector={setSector} onNext={goNext} />}
        {currentStep.id === "threshold" && <Threshold industry={industry} sector={sector} settings={settings} setSettings={setSettings} onStart={goNext} onPrev={goPrev} session={session} respondentMeta={respondentMeta} />}
        {currentStep.type === "leg" && <Leg step={currentStep} onNext={goNext} onPrev={goPrev} settings={settings} answers={answers} setAnswers={setAnswers} workshopCapLabels={workshopCapLabels} sector={sector} />}
        {currentStep.id === "baseCamp" && <Camp variant="base" industry={industry} sector={sector} answers={answers} onNext={goNext} />}
        {currentStep.id === "finalCamp" && <Camp variant="final" industry={industry} sector={sector} answers={answers} onNext={goNext} />}
        {currentStep.id === "summit" && <Summit industry={industry} sector={sector} answers={answers} onRestart={exitToCover} workshopMode={settings.workshopMode} workshopCapLabels={workshopCapLabels} session={session} respondentId={respondentId} respondentMeta={respondentMeta} mode={mode} />}
        
        {/* Multiplayer-specific steps */}
        {currentStep.id === "respondentSetup" && session && (
          <RespondentSetup 
            session={session} 
            respondentId={respondentId}
            initialMeta={respondentMeta}
            onConfirm={(meta) => { setRespondentMeta(meta); goNext(); }}
            onCancel={exitToCover}
          />
        )}
        {currentStep.id === "organizerSetup" && (
          <OrganizerSetup 
            initialIndustry={industry} 
            initialSector={sector}
            onLaunch={(sessionMeta) => goToOrganizerDashboard(sessionMeta)}
            onCancel={exitToCover}
            backendStatus={backendStatus}
          />
        )}
        {currentStep.id === "organizerDashboard" && session && (
          <OrganizerDashboard 
            session={session} 
            onExit={exitToCover}
          />
        )}
      </div>
    </div>
  );
}

/* ============ PLAYER JOURNEY BAR ============ */
function PlayerJourneyBar({ journey, currentStepIdx, onStepClick }) {
  const steps = journey || JOURNEY_STEPS;
  return (
    <div className="fixed top-10 left-0 right-0 z-40 border-b border-stone-800 bg-[#060809]/95 backdrop-blur">
      <div className="px-6 py-3">
        <div className="flex items-center gap-1 overflow-x-auto">
          {steps.map((step, idx) => {
            const state = idx < currentStepIdx ? "done" : idx === currentStepIdx ? "current" : "upcoming";
            const isCamp = step.type === "camp";
            const isLeg = step.type === "leg";
            return (
              <React.Fragment key={step.id}>
                <button onClick={() => onStepClick(idx)}
                  className={`flex items-center gap-1.5 px-2.5 py-1.5 text-[10px] uppercase tracking-wider transition whitespace-nowrap ${
                    state === "current"
                      ? isCamp ? "bg-amber-400/20 text-amber-300 border border-amber-400/60"
                      : "bg-emerald-400 text-black"
                      : state === "done"
                      ? "text-stone-400 hover:text-stone-200"
                      : "text-stone-600 hover:text-stone-400"
                  }`}>
                  {state === "done" && <Icon path={icons.check} size={10} />}
                  {isCamp && <Icon path={icons.flag} size={10} className={state === "upcoming" ? "opacity-50" : ""} />}
                  {isLeg && <span className={`font-mono-custom text-[9px] ${state === "current" ? "" : "opacity-60"}`}>L{step.legNum}</span>}
                  <span>{step.label}</span>
                </button>
                {idx < steps.length - 1 && (
                  <div className={`w-3 h-px ${idx < currentStepIdx ? "bg-emerald-400/50" : "bg-stone-800"}`} />
                )}
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ============ SETTINGS PANEL ============ */
function SettingsPanel({ settings, setSettings, onClose }) {
  const DOMAIN_KEYS = ASCENT_DATA.meta.domainKeys;
  const DOMAIN_LABELS = ASCENT_DATA.meta.domainLabels;
  
  const toggleDomain = (d) => {
    const current = settings.emphasizedDomains || [];
    const next = current.includes(d) 
      ? current.filter(x => x !== d)
      : current.length < 4 ? [...current, d] : current;  // cap at 4
    setSettings({ ...settings, emphasizedDomains: next });
  };
  
  // Show a live preview of how many questions will be in the workshop
  const workshopCaps = settings.workshopMode 
    ? selectWorkshopCapabilities(settings.emphasizedDomains, 12)
    : [];
  
  return (
    <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur flex items-center justify-center p-6 overflow-y-auto" onClick={onClose}>
      <div className="max-w-lg w-full bg-[#070a0b] border border-stone-800 p-8 my-6" onClick={(e) => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <div>
            <div className="text-[10px] uppercase tracking-[0.3em] text-emerald-400 mb-1">Settings</div>
            <h2 className="font-display text-3xl">Climb preferences</h2>
          </div>
          <button onClick={onClose} className="text-stone-500 hover:text-stone-200 transition">
            <Icon path={icons.x} size={20} />
          </button>
        </div>

        <div className="space-y-4">
          <SettingToggle
            label="Include importance ratings"
            desc="Adds a 5-point importance scale to each question. More thorough, but ~20% longer climb."
            on={settings.importanceRating}
            onToggle={() => setSettings({ ...settings, importanceRating: !settings.importanceRating })}
          />
          <SettingToggle
            label="Cartographer's hints at camps"
            desc="Show peer benchmark commentary from The Cartographer at each base camp."
            on={settings.showArchitectHints}
            onToggle={() => setSettings({ ...settings, showArchitectHints: !settings.showArchitectHints })}
          />
          <SettingToggle
            label="Workshop mode"
            desc="Short version: 12 questions instead of 41. Use for time-constrained workshops or group exercises."
            on={settings.workshopMode}
            onToggle={() => setSettings({ ...settings, workshopMode: !settings.workshopMode })}
          />
        </div>
        
        {/* Workshop configuration appears only when workshopMode is on */}
        {settings.workshopMode && (
          <div className="mt-4 border-l-2 border-amber-400 pl-5 py-3 bg-amber-400/[0.04] animate-fadeIn">
            <div className="text-[10px] uppercase tracking-[0.25em] text-amber-400 mb-2">
              Emphasize domains for your audience
            </div>
            <p className="text-xs text-stone-400 mb-3 leading-relaxed">
              Pick up to 4 domains your audience cares about most. Those domains will be weighted toward in question selection. Leave empty for a balanced selection.
            </p>
            <div className="grid grid-cols-2 gap-2 mb-3">
              {DOMAIN_KEYS.map(d => {
                const isSelected = (settings.emphasizedDomains || []).includes(d);
                return (
                  <button 
                    key={d} 
                    onClick={() => toggleDomain(d)}
                    className={`px-3 py-2 text-[11px] uppercase tracking-wider border transition text-left ${
                      isSelected 
                        ? "border-amber-400 text-amber-300 bg-amber-400/10" 
                        : "border-stone-800 text-stone-500 hover:border-stone-600"
                    }`}>
                    {DOMAIN_LABELS[d]}
                  </button>
                );
              })}
            </div>
            <div className="text-[10px] text-stone-600 leading-relaxed">
              {(settings.emphasizedDomains || []).length === 0
                ? "No emphasis selected. The 12 questions will be evenly drawn from all 8 domains, picking the highest-signal capability per domain."
                : `${(settings.emphasizedDomains || []).length} of 4 emphasized. Selected domains get 2 capabilities each; others get 1. ${workshopCaps.length} questions total.`}
            </div>
          </div>
        )}

        <div className="mt-8 pt-6 border-t border-stone-900 flex justify-end">
          <button onClick={onClose} className="px-5 py-2.5 bg-emerald-400 text-black text-xs font-bold uppercase tracking-widest hover:bg-emerald-300 transition">
            Save & continue
          </button>
        </div>
      </div>
    </div>
  );
}

function SettingToggle({ label, desc, on, onToggle }) {
  return (
    <button onClick={onToggle} className={`w-full text-left p-4 border transition ${on ? "border-emerald-400/50 bg-emerald-400/5" : "border-stone-800 hover:border-stone-600"}`}>
      <div className="flex items-start justify-between gap-4">
        <div className="flex-1">
          <div className={`font-display text-lg ${on ? "text-emerald-400" : "text-stone-200"}`}>{label}</div>
          <div className="text-xs text-stone-500 mt-1">{desc}</div>
        </div>
        <div className={`w-10 h-5 rounded-full transition relative shrink-0 ${on ? "bg-emerald-400" : "bg-stone-800"}`}>
          <div className={`absolute top-0.5 w-4 h-4 rounded-full bg-black transition-all ${on ? "left-5" : "left-0.5"}`} />
        </div>
      </div>
    </button>
  );
}

/* ============ 00 · COVER ============ */
function Cover({ onStart, onOpenSettings, onStartOrganizer, onStartRespondent, onResumeOrganizer, backendStatus }) {
  // "team" overlay state: not shown by default; opens when user clicks the team-mode link
  const [teamOverlay, setTeamOverlay] = React.useState(null);  // null | "menu" | "join" | "loading"
  const [joinCode, setJoinCode] = React.useState("");
  const [joinError, setJoinError] = React.useState("");
  
  const handleJoinSubmit = async () => {
    const code = joinCode.trim().toUpperCase();
    if (!code.match(/^BCG-[A-Z0-9]{4}$/)) {
      setJoinError("Code format: BCG-XXXX (4 letters or digits)");
      return;
    }
    setTeamOverlay("loading");
    setJoinError("");
    try {
      const meta = await loadSessionMeta(code);
      if (!meta) {
        setJoinError(`No session found for ${code}. Check the code with the organizer.`);
        setTeamOverlay("join");
        return;
      }
      // Try to recover prior respondent ID for this session
      let respId = await recallRespondentId(code);
      if (!respId) {
        respId = generateRespondentId();
        await rememberRespondentId(code, respId);
      }
      // Load existing respondent record (if any)
      const existing = await loadRespondent(code, respId);
      onStartRespondent(meta, respId, existing ? existing.meta : null);
    } catch (err) {
      console.error(err);
      setJoinError("Could not join session. Try again.");
      setTeamOverlay("join");
    }
  };
  
  const handleResumeAsOrganizer = async () => {
    const code = joinCode.trim().toUpperCase();
    if (!code.match(/^BCG-[A-Z0-9]{4}$/)) {
      setJoinError("Code format: BCG-XXXX");
      return;
    }
    setTeamOverlay("loading");
    try {
      const meta = await loadSessionMeta(code);
      if (!meta) {
        setJoinError(`No session found for ${code}.`);
        setTeamOverlay("join");
        return;
      }
      onResumeOrganizer(meta);
    } catch (err) {
      setJoinError("Could not load session.");
      setTeamOverlay("join");
    }
  };
  
  return (
    <div className="min-h-[calc(100vh-40px)] relative overflow-hidden flex items-center justify-center">
      <div className="paper-noise absolute inset-0" />
      <svg viewBox="0 0 1440 900" className="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="coverSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0f1f1d" /><stop offset="40%" stopColor="#0a1416" /><stop offset="100%" stopColor="#050708" /></linearGradient>
          <linearGradient id="coverMtn1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#1a2e2b" stopOpacity="0.6" /><stop offset="100%" stopColor="#050708" stopOpacity="1" /></linearGradient>
          <linearGradient id="coverMtn2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0f1f1d" stopOpacity="0.9" /><stop offset="100%" stopColor="#050708" stopOpacity="1" /></linearGradient>
        </defs>
        <rect width="1440" height="900" fill="url(#coverSky)" />
        <path d="M 0 900 L 0 600 L 180 500 L 340 560 L 500 420 L 680 520 L 820 400 L 1000 480 L 1200 360 L 1440 430 L 1440 900 Z" fill="url(#coverMtn1)" />
        <path d="M 0 900 L 0 720 L 220 640 L 420 680 L 620 520 L 800 610 L 980 500 L 1200 580 L 1440 510 L 1440 900 Z" fill="url(#coverMtn2)" />
        <circle cx="620" cy="440" r="3" fill="#34d399" className="pulse-slow" />
      </svg>

      {/* Settings button (top right) */}
      <button onClick={onOpenSettings} className="absolute top-6 right-6 z-20 flex items-center gap-2 px-4 py-2 border border-stone-700 bg-black/40 backdrop-blur text-stone-400 hover:text-stone-200 hover:border-stone-500 transition text-[10px] uppercase tracking-widest">
        <Icon path={icons.settings} size={12} />
        Settings
      </button>

      <div className="relative z-10 max-w-5xl w-full px-8 text-center animate-fadeIn">
        <div className="flex items-center justify-center gap-3 mb-10 text-[10px] uppercase tracking-[0.3em] text-stone-400">
          <div className="w-12 h-px bg-stone-600" />
          BCG · Build for the Future × AI
          <div className="w-12 h-px bg-stone-600" />
        </div>
        <h1 className="font-display text-8xl md:text-[11rem] leading-[0.85] mb-2 text-stone-100">The</h1>
        <h1 className="font-display text-8xl md:text-[11rem] leading-[0.85] italic text-emerald-400 mb-8">Ascent.</h1>
        <p className="font-display text-2xl md:text-3xl italic text-stone-300 max-w-2xl mx-auto leading-snug mb-4">"The mountain does not lie to you. Neither should your assessment."</p>
        <p className="text-[10px] uppercase tracking-[0.3em] text-stone-600 mb-16">· The Cartographer</p>
        <button onClick={onStart} className="group flex items-center gap-4 bg-emerald-400 text-black px-10 py-5 hover:bg-emerald-300 transition-all mx-auto">
          <Icon path={icons.play} size={18} fill="currentColor" stroke="none" />
          <span className="text-sm font-bold uppercase tracking-[0.25em]">Begin the climb</span>
          <Icon path={icons.arrowRight} size={18} className="group-hover:translate-x-2 transition-transform" />
        </button>
        <div className="flex items-center justify-center gap-6 text-[10px] uppercase tracking-widest text-stone-500 mt-6">
          <span>25–40 min</span>
          <span>·</span>
          <span>1,252 climbers preceded you</span>
        </div>

/* ============ 01 · CHARACTER ============ */
/* ============ ORGANIZER SETUP · multiplayer mode ============
   The BCG team member configures the session: industry, sector, dept list.
   Generates a session code, persists meta to shared storage, then hands off
   to the OrganizerDashboard. */
function OrganizerSetup({ initialIndustry, initialSector, onLaunch, onCancel, backendStatus }) {
  const DEFAULT_DEPARTMENTS = [
    "Leadership / Executive",
    "Strategy",
    "Finance",
    "IT / Technology",
    "Data / Analytics",
    "Operations",
    "Sales",
    "Marketing",
    "Customer Service",
    "HR / People",
    "R&D / Product",
    "Other",
  ];
  
  const [industry, setIndustry] = React.useState(initialIndustry || "Industrial Goods");
  const [sector, setSector] = React.useState(initialSector || null);
  const [departments, setDepartments] = React.useState(DEFAULT_DEPARTMENTS);
  const [submitting, setSubmitting] = React.useState(false);
  const [error, setError] = React.useState("");
  
  const sectorsForIndustry = getSectorsForIndustry(industry);
  
  // Set initial sector if not set
  React.useEffect(() => {
    if (!sector || !sectorsForIndustry.find(s => s.name === sector)) {
      setSector(sectorsForIndustry[0]?.name || null);
    }
  }, [industry]);
  
  const toggleDepartment = (d) => {
    setDepartments(prev => prev.includes(d) ? prev.filter(x => x !== d) : [...prev, d]);
  };
  
  const handleLaunch = async () => {
    setError("");
    if (!industry || !sector) {
      setError("Pick an industry and sector before launching.");
      return;
    }
    if (departments.length < 2) {
      setError("Select at least 2 departments so respondents can categorize themselves.");
      return;
    }
    setSubmitting(true);
    const code = generateSessionCode();
    const meta = {
      code,
      industry,
      sector,
      departments,
      createdAt: Date.now(),
    };
    const ok = await saveSessionMeta(code, meta);
    setSubmitting(false);
    if (!ok) {
      setError("Could not create session. The artifact's shared storage may be unavailable; try again or fall back to single-player mode.");
      return;
    }
    onLaunch(meta);
  };
  
  return (
    <div className="min-h-[calc(100vh-96px)] relative">
      <div className="paper-noise absolute inset-0" />
      <div className="relative max-w-3xl mx-auto px-6 py-10">
        <div className="flex items-center gap-3 mb-6 text-[10px] uppercase tracking-[0.4em] text-emerald-400">
          <Icon path={icons.flag} size={12} />
          Organizer setup
          <div className="flex-1 h-px bg-stone-800 max-w-[200px]" />
          <span className="text-stone-600">Multiplayer mode</span>
        </div>
        
        <h2 className="font-display text-5xl leading-[1] mb-4">
          Configure the <span className="italic text-emerald-400">session.</span>
        </h2>
        <p className="text-stone-400 text-sm leading-relaxed mb-10 max-w-2xl">
          You're setting up a multiplayer session for 1-50 respondents. Industry and sector are locked for everyone in the session (so the bench is consistent). Respondents tag themselves with a department so the dashboard can show internal variance.
        </p>
        
        {/* Industry + sector */}
        <div className="border border-stone-800 bg-[#070a0b] p-6 mb-6">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-4">Bench (shared by all respondents)</div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label className="text-[10px] uppercase tracking-wider text-stone-500 block mb-2">Industry</label>
              <select 
                value={industry} 
                onChange={(e) => setIndustry(e.target.value)}
                className="w-full bg-black/40 border border-stone-700 px-3 py-2 text-stone-200 text-sm focus:outline-none focus:border-emerald-400 transition"
              >
                {INDUSTRY_KEYS.map(k => (
                  <option key={k} value={k}>{INDUSTRY_META[k]?.label || k}</option>
                ))}
              </select>
            </div>
            <div>
              <label className="text-[10px] uppercase tracking-wider text-stone-500 block mb-2">Sector</label>
              <select 
                value={sector || ""} 
                onChange={(e) => setSector(e.target.value)}
                className="w-full bg-black/40 border border-stone-700 px-3 py-2 text-stone-200 text-sm focus:outline-none focus:border-emerald-400 transition"
              >
                {sectorsForIndustry.map(s => (
                  <option key={s.name} value={s.name}>{s.name} (n={s.n})</option>
                ))}
              </select>
            </div>
          </div>
        </div>
        
        {/* Department list */}
        <div className="border border-stone-800 bg-[#070a0b] p-6 mb-6">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Departments respondents can pick from</div>
          <p className="text-xs text-stone-500 leading-relaxed mb-4">
            Click to toggle. Your dashboard will show internal variance broken down by these. Departments with fewer than 3 respondents in the session aren't broken out separately.
          </p>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {DEFAULT_DEPARTMENTS.map(d => {
              const active = departments.includes(d);
              return (
                <button 
                  key={d}
                  onClick={() => toggleDepartment(d)}
                  className={`px-3 py-2 text-[11px] uppercase tracking-wider border transition text-left ${
                    active 
                      ? "border-emerald-400 text-emerald-400 bg-emerald-400/5" 
                      : "border-stone-800 text-stone-500 hover:border-stone-600"
                  }`}>
                  {d}
                </button>
              );
            })}
          </div>
          <div className="text-[10px] text-stone-600 mt-3">
            {departments.length} selected
          </div>
        </div>
        
        {error && (
          <div className="mb-6 px-4 py-3 border border-rose-500/30 bg-rose-500/5 text-xs text-rose-300 leading-relaxed">
            {error}
          </div>
        )}
        
        <div className="flex items-center justify-between border-t border-stone-900 pt-6">
          <button onClick={onCancel} className="text-[10px] uppercase tracking-widest text-stone-500 hover:text-stone-300 transition flex items-center gap-2">
            <Icon path={icons.arrowLeft} size={12} /> Cancel
          </button>
          <button 
            onClick={handleLaunch}
            disabled={submitting}
            className="group flex items-center gap-3 bg-emerald-400 text-black px-8 py-4 hover:bg-emerald-300 transition disabled:opacity-50"
          >
            <Icon path={icons.flag} size={14} />
            <span className="text-xs font-bold uppercase tracking-[0.25em]">
              {submitting ? "Creating session..." : "Launch session"}
            </span>
            <Icon path={icons.arrowRight} size={14} className="group-hover:translate-x-1 transition-transform" />
          </button>
        </div>
        
        {backendStatus === "unavailable" && (
          <div className="mt-6 px-4 py-3 border border-amber-500/30 bg-amber-500/5 text-xs text-amber-300 leading-relaxed">
            Heads up: the multiplayer backend isn't responding. Sessions can't be created until the backend is reachable. Try toggling VPN or check the network. Single-player mode still works.
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ ORGANIZER DASHBOARD · multiplayer mode ============
   Live (manually-refreshable) view of the team's responses. Three sections:
   1. Share panel: code, link, share helpers
   2. Team summit: aggregate score / archetype / etc.
   3. Internal variance: per-domain spread + per-department breakdown

   The dashboard reuses several components from the single-player Summit by
   feeding them the aggregate `derived` object computed by computeTeamAggregate.
*/
function OrganizerDashboard({ session, onExit }) {
  const [respondents, setRespondents] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [refreshing, setRefreshing] = React.useState(false);
  const [copyFeedback, setCopyFeedback] = React.useState(null);
  
  const refresh = async () => {
    setRefreshing(true);
    const r = await listRespondents(session.code);
    setRespondents(r);
    setRefreshing(false);
    setLoading(false);
  };
  
  React.useEffect(() => {
    refresh();
  }, [session.code]);
  
  const aggregate = React.useMemo(() => computeTeamAggregate(respondents), [respondents]);
  
  // Department breakdown: for each department with N>=3 respondents, compute aggregate
  const departmentBreakdown = React.useMemo(() => {
    if (!session.departments || respondents.length === 0) return [];
    const out = [];
    session.departments.forEach(dept => {
      const inDept = respondents.filter(r => r.meta?.department === dept);
      if (inDept.length >= 3) {
        out.push({
          department: dept,
          n: inDept.length,
          aggregate: computeTeamAggregate(inDept),
        });
      }
    });
    return out;
  }, [respondents, session.departments]);
  
  const handleCopyCode = () => {
    navigator.clipboard?.writeText(session.code);
    setCopyFeedback("code");
    setTimeout(() => setCopyFeedback(null), 1500);
  };
  
  const handleCopyLink = () => {
    const url = window.location.href;
    navigator.clipboard?.writeText(url);
    setCopyFeedback("link");
    setTimeout(() => setCopyFeedback(null), 1500);
  };
  
  const handleCopyMessage = () => {
    const msg = `Take the BCG BFF × AI assessment with our team.\n\nLink: ${window.location.href}\nSession code: ${session.code}\n\nOpen the link, click "Running this for a team," then "I have a session code." Enter ${session.code} and choose "Join as respondent." Should take 25-40 minutes.`;
    navigator.clipboard?.writeText(msg);
    setCopyFeedback("message");
    setTimeout(() => setCopyFeedback(null), 1500);
  };
  
  const benchObj = getBenchmark(session.industry, session.sector, null);
  const bench = benchObj.cell;
  const benchLabel = benchObj.label;
  
  if (loading) {
    return (
      <div className="min-h-[calc(100vh-96px)] flex items-center justify-center">
        <div className="text-stone-500 text-sm">Loading session data...</div>
      </div>
    );
  }
  
  return (
    <div className="min-h-[calc(100vh-96px)] relative">
      <div className="paper-noise absolute inset-0" />
      <div className="relative max-w-6xl mx-auto px-6 py-10">
        
        {/* Header */}
        <div className="flex items-center gap-3 mb-6 text-[10px] uppercase tracking-[0.4em] text-emerald-400">
          <Icon path={icons.flag} size={12} />
          Organizer dashboard
          <div className="flex-1 h-px bg-stone-800 max-w-[200px]" />
          <span className="text-stone-600">{session.industry} · {session.sector}</span>
        </div>
        
        <div className="flex items-baseline justify-between mb-10 flex-wrap gap-4">
          <div>
            <h1 className="font-display text-5xl md:text-6xl leading-[0.95] mb-2">
              Session <span className="italic text-emerald-400">{session.code}</span>.
            </h1>
            <p className="text-stone-400 text-sm">
              {respondents.length} {respondents.length === 1 ? "respondent has" : "respondents have"} joined so far.
              {respondents.length > 0 && aggregate && (
                <span className="text-stone-600"> · {aggregate.totalAnswered} questions answered total</span>
              )}
            </p>
          </div>
          <div className="flex items-center gap-2">
            <button 
              onClick={refresh} 
              disabled={refreshing}
              className="flex items-center gap-2 px-4 py-2 border border-stone-700 text-xs uppercase tracking-widest text-stone-300 hover:border-stone-500 hover:bg-stone-900/40 transition disabled:opacity-50"
            >
              <Icon path={icons.rotateCw} size={12} className={refreshing ? "animate-spin" : ""} />
              {refreshing ? "Refreshing..." : "Refresh"}
            </button>
            <button 
              onClick={onExit}
              className="text-[10px] uppercase tracking-widest text-stone-500 hover:text-stone-300 transition"
            >
              Exit to cover
            </button>
          </div>
        </div>
        
        {/* Share panel */}
        <div className="border border-emerald-400/30 bg-emerald-400/[0.04] p-6 mb-10">
          <div className="text-[10px] uppercase tracking-[0.3em] text-emerald-400 mb-4">Share with respondents</div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div className="md:col-span-1">
              <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Session code</div>
              <button 
                onClick={handleCopyCode}
                className="w-full bg-black/40 border border-stone-700 px-4 py-3 text-stone-100 font-mono-custom text-2xl tracking-widest hover:border-emerald-400 transition flex items-center justify-between"
              >
                <span>{session.code}</span>
                <span className="text-[10px] text-stone-500 normal-case tracking-normal">
                  {copyFeedback === "code" ? "✓ copied" : "Copy"}
                </span>
              </button>
            </div>
            <div className="md:col-span-2">
              <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Link to artifact</div>
              <button 
                onClick={handleCopyLink}

/* TeamSummitView: a stripped-down summit dashboard driven by an aggregate
   `derived`-shape object. Reuses the existing SummitHero, peak-by-peak,
   archetype, and roadmap sections via prop-passing. */
function TeamSummitView({ aggregate, bench, benchLabel, industry, sector }) {
  const playerScore = aggregate.overall;
  const playerStage = aggregate.stage;
  const playerDomains = aggregate.domains;
  const matches = React.useMemo(() => matchArchetypes(playerDomains), [playerDomains]);
  const primaryArchetype = matches[0];
  
  // Percentile from bench distribution
  const percentile = (() => {
    const dist = bench.distribution;
    if (!dist) return 50;
    const stagnating = dist.stagnating;
    const emerging = dist.emerging;
    const scaling = dist.scaling;
    if (playerScore < 25) return (stagnating * (playerScore / 25)) / 2;
    if (playerScore < 50) return stagnating + emerging * ((playerScore - 25) / 25);
    if (playerScore < 75) return stagnating + emerging + scaling * ((playerScore - 50) / 25);
    return stagnating + emerging + scaling + (100 - stagnating - emerging - scaling) * ((playerScore - 75) / 25);
  })();
  
  const benchObj = { cell: bench, label: benchLabel, n: bench.n || 100, smallSample: false };
  
  return (
    <div className="border border-stone-800 bg-[#070a0b]/40 p-6">
      {/* Headline numbers */}
      <div className="grid grid-cols-1 md:grid-cols-12 gap-6 mb-6 items-baseline">
        <div className="md:col-span-4">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Team score</div>
          <div className={`font-display text-7xl leading-none ${playerScore >= 75 ? "text-emerald-400" : playerScore >= 50 ? "text-lime-400" : playerScore >= 25 ? "text-amber-400" : "text-rose-400"}`}>
            {playerScore}
          </div>
          <div className={`font-display text-xl mt-2 ${playerScore >= 75 ? "text-emerald-400" : playerScore >= 50 ? "text-lime-400" : playerScore >= 25 ? "text-amber-400" : "text-rose-400"}`}>
            AI {playerStage}
          </div>
          <div className="text-[10px] text-stone-500 mt-1">
            Higher than {Math.round(percentile)}% of {benchLabel}
          </div>
        </div>
        <div className="md:col-span-4">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Team archetype</div>
          <div className="font-display text-3xl italic text-stone-100">{primaryArchetype.name}</div>
          <div className="text-xs text-stone-500 mt-1 italic">"{primaryArchetype.tagline}"</div>
          <div className="text-[10px] text-stone-600 font-mono-custom mt-2">{primaryArchetype.matchPct}% match</div>
        </div>
        <div className="md:col-span-4">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-2">Sample</div>
          <div className="font-display text-3xl text-stone-200">{aggregate.respondentCount}</div>
          <div className="text-[10px] text-stone-500 mt-1">{aggregate.respondentCount === 1 ? "respondent" : "respondents"}</div>
          <div className="text-[10px] text-stone-600 font-mono-custom mt-2">{aggregate.totalAnswered} / {aggregate.totalQuestions * aggregate.respondentCount} responses</div>
        </div>
      </div>
      
      {/* Per-domain bars (existing PeakByPeak-style display) */}
      <div className="border-t border-stone-900 pt-6">
        <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-4">Team scores by domain (vs {benchLabel})</div>
        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-px bg-stone-900">
          {ASCENT_DATA.meta.domainKeys.map(d => {
            const p = Math.round(playerDomains[d] ?? 0);
            const b = Math.round(bench.domains?.[d] ?? 0);
            const dlt = p - b;
            const stageCol = p >= 75 ? "text-emerald-400" : p >= 50 ? "text-lime-400" : p >= 25 ? "text-amber-400" : "text-rose-400";
            const barCol = p >= 75 ? "bg-emerald-400" : p >= 50 ? "bg-lime-400" : p >= 25 ? "bg-amber-400" : "bg-rose-400";
            return (
              <div key={d} className="bg-[#070a0b] p-3">
                <div className="text-[9px] uppercase tracking-wider text-stone-600 mb-2">{ASCENT_DATA.meta.domainLabels[d]}</div>
                <div className={`font-display text-2xl ${stageCol}`}>{p}</div>
                <div className="relative h-1 bg-stone-900 my-2">
                  <div className={`h-full ${barCol}`} style={{ width: `${p}%` }} />
                </div>
                <div className={`text-[9px] font-mono-custom ${dlt >= 5 ? "text-emerald-400" : dlt >= -5 ? "text-stone-500" : "text-rose-400"}`}>
                  {dlt >= 0 ? "+" : ""}{dlt} vs bench
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* InternalVariancePanel: per-capability spread across respondents.
   Shows the capabilities with the HIGHEST SD (most internal disagreement)
   ranked by SD descending. These are the conversation starters. */
function InternalVariancePanel({ aggregate, respondents, sector }) {
  // Build a sorted list of capabilities ranked by internal SD.
  // For Operations, swap the display label to the sector-specific name.
  const opsLabelOrder = React.useMemo(() => {
    // The 5 generic Operations labels in their canonical slot order. Used to
    // derive a slot index from a generic label so we can look up the sector
    // override.
    const opsCaps = ASCENT_DATA.capabilities.filter(c => c.domain === "Operations");
    return opsCaps.map(c => c.label);
  }, []);
  
  const ranked = React.useMemo(() => {
    return Object.entries(aggregate.capabilityVariance)
      .filter(([, v]) => v.n >= 2)
      .map(([label, v]) => {
        const cap = ASCENT_DATA.capabilities.find(c => c.label === label);
        const domain = cap?.domain || "Other";
        let displayLabel = label;
        if (domain === "Operations") {
          const idx = opsLabelOrder.indexOf(label);
          const sectorLabel = idx >= 0 ? getSectorOpsLabel(sector, idx) : null;
          if (sectorLabel) displayLabel = sectorLabel;
        }
        return { label, displayLabel, ...v, domain };
      })
      .sort((a, b) => b.sd - a.sd);
  }, [aggregate.capabilityVariance, sector, opsLabelOrder]);
  
  if (ranked.length === 0) {
    return (
      <div className="border border-stone-800 bg-[#070a0b] p-6 text-center text-sm text-stone-500">
        Need at least 2 respondents per capability to show internal variance. Wait for more responses.
      </div>
    );
  }
  
  // Top 8 most-divergent capabilities
  const top = ranked.slice(0, 8);
  const lowSD = ranked[ranked.length - 1].sd;
  const highSD = ranked[0].sd;
  
  return (
    <div className="space-y-4">
      <div className="border border-stone-800 bg-[#070a0b] p-6">
        <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-4">
          Capabilities with highest internal disagreement (SD across respondents)
        </div>
        <div className="space-y-2">
          {top.map(cap => {
            const isHigh = cap.sd > 20;
            const isMed = cap.sd > 12;
            const barColor = isHigh ? "bg-rose-400" : isMed ? "bg-amber-400" : "bg-emerald-400";
            const labelColor = isHigh ? "text-rose-400" : isMed ? "text-amber-400" : "text-emerald-400";
            return (
              <div key={cap.label} className="grid grid-cols-12 gap-3 items-center text-xs">
                <div className="col-span-5 truncate">
                  <span className="text-stone-200">{cap.displayLabel}</span>
                  <span className="text-stone-600 ml-2 text-[10px]">{cap.domain}</span>
                </div>
                <div className="col-span-2 text-stone-500 font-mono-custom">
                  mean {cap.mean.toFixed(0)}
                </div>
                <div className="col-span-3 relative h-3 bg-stone-900">
                  <div 
                    className={`h-full ${barColor}`} 
                    style={{ width: `${Math.min(100, (cap.sd / 30) * 100)}%` }} 
                  />
                </div>
                <div className={`col-span-2 font-mono-custom font-bold ${labelColor}`}>
                  SD {cap.sd.toFixed(1)}
                </div>
              </div>
            );
          })}
        </div>
        <div className="text-[10px] text-stone-600 leading-relaxed mt-5 italic">
          High SD ({">"}20 points) means respondents inside the team rate this capability dramatically differently. These are usually the most useful conversations to have: they reveal where leadership and frontline disagree, where IT and business see different realities, or where the company is genuinely doing two different things at once.
        </div>
      </div>
    </div>
  );
}

/* DepartmentBreakdownPanel: per-department aggregate score and top differences.
   Departments must have N>=3 respondents to be broken out (privacy-ish). */
function DepartmentBreakdownPanel({ breakdown, bench }) {
  return (
    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
      {breakdown.map(({ department, n, aggregate }) => {
        const score = aggregate.overall;
        const stageCol = score >= 75 ? "text-emerald-400" : score >= 50 ? "text-lime-400" : score >= 25 ? "text-amber-400" : "text-rose-400";
        // Find top 2 weakest and strongest domains for this dept
        const domainScores = Object.entries(aggregate.domains)
          .map(([d, v]) => ({ domain: d, label: ASCENT_DATA.meta.domainLabels[d] || d, score: Math.round(v) }))
          .sort((a, b) => a.score - b.score);
        const weakest = domainScores[0];
        const strongest = domainScores[domainScores.length - 1];
        
        return (
          <div key={department} className="border border-stone-800 bg-[#070a0b] p-5">
            <div className="flex items-baseline justify-between mb-3">
              <div className="font-display text-xl text-stone-100">{department}</div>
              <div className="text-[10px] text-stone-600 font-mono-custom">n={n}</div>
            </div>
            <div className="grid grid-cols-3 gap-4 mb-3">
              <div>
                <div className="text-[9px] uppercase tracking-wider text-stone-600 mb-1">Score</div>
                <div className={`font-display text-3xl ${stageCol}`}>{score}</div>
              </div>
              <div>
                <div className="text-[9px] uppercase tracking-wider text-stone-600 mb-1">Strongest</div>
                <div className="text-xs text-lime-400 font-mono-custom">{strongest.label}</div>
                <div className="text-[10px] text-stone-500">{strongest.score}</div>
              </div>
              <div>
                <div className="text-[9px] uppercase tracking-wider text-stone-600 mb-1">Weakest</div>
                <div className="text-xs text-rose-400 font-mono-custom">{weakest.label}</div>
                <div className="text-[10px] text-stone-500">{weakest.score}</div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* RespondentRoster: anonymous-ish list of who's joined.
   Shows department + role + answered/total + last update time. */
function RespondentRoster({ respondents, departments }) {
  // Sort by last update desc
  const sorted = [...respondents].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  
  const totalQs = Object.values(BFF_QUESTIONS).reduce((s, qs) => s + qs.length, 0);
  
  return (
    <div className="border border-stone-800 bg-[#070a0b] overflow-hidden">
      <div className="grid grid-cols-12 gap-3 px-5 py-3 border-b border-stone-900 text-[9px] uppercase tracking-wider text-stone-600">
        <div className="col-span-3">Department</div>
        <div className="col-span-4">Role</div>
        <div className="col-span-3">Progress</div>
        <div className="col-span-2">Last update</div>
      </div>
      {sorted.map(r => {
        const meta = r.meta || {};
        const answered = r.answers ? Object.values(r.answers).reduce((s, arr) => s + (arr || []).filter(a => a !== null).length, 0) : 0;
        const pct = totalQs > 0 ? Math.round((answered / totalQs) * 100) : 0;
        const ago = r.updatedAt ? formatTimeAgo(r.updatedAt) : "never";
        return (
          <div key={r.id} className="grid grid-cols-12 gap-3 px-5 py-3 border-b border-stone-900 last:border-0 text-xs items-center">
            <div className="col-span-3 text-stone-300">{meta.department || <span className="text-stone-600 italic">unset</span>}</div>
            <div className="col-span-4 text-stone-400 truncate">{meta.role || <span className="text-stone-600 italic">(none)</span>}</div>
            <div className="col-span-3">
              <div className="flex items-center gap-2">
                <div className="flex-1 h-1.5 bg-stone-900">
                  <div className={`h-full ${pct === 100 ? "bg-emerald-400" : pct >= 50 ? "bg-lime-400" : "bg-amber-400"}`} style={{ width: `${pct}%` }} />
                </div>
                <span className="text-[10px] text-stone-500 font-mono-custom shrink-0">{answered}/{totalQs}</span>
              </div>
            </div>
            <div className="col-span-2 text-[10px] text-stone-500 font-mono-custom">{ago}</div>
          </div>
        );
      })}
    </div>
  );
}

const formatTimeAgo = (ts) => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
};
