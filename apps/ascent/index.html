            <div className="pt-4">
              <button onClick={onNext} className="group flex items-center gap-3 bg-emerald-400 text-black px-7 py-3.5 hover:bg-emerald-300 transition">
                <span className="text-xs font-bold uppercase tracking-widest">Choose Your Realm</span>
                <Icon path={icons.arrowRight} size={14} className="group-hover:translate-x-1 transition-transform" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Field({ label, sublabel, children }) {
  return (
    <div>
      <div className="flex items-baseline gap-3 mb-3">
        <div className="text-[10px] uppercase tracking-[0.25em] text-emerald-400">{label}</div>
        {sublabel && <div className="text-xs text-stone-500">{sublabel}</div>}
        <div className="flex-1 h-px bg-stone-900" />
      </div>
      {children}
    </div>
  );
}

function Chip({ active, onClick, children, color = "emerald" }) {
  const activeClass = {
    amber: "border-amber-400 text-amber-400 bg-amber-400/5",
    violet: "border-violet-400 text-violet-400 bg-violet-400/5",
    sky: "border-sky-400 text-sky-400 bg-sky-400/5",
    emerald: "border-emerald-400 text-emerald-400 bg-emerald-400/5",
  }[color];
  return (
    <button onClick={onClick} className={`px-4 py-2 text-xs border transition-all ${active ? activeClass : "border-stone-800 text-stone-500 hover:border-stone-600 hover:text-stone-300"}`}>
      {children}
    </button>
  );
}

/* ============ 02 · WORLD ============ */
function World({ selected, setSelected, sector, setSector, onNext }) {
  const data = INDUSTRY_DATA[selected];
  const sectors = getSectorsForIndustry(selected);
  const hasMultipleSectors = sectors.length > 1;

  // Two-step: "industry" (pick industry) → "sector" (pick sector, if industry has >1)
  // For single-sector industries (Insurance, Public Sector), auto-select and skip.
  const [phase, setPhase] = useState("industry");

  // Whenever the user changes industry, reset sector choice and phase
  const pickIndustry = (key) => {
    setSelected(key);
    const secs = getSectorsForIndustry(key);
    if (secs.length <= 1) {
      // Auto-select the single sector; no second step needed
      setSector(secs[0]?.name || null);
    } else {
      setSector(null); // force a choice on step 2
    }
  };

  const advance = () => {
    if (phase === "industry" && hasMultipleSectors) {
      setPhase("sector");
    } else {
      onNext();
    }
  };

  // The currently-selected sector's data (if chosen)
  const secData = sector ? getSectorData(selected, sector) : null;
  // The panel shows sector data if one is chosen, otherwise the industry rollup
  const panelData = secData || data;
  const panelLabel = sector || data.label;
  const isSmallSample = secData && secData.n < SECTOR_SMALL_SAMPLE_THRESHOLD;

  return (
    <div className="min-h-[calc(100vh-96px)] px-6 py-12 relative">
      <div className="paper-noise absolute inset-0" />
      <div className="max-w-6xl mx-auto relative">
        <div className="flex items-center gap-3 mb-6 text-[10px] uppercase tracking-[0.3em] text-stone-500">
          <div className="w-8 h-px bg-stone-700" />
          Chapter II · The Realm
          {hasMultipleSectors && (
            <>
              <div className="w-6 h-px bg-stone-800 ml-2" />
              <span className={phase === "industry" ? "text-emerald-400" : "text-stone-600"}>1 · Industry</span>
              <div className="w-4 h-px bg-stone-800" />
              <span className={phase === "sector" ? "text-emerald-400" : "text-stone-600"}>2 · Sector</span>
            </>
          )}
        </div>

        <h1 className="font-display text-6xl md:text-7xl leading-[0.95] mb-3">
          {phase === "industry" ? (
            <>Every sector is a <span className="italic text-emerald-400">different mountain.</span></>
          ) : (
            <>Now the <span className="italic text-emerald-400">sector.</span></>
          )}
        </h1>
        <p className="text-stone-500 max-w-2xl text-sm leading-relaxed mb-12">
          {phase === "industry"
            ? <>The terrain shifts beneath you depending on the industry you climb in. Your altitude will be benchmarked against the {data.n.toLocaleString()} climbers who came before you in this realm.</>
            : <>Within {data.label}, no two sectors climb the same ridge. Zoom in on yours for a sharper benchmark.</>}
        </p>

        <div className="grid grid-cols-12 gap-6">
          {/* LEFT column: industry list OR sector list */}
          <div className="col-span-5 space-y-px bg-stone-900">
            {phase === "industry" && Object.entries(INDUSTRY_DATA).map(([key, r]) => (
              <button key={key} onClick={() => pickIndustry(key)}
                className={`w-full bg-[#070a0b] p-4 text-left transition-all flex items-center justify-between ${selected === key ? "bg-[#0d1415]" : "hover:bg-[#0a0e10]"}`}>
                <div className="flex items-center gap-4">
                  <div className={`w-6 h-6 border flex items-center justify-center transition ${selected === key ? "border-emerald-400 bg-emerald-400/10" : "border-stone-800"}`}>
                    {selected === key && <Icon path={icons.check} size={12} className="text-emerald-400" />}
                  </div>
                  <div>
                    <div className="font-display text-xl">{r.label}</div>
                    <div className="text-[10px] uppercase tracking-wider text-stone-600">
                      {r.terrain} · n={r.n}
                      {getSectorsForIndustry(key).length > 1 && <> · {getSectorsForIndustry(key).length} sectors</>}
                    </div>
                  </div>
                </div>
                <div className="text-right">
                  <div className="font-mono-custom text-xs text-stone-500">avg</div>
                  <div className={`font-display text-lg ${r.avgScore >= 50 ? "text-lime-400" : r.avgScore >= 40 ? "text-amber-400" : "text-rose-400"}`}>{r.avgScore}</div>
                </div>
              </button>
            ))}

            {phase === "sector" && sectors.map((s) => {
              const isSel = sector === s.name;
              const lowN = s.n < SECTOR_SMALL_SAMPLE_THRESHOLD;
              return (
                <button key={s.name} onClick={() => setSector(s.name)}
                  className={`w-full bg-[#070a0b] p-4 text-left transition-all flex items-center justify-between ${isSel ? "bg-[#0d1415]" : "hover:bg-[#0a0e10]"}`}>
                  <div className="flex items-center gap-4">
                    <div className={`w-6 h-6 border flex items-center justify-center transition ${isSel ? "border-emerald-400 bg-emerald-400/10" : "border-stone-800"}`}>
                      {isSel && <Icon path={icons.check} size={12} className="text-emerald-400" />}
                    </div>
                    <div>
                      <div className="font-display text-xl">{s.name}</div>
                      <div className="text-[10px] uppercase tracking-wider text-stone-600 flex items-center gap-2">
                        <span>n={s.n}</span>
                        {lowN && <span className="text-amber-500/80">· small sample</span>}
                      </div>
                    </div>
                  </div>
                  <div className="text-right">
                    <div className="font-mono-custom text-xs text-stone-500">avg</div>
                    <div className={`font-display text-lg ${s.avgScore >= 50 ? "text-lime-400" : s.avgScore >= 40 ? "text-amber-400" : "text-rose-400"}`}>{s.avgScore}</div>
                  </div>
                </button>
              );
            })}
          </div>

          {/* RIGHT column: preview panel for current selection */}
          <div className="col-span-7">
            <div className="border border-stone-800 bg-[#070a0b] p-8 relative overflow-hidden h-full min-h-[560px]">
              <svg viewBox="0 0 400 280" className="absolute inset-x-0 bottom-0 w-full opacity-60">
                <defs><linearGradient id="realmg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#34d399" stopOpacity="0.25" /><stop offset="100%" stopColor="#34d399" stopOpacity="0" /></linearGradient></defs>
                <path d={`M 0 280 L 0 ${280 - panelData.avgScore * 1.5} L 80 ${220 - panelData.avgScore} L 160 ${240 - panelData.avgScore * 0.9} L 240 ${160 - panelData.avgScore * 0.7} L 320 ${180 - panelData.avgScore * 0.8} L 400 ${100 - panelData.avgScore * 0.5} L 400 280 Z`} fill="url(#realmg)" stroke="#34d399" strokeWidth="1" strokeOpacity="0.4" />
              </svg>
              <div className="relative">
                <div className="text-[10px] uppercase tracking-[0.25em] text-emerald-400 mb-2">
                  {phase === "sector" || secData ? "Selected sector" : "Selected realm"}
                  {phase === "sector" && <span className="text-stone-600"> · within {data.label}</span>}
                </div>
                <h2 className="font-display text-5xl mb-1">{panelLabel}</h2>
                {phase === "industry" && <p className="italic font-display text-lg text-stone-400 mb-6">"{data.tagline}"</p>}

                {isSmallSample && (
                  <div className="mb-6 border border-amber-500/40 bg-amber-500/5 px-4 py-2.5 flex items-center gap-3">
                    <Icon path={icons.helpCircle} size={14} className="text-amber-400 shrink-0" />
                    <div className="text-[10px] uppercase tracking-wider text-amber-300 leading-relaxed">
                      Small sample · n={secData.n}. Treat benchmarks as indicative, not definitive.
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-4 mb-8">
                  <StatBox label="Climbers surveyed" value={panelData.n.toLocaleString()} />
                  <StatBox label="Average altitude" value={`${panelData.avgScore} / 100`} highlight />
                  <StatBox label="Reach the summit" value={`${panelData.distribution.futureBuilt}%`} />
                  <StatBox label="Still in foothills" value={`${panelData.distribution.stagnating}%`} rose />
                </div>
                <div className="mb-8">
                  <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-3">Where {panelLabel} climbers end up</div>
                  <div className="flex h-3 bg-stone-900 overflow-hidden">
                    <div className="bg-rose-500/70" style={{ width: `${panelData.distribution.stagnating}%` }} />
                    <div className="bg-amber-500/70" style={{ width: `${panelData.distribution.emerging}%` }} />
                    <div className="bg-lime-500/70" style={{ width: `${panelData.distribution.scaling}%` }} />
                    <div className="bg-emerald-400" style={{ width: `${panelData.distribution.futureBuilt}%` }} />
                  </div>
                  <div className="flex justify-between text-[9px] uppercase tracking-wider text-stone-600 mt-2">
                    <span className="text-rose-400">{panelData.distribution.stagnating}% Stagnating</span>
                    <span className="text-amber-400">{panelData.distribution.emerging}% Emerging</span>
                    <span className="text-lime-400">{panelData.distribution.scaling}% Scaling</span>
                    <span className="text-emerald-400">{panelData.distribution.futureBuilt}% Future-built</span>
                  </div>
                </div>

                {/* On the sector step, show delta vs industry */}
                {phase === "sector" && secData && (
                  <div className="border-t border-stone-900 pt-4 flex items-baseline gap-4 text-[10px] uppercase tracking-wider text-stone-500">
                    <span>vs {data.label} avg ({data.avgScore})</span>
                    <span className={`font-display text-base ${secData.avgScore > data.avgScore ? "text-lime-400" : secData.avgScore < data.avgScore ? "text-rose-400" : "text-stone-400"}`}>
                      {secData.avgScore > data.avgScore ? "+" : ""}{(secData.avgScore - data.avgScore).toFixed(1)} pts
                    </span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>

        {/* Footer nav */}
        <div className="pt-8 flex items-center justify-between">
          {phase === "sector" ? (
            <button onClick={() => { setPhase("industry"); setSector(null); }}
              className="flex items-center gap-2 text-[10px] uppercase tracking-widest text-stone-500 hover:text-stone-300 transition">
              <Icon path={icons.arrowLeft} size={12} /> Back to industries
            </button>
          ) : <div />}
          <button onClick={advance}
            disabled={phase === "sector" && !sector}
            className={`group flex items-center gap-3 px-7 py-3.5 transition ${
              (phase === "sector" && !sector)
                ? "bg-stone-800 text-stone-600 cursor-not-allowed"
                : "bg-emerald-400 text-black hover:bg-emerald-300"
            }`}>
            <span className="text-xs font-bold uppercase tracking-widest">
              {phase === "industry"
                ? (hasMultipleSectors ? `Zoom into ${data.label} sectors` : `Enter ${data.label}`)
                : (sector ? `Enter ${sector}` : "Pick a sector to continue")}
            </span>
            <Icon path={icons.arrowRight} size={14} className="group-hover:translate-x-1 transition-transform" />
          </button>
        </div>
      </div>
    </div>
  );
}

function StatBox({ label, value, highlight, rose }) {
  return (
    <div className="border border-stone-900 bg-black/30 p-3">
      <div className="text-[9px] uppercase tracking-widest text-stone-600 mb-1">{label}</div>
      <div className={`font-display text-2xl ${highlight ? "text-emerald-400" : rose ? "text-rose-400" : "text-stone-200"}`}>{value}</div>
    </div>
  );
}

/* ============ 03 · LEG · PROGRESSIVE REVEAL QUESTIONNAIRE ============
   Each leg steps through all capabilities in its domain one at a time.
   Answered questions collapse into a compact summary row; the current one
   is expanded with sliders, shrine, and importance. The "Continue to next
   leg" button only appears after the final question is submitted. */

const getStageLabel = (score) => {
  if (score < 25) return { name: "Stagnating", color: "text-rose-400" };
  if (score < 50) return { name: "Emerging", color: "text-amber-400" };
  if (score < 75) return { name: "Scaling", color: "text-lime-400" };
  return { name: "Future-Built", color: "text-emerald-400" };
};

/* ---- Compact summary for an already-answered question ---- */
function QuestionSummary({ q, index, total, answer, onEdit }) {
  if (answer.dontKnow) {
    return (
      <div className="border border-stone-800 bg-[#070a0b]/60 px-5 py-3 flex items-center gap-4 animate-fadeIn">
        <div className="text-[10px] font-mono-custom text-stone-600 w-8">Q{index + 1}/{total}</div>
        <div className="flex-1 min-w-0">
          <div className="text-[10px] uppercase tracking-[0.2em] text-stone-500 truncate">{q.displayCapability || q.capability}</div>
        </div>
        <div className="text-[10px] uppercase tracking-wider text-stone-500 italic">Don't know</div>
        <button onClick={onEdit} className="text-[10px] uppercase tracking-wider text-stone-500 hover:text-emerald-400 transition">Edit</button>
      </div>
    );
  }
  const cur = getStageLabel(answer.current);
  const tgt = getStageLabel(answer.target);
  return (
    <div className="border border-stone-800 bg-[#070a0b]/60 px-5 py-3 flex items-center gap-4 animate-fadeIn">
      <div className="text-[10px] font-mono-custom text-stone-600 w-8">Q{index + 1}/{total}</div>
      <div className="flex-1 min-w-0">
        <div className="text-[10px] uppercase tracking-[0.2em] text-stone-400 truncate">{q.displayCapability || q.capability}</div>
      </div>
      <div className="flex items-center gap-3 text-[10px] font-mono-custom">
        <div className="flex items-baseline gap-1">
          <span className="text-stone-600 uppercase tracking-wider">Now</span>
          <span className={`${cur.color} font-bold`}>{answer.current}</span>
        </div>
        <span className="text-stone-700">→</span>
        <div className="flex items-baseline gap-1">
          <span className="text-stone-600 uppercase tracking-wider">3yr</span>
          <span className={`${tgt.color} italic font-bold`}>{answer.target}</span>
        </div>
      </div>
      {answer.comment && <Icon path={icons.scroll} size={12} className="text-amber-400" />}
      <button onClick={onEdit} className="text-[10px] uppercase tracking-wider text-stone-500 hover:text-emerald-400 transition">Edit</button>
    </div>
  );
}

/* ---- Fully expanded question card (the active one) ---- */
function QuestionCard({ q, index, total, draft, setDraft, onSubmit, settings }) {
  const { current, target, dontKnow, importance, comment, showShrine } = draft;
  const set = (patch) => setDraft({ ...draft, ...patch });

  const curStage = getStageLabel(current);
  const tgtStage = getStageLabel(target);

  return (
    <div className="animate-slideUp space-y-6">
      <div className="border border-emerald-400/30 bg-[#070a0b] p-8 relative">
        {/* Question progress pill */}
        <div className="absolute -top-3 left-6 bg-[#0a0c0d] px-3 flex items-center gap-2 text-[10px] uppercase tracking-[0.25em] text-emerald-400">
          <span className="font-mono-custom text-stone-500">Q{index + 1} of {total}</span>
          <span className="text-stone-700">·</span>
          <span>{q.displayCapability || q.capability}</span>
        </div>

        <p className="font-display text-2xl leading-snug mb-8 mt-2 text-stone-100">
          {q.displayPrompt || q.prompt}
        </p>

        {/* Stage reference cards */}
        <div className="mb-8">
          <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-3">Reference · the 4 stages</div>
          <div className="grid grid-cols-4 gap-px bg-stone-900">
            {q.stages.map((s, i) => {
              const isCurrent = !dontKnow && current >= s.range[0] && current < s.range[1] + (i === 3 ? 1 : 0);
              const colors = ["border-rose-400 bg-rose-400/5", "border-amber-400 bg-amber-400/5", "border-lime-400 bg-lime-400/5", "border-emerald-400 bg-emerald-400/5"];
              const textColors = ["text-rose-400", "text-amber-400", "text-lime-400", "text-emerald-400"];
              return (
                <div key={i} className={`bg-[#070a0b] p-3 border ${isCurrent ? colors[i] : "border-transparent"}`}>
                  <div className={`text-[10px] uppercase tracking-wider mb-1 ${textColors[i]}`}>{s.label}</div>
                  <div className="text-[10px] text-stone-500 leading-relaxed">{s.desc}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* SLIDER 1: Current */}
        <div className={`mb-8 ${dontKnow ? "opacity-40 pointer-events-none" : ""}`}>
          <div className="flex items-baseline justify-between mb-3">
            <div className="text-[10px] uppercase tracking-widest text-stone-400">Your current maturity today</div>
            <div className="flex items-baseline gap-2">
              <span className={`font-display text-3xl ${curStage.color}`}>{current}</span>
              <span className={`text-[10px] uppercase tracking-wider ${curStage.color}`}>{curStage.name}</span>
            </div>
          </div>
          <input type="range" min="0" max="100" value={current} onChange={(e) => set({ current: parseInt(e.target.value) })} className="ascent-slider w-full" />
          <div className="flex justify-between mt-2 text-[9px] uppercase tracking-wider text-stone-600 font-mono-custom">
            <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
          </div>
          <div className="grid grid-cols-4 mt-1 text-[9px] uppercase tracking-wider font-mono-custom">
            <span className="text-rose-400/70 text-center">Stagnating</span>
            <span className="text-amber-400/70 text-center">Emerging</span>
            <span className="text-lime-400/70 text-center">Scaling</span>
            <span className="text-emerald-400/70 text-center">Future-Built</span>
          </div>
        </div>

        {/* SLIDER 2: Target */}
        <div className={`mb-8 ${dontKnow ? "opacity-40 pointer-events-none" : ""}`}>
          <div className="flex items-baseline justify-between mb-3">
            <div className="text-[10px] uppercase tracking-widest text-stone-400">Your target maturity in 3 years</div>
            <div className="flex items-baseline gap-2">
              <span className={`font-display text-3xl ${tgtStage.color} italic`}>{target}</span>
              <span className={`text-[10px] uppercase tracking-wider ${tgtStage.color}`}>{tgtStage.name}</span>
            </div>
          </div>
          <input type="range" min="0" max="100" value={target} onChange={(e) => set({ target: parseInt(e.target.value) })} className="ascent-slider-target w-full" />
          <div className="flex justify-between mt-2 text-[9px] uppercase tracking-wider text-stone-700 font-mono-custom">
            <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
          </div>
          <p className="text-[10px] text-stone-600 italic mt-2">Dashed marker · your 3-year ambition</p>
        </div>

        {/* Importance rating */}
        {settings.importanceRating && (
          <div className="mb-6 pt-6 border-t border-stone-900">
            <div className="text-[10px] uppercase tracking-widest text-stone-400 mb-3">How important is this capability to your 3-year strategy?</div>
            <div className="flex gap-2">
              {["Not important", "Slightly", "Moderately", "Very", "Critical"].map((label, i) => (
                <button key={i} onClick={() => set({ importance: i })}
                  className={`flex-1 px-3 py-2 text-[10px] uppercase tracking-wider border transition ${importance === i ? "border-emerald-400 bg-emerald-400/10 text-emerald-400" : "border-stone-800 text-stone-500 hover:border-stone-600"}`}>
                  {label}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* Don't know + Shrine toggle */}
        <div className="flex items-center justify-between pt-4 border-t border-stone-900">
          <label className="flex items-center gap-2 cursor-pointer text-[10px] uppercase tracking-wider text-stone-500 hover:text-stone-300">
            <input type="checkbox" checked={dontKnow} onChange={(e) => set({ dontKnow: e.target.checked })} className="accent-stone-500" />
            I don't know
          </label>
          <button onClick={() => set({ showShrine: !showShrine })} className={`flex items-center gap-2 text-[10px] uppercase tracking-wider transition ${showShrine || comment ? "text-emerald-400" : "text-stone-500 hover:text-stone-300"}`}>
            <Icon path={icons.scroll} size={12} />
            {comment ? "Message left at shrine" : "Leave a message at the shrine"}
          </button>
        </div>
      </div>

      {/* Shrine */}
      {showShrine && (
        <div className="border border-stone-800 bg-gradient-to-b from-amber-900/10 to-[#070a0b] p-6 animate-slideUp relative">
          <div className="absolute top-0 left-6 -translate-y-1/2 bg-[#0a0c0d] px-3 flex items-center gap-2 text-[10px] uppercase tracking-[0.25em] text-amber-400">
            <Icon path={icons.scroll} size={10} />
            The Shrine
          </div>
          <p className="text-xs text-stone-500 italic mb-3 mt-2">
            Leave a note about this capability. What factors drive your current score? What's blocking you from reaching the next stage? (Optional. Future climbers reading this will thank you.)
          </p>
          <textarea
            value={comment}
            onChange={(e) => set({ comment: e.target.value })}
            placeholder="Our challenge with this capability is…"
            rows={4}
            maxLength={500}
            className="w-full bg-black/40 border border-stone-800 text-stone-200 p-3 text-sm focus:outline-none focus:border-stone-600 resize-none font-mono-custom"
          />
          <div className="flex justify-between items-center mt-2 text-[10px] uppercase tracking-widest text-stone-600">
            <span>{comment.length} / 500 characters</span>
            <span>Visible only in your report</span>
          </div>
        </div>
      )}

      {/* Submit button for this question */}
      <div className="flex justify-end">
        <button onClick={onSubmit} className="group flex items-center gap-3 bg-emerald-400 text-black px-6 py-3 hover:bg-emerald-300 transition">
          <span className="text-xs font-bold uppercase tracking-widest">
            {index + 1 < total ? `Submit · unlock Q${index + 2}` : "Submit final question"}
          </span>
          <Icon path={icons.arrowRight} size={14} />
        </button>
      </div>
    </div>
  );
}

/* ============ THRESHOLD · the moment of commitment ============
   Sits between Realm (where the player chose their bench) and Leg 1.
   This is the "I'm doing this" beat. It sets honest expectations about
   time and effort, and surfaces workshop mode at the moment it's most
   useful: right before the player commits the next 25 minutes. */
function Threshold({ industry, sector, settings, setSettings, onStart, onPrev, session, respondentMeta }) {
  const indLabel = INDUSTRY_META[industry]?.label || industry;
  const benchLabel = sector ? `${sector} · ${indLabel}` : indLabel;

function Leg({ step, onNext, onPrev, settings, answers, setAnswers, workshopCapLabels, sector }) {
  const domain = DOMAINS[step.legNum - 1];
  const allQuestions = BFF_QUESTIONS[domain.key] || [];
  
  // For Operations domain, resolve sector-specific display labels and prompts.
  // Other domains pass through unchanged. The underlying `capability` field
  // (used as a data key for bench/score joins) is preserved; only the display
  // strings shown to the user are swapped.
  const resolveDisplay = (q, slotIdx) => {
    if (domain.key !== "Operations") return q;
    const sectorLabel = getSectorOpsLabel(sector, slotIdx);
    const sectorPrompt = getSectorOpsPrompt(sector, slotIdx);
    return {
      ...q,
      displayCapability: sectorLabel || q.capability,
      displayPrompt: sectorPrompt || q.prompt,
    };
  };
  
  // The "renderable" questions for this run. In normal mode, all of them.
  // In workshop mode, only those whose capability label is in the workshop set.
  // We keep a parallel `slotIndex` for each renderable question so writes go
  // to the right position in the answers array (preserving alignment with the
  // full BFF_QUESTIONS structure that computePlayerScores expects).
  const questions = workshopCapLabels
    ? allQuestions.map((q, slotIdx) => resolveDisplay({ ...q, slotIdx }, slotIdx))
        .filter(q => workshopCapLabels.has(q.capability))
    : allQuestions.map((q, slotIdx) => resolveDisplay({ ...q, slotIdx }, slotIdx));
  const total = questions.length;
  
  // Per-leg answer array, indexed by SLOT (not by renderable position).
  // Length always matches allQuestions, even in workshop mode.
  const legAnswers = answers[domain.key] || allQuestions.map(() => null);
  
  // Count answered renderable questions for the progress display
  const answeredCount = questions.filter(q => legAnswers[q.slotIdx] !== null).length;
  const allAnswered = answeredCount === total && total > 0;

  // activeIdx is an ORDINAL POSITION in the `questions` array (0..total-1, or `total` to mean done).
  // To read or write an answer, use questions[activeIdx].slotIdx.
  const findFirstUnansweredOrdinal = () => {
    for (let i = 0; i < total; i++) {
      if (legAnswers[questions[i].slotIdx] === null) return i;
    }
    return total;
  };
  const initialActiveIdx = findFirstUnansweredOrdinal();

  const [activeIdx, setActiveIdx] = useState(initialActiveIdx);
  // Draft state for the active question
  const [draft, setDraft] = useState(() => {
    const slotIdx = questions[initialActiveIdx]?.slotIdx;
    const existing = slotIdx !== undefined ? legAnswers[slotIdx] : null;
    return existing || { current: 45, target: 75, dontKnow: false, importance: null, comment: "", showShrine: false };
  });

  // Reset local state when the leg changes (but DON'T wipe saved answers; they live in App)
  useEffect(() => {
    const idx = findFirstUnansweredOrdinal();
    setActiveIdx(idx);
    const slotIdx = questions[idx]?.slotIdx;
    const existing = slotIdx !== undefined ? legAnswers[slotIdx] : null;
    setDraft(existing || { current: 45, target: 75, dontKnow: false, importance: null, comment: "", showShrine: false });
  }, [step.id]);

  const altitude = Math.min(22 + step.legNum * 8, 82);

  const writeSlice = (newSlice) => {
    setAnswers(prev => ({ ...prev, [domain.key]: newSlice }));
  };

  const submitCurrent = () => {
    const newSlice = [...legAnswers];
    const slotIdx = questions[activeIdx].slotIdx;
    newSlice[slotIdx] = { ...draft };
    writeSlice(newSlice);
    // Advance to next ordinal position, if any
    const nextOrdinal = activeIdx + 1;
    if (nextOrdinal < total) {
      setActiveIdx(nextOrdinal);
      const nextSlot = questions[nextOrdinal].slotIdx;
      const existing = newSlice[nextSlot];
      setDraft(existing || { current: 45, target: 75, dontKnow: false, importance: null, comment: "", showShrine: false });
    } else {
      setActiveIdx(total);
    }
  };

  const editAnswer = (ordinal) => {
    setActiveIdx(ordinal);
    const slotIdx = questions[ordinal].slotIdx;
    const existing = legAnswers[slotIdx];
    setDraft(existing || { current: 45, target: 75, dontKnow: false, importance: null, comment: "", showShrine: false });
  };

  return (
    <div className="min-h-[calc(100vh-96px)] relative">
      <div className="paper-noise absolute inset-0" />

      <div className="px-6 py-10 relative max-w-4xl mx-auto">
        <div className="flex items-center gap-3 mb-4 text-[10px] uppercase tracking-[0.3em] text-stone-500">
          <Icon path={icons.mapPin} size={12} className="text-emerald-400" />
          Leg {step.legNum} of 8 · {domain.label}
          <div className="flex-1 h-px bg-stone-900" />
          <span className="text-stone-600">Altitude {altitude} / 100</span>
        </div>

        <h2 className="font-display text-4xl md:text-5xl leading-tight mb-3">
          {legTitles[domain.key].title} <span className="italic text-emerald-400">{legTitles[domain.key].accent}</span>
        </h2>
        <p className="text-stone-400 text-sm mb-6 max-w-2xl leading-relaxed">
          {legTitles[domain.key].lede}
        </p>

        {/* Progress dots */}
        <div className="flex items-center gap-2 mb-10">
          <div className="flex gap-1.5">
            {questions.map((q, i) => {
              const answered = legAnswers[q.slotIdx] !== null;
              const isActive = i === activeIdx;
              return (
                <div key={i} className={`h-1.5 w-8 transition ${
                  answered ? "bg-emerald-400" : isActive ? "bg-stone-400" : "bg-stone-800"
                }`} />
              );
            })}
          </div>
          <span className="text-[10px] uppercase tracking-[0.2em] text-stone-600 ml-3 font-mono-custom">
            {answeredCount} / {total} answered
          </span>
        </div>

        {total === 0 ? (
          <div className="border border-stone-800 bg-[#070a0b] p-8">
            <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-4">No questions wired</div>
            <p className="text-stone-400 text-sm leading-relaxed">
              This leg has no questions defined in BFF_QUESTIONS.{domain.key}.
            </p>
          </div>
        ) : (
          <div className="space-y-3">
            {questions.map((q, i) => {
              const answered = legAnswers[q.slotIdx] !== null;
              const isActive = i === activeIdx;
              if (answered && !isActive) {
                return <QuestionSummary key={q.capability} q={q} index={i} total={total} answer={legAnswers[q.slotIdx]} onEdit={() => editAnswer(i)} />;
              }
              if (isActive) {
                return (
                  <QuestionCard
                    key={q.capability}
                    q={q}
                    index={i}
                    total={total}
                    draft={draft}
                    setDraft={setDraft}
                    onSubmit={submitCurrent}
                    settings={settings}
                  />
                );
              }
              // Locked (future) question: show a hint row
              return (
                <div key={q.capability} className="border border-stone-900 bg-[#070a0b]/40 px-5 py-3 flex items-center gap-4 opacity-50">
                  <div className="text-[10px] font-mono-custom text-stone-700 w-8">Q{i + 1}/{total}</div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[10px] uppercase tracking-[0.2em] text-stone-600 truncate">{q.displayCapability || q.capability}</div>
                  </div>
                  <div className="text-[10px] uppercase tracking-wider text-stone-700">Locked</div>
                </div>
              );
            })}
          </div>
        )}

        {/* Leg-level nav: Previous leg always visible; Continue appears only after all answered */}
        <div className="mt-10 flex items-center justify-between border-t border-stone-900 pt-6">
          <button onClick={onPrev} className="flex items-center gap-2 text-[10px] uppercase tracking-widest text-stone-500 hover:text-stone-300 transition">
            <Icon path={icons.arrowLeft} size={12} /> Previous
          </button>
          {allAnswered ? (
            <button onClick={onNext} className="group flex items-center gap-3 bg-emerald-400 text-black px-6 py-3 hover:bg-emerald-300 transition animate-fadeIn">
              <span className="text-xs font-bold uppercase tracking-widest">Leg complete · continue the climb →</span>
            </button>
          ) : (
            <div className="text-[10px] uppercase tracking-widest text-stone-600 italic">
              {total - answeredCount} question{total - answeredCount === 1 ? "" : "s"} remaining on this peak
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ DERIVED SCORES · compute player scores from answers ============
   Rules:
   - "Don't know" answers are excluded from averages (not counted as 0)
   - Domain score = avg of non-"don't know" current maturities; null if 0 valid answers
   - Overall BFF score = avg of non-null domain scores
   - Fallback mocks used where no data exists (so Summit works as a designer preview) */
const MOCK_PLAYER = {
  overall: 64,
  stage: "Scaling",
  domains: { Strategy: 72, Innovation: 55, CX: 65, Operations: 78, Technology: 62, Data: 28, OpModel: 58, People: 68 },
};

/* ============ WORKSHOP MODE: capability selection ============
   For workshop mode, pick 12 capabilities (out of 41) using a budget:
   each domain gets at least 1 capability so the domain score is computable.
   Emphasized domains get an extra capability. Within each domain, the
   highest-SD capabilities are selected (those that discriminate most across
   the population, hence carry the most signal per question).

   Domain budget allocation:
   - 8 domains * 1 cap = 8 capabilities (baseline)
   - 4 emphasized domains add 1 each = up to 4 extra; trimmed to fit 12
   - If fewer than 4 emphasized, distribute extras to highest-SD domains
   
   Returns: an array of capability KEYS (matching ASCENT_DATA.capabilities[].key),
   ordered by domain (so the questionnaire flow stays coherent). */
/* ============ MULTIPLAYER (Multi-Respondent) MODE ============
   Uses the artifact runtime's window.storage API to share data across users
   who open the same artifact link. Two scopes:
   - Personal (shared:false): per-user, used to remember "which respondent am I"
   - Shared (shared:true): visible to anyone with the artifact link, used for
     session config and respondent answers.
   
   This is workshop-grade collaboration, not enterprise privacy. Anyone with
   the artifact link AND the session code can read all responses. The session
   code is the only barrier; treat it as a soft secret. The methodology
   footnote on the dashboard makes this explicit.
   
   Storage layout:
     personal: respondentId:{sessionCode} -> {id} (so reopens recover identity)
     shared:   session:{code}:meta        -> {industry, sector, departments, createdAt}
     shared:   session:{code}:resp:{rid}  -> {meta:{department,role}, answers, updatedAt}
*/

// 6-character session code, no I/O/0/1 to avoid confusion. Format: BCG-XXXX.
const generateSessionCode = () => {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 4; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  return `BCG-${code}`;
};

const generateRespondentId = () => {
  // Short uuid-ish identifier for keys; doesn't need to be cryptographically strong
  const part = () => Math.random().toString(36).substring(2, 8);
  return `r${part()}${part()}`;
};

/* ============ BACKEND CONFIG ============
   The Ascent's multiplayer mode talks to a Cloudflare Worker that mirrors
   the original window.storage API. The Worker provides the shared key-value
   store across users.
   
   To deploy your own Worker (e.g., when BCG ports this to managed infra),
   change BACKEND_URL below to the new endpoint. No other changes needed;
   the Worker exposes a stable API contract documented in worker.js.
*/
const BACKEND_URL = "https://the-ascent-backend.bff-the-ascent.workers.dev";

// Set to true once the connection test succeeds. Drives the cover-screen
// indicator and gates the "I'm the organizer" / "Join session" affordances.
let BACKEND_AVAILABLE = false;
let BACKEND_CHECKED = false;

// Health-check the backend. Called once on app load; result memoized.
const checkBackend = async () => {
  if (BACKEND_CHECKED) return BACKEND_AVAILABLE;
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 5000);
    const res = await fetch(`${BACKEND_URL}/health`, { signal: ctrl.signal });
    clearTimeout(timeout);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    BACKEND_AVAILABLE = !!data.ok;
  } catch (err) {
    console.warn("Backend health check failed:", err.message);
    BACKEND_AVAILABLE = false;
  }
  BACKEND_CHECKED = true;
  return BACKEND_AVAILABLE;
};

/* ============ HIGH-LEVEL SESSION API ============
   These functions are called from React components. Same signatures as the
   prior window.storage-based versions, so no changes needed in components. */

/* ============ PERSONAL STORAGE (per-browser) ============
   Used to remember "which respondent am I in this session" so re-opens
   recover the same identity. localStorage is per-user-per-browser, which
   is exactly the semantics we want (no backend needed). */
const rememberRespondentId = async (code, id) => {
  try { localStorage.setItem(`respondentId:${code}`, id); return true; }
  catch { return false; }
};
const recallRespondentId = async (code) => {
  try { return localStorage.getItem(`respondentId:${code}`); }
  catch { return null; }
};

/* ============ MULTIPLAYER AGGREGATION ============
   Given an array of respondent answer-objects, compute:
   - per-capability mean (ignoring respondents who didn't answer that cap)
   - per-capability SD across respondents
   - team-level aggregate that mimics computePlayerScores's output shape
   - per-department breakdowns (where N>=3 in dept)
*/
const computeTeamAggregate = (respondents) => {
  if (!respondents || respondents.length === 0) {
    return null;
  }
  
  // For each capability label, collect all respondents' scores for it (skipping nulls/dontknow)
  const capScores = {};   // label -> array of scores
  const capTargets = {};  // label -> array of targets
  Object.keys(BFF_QUESTIONS).forEach(domKey => {
    const questions = BFF_QUESTIONS[domKey];
    questions.forEach((q) => {
      capScores[q.capability] = [];
      capTargets[q.capability] = [];
    });
  });
  
  respondents.forEach(resp => {
    if (!resp.answers) return;
    Object.keys(BFF_QUESTIONS).forEach(domKey => {
      const questions = BFF_QUESTIONS[domKey];
      const answerArray = resp.answers[domKey] || [];
      questions.forEach((q, i) => {
        const a = answerArray[i];
        if (a && !a.dontKnow && typeof a.current === "number") {
          capScores[q.capability].push(a.current);
        }
        if (a && !a.dontKnow && typeof a.target === "number") {
          capTargets[q.capability].push(a.target);
        }
      });
    });
  });
  
  // Per-capability stats (mean, sd, n)
  const capabilities = {};
  const capabilityVariance = {};
  Object.keys(capScores).forEach(label => {
    const arr = capScores[label];
    if (arr.length === 0) {
      capabilities[label] = 0;
      capabilityVariance[label] = { mean: null, sd: null, n: 0 };
      return;
    }
    const mean = arr.reduce((s, v) => s + v, 0) / arr.length;
    const sd = arr.length > 1 
      ? Math.sqrt(arr.reduce((s, v) => s + Math.pow(v - mean, 2), 0) / (arr.length - 1)) 
      : 0;
    capabilities[label] = mean;
    capabilityVariance[label] = { mean, sd, n: arr.length, min: Math.min(...arr), max: Math.max(...arr) };
  });
  
  // Domain scores: mean across capabilities in that domain (treating empty caps as 0)
  const domains = {};
  const answeredPerDomain = {};
  Object.keys(BFF_QUESTIONS).forEach(domKey => {
    const labels = BFF_QUESTIONS[domKey].map(q => q.capability);
    const validScores = labels.map(l => capabilities[l]).filter(v => v != null);
    domains[domKey] = validScores.length > 0 
      ? validScores.reduce((s, v) => s + v, 0) / validScores.length 
      : 0;
    // Count: how many respondents answered AT LEAST ONE question in this domain
    answeredPerDomain[domKey] = respondents.filter(r => {
      const arr = (r.answers && r.answers[domKey]) || [];
      return arr.some(a => a !== null);
    }).length;
  });
  
  // Overall: mean of domains
  const overall = Object.values(domains).reduce((s, v) => s + v, 0) / Object.keys(domains).length;
  const stage = stageFromScore(overall);
  
  // Total questions/answered (for confidence display)
  const totalQuestions = Object.values(BFF_QUESTIONS).reduce((s, qs) => s + qs.length, 0);
  let totalAnswered = 0;
  respondents.forEach(r => {
    if (!r.answers) return;
    Object.values(r.answers).forEach(arr => {
      (arr || []).forEach(a => {
        if (a && !a.dontKnow) totalAnswered++;
      });
    });
  });
  
  // Targets in same shape
  const targets = {};
  Object.keys(capTargets).forEach(label => {
    const arr = capTargets[label];
    if (arr.length > 0) {
      targets[label] = arr.reduce((s, v) => s + v, 0) / arr.length;
    }
  });
  
  return {
    overall: Math.round(overall),
    stage,
    domains,
    capabilities,
    capabilityVariance,
    targets,
    comments: [],  // aggregate doesn't surface individual comments; empty for shape-compatibility
    answeredPerDomain,
    totalAnswered,
    totalQuestions,
    hasAnyAnswers: totalAnswered > 0,
    respondentCount: respondents.length,
    // Confidence interval not directly meaningful for aggregate; provide null
    // so SummitHero falls back to its no-confidence path.
    confidence: null,
  };
};

const selectWorkshopCapabilities = (emphasizedDomains, totalBudget = 12) => {
  const DOMAIN_KEYS = ASCENT_DATA.meta.domainKeys;
  const allCaps = ASCENT_DATA.capabilities;
  
  // Group capabilities by domain, sort by SD descending within each
  const byDomain = {};
  DOMAIN_KEYS.forEach(d => {
    byDomain[d] = allCaps
      .filter(c => c.domain === d)
      .sort((a, b) => (b.sd || 0) - (a.sd || 0));
  });
  
  // Budget allocation: each domain gets 1 baseline, emphasized get +1.
  const budget = {};
  DOMAIN_KEYS.forEach(d => { budget[d] = 1; });
  let remaining = totalBudget - DOMAIN_KEYS.length;  // 12 - 8 = 4 extras
  
  // First round: emphasized domains get the extras (capped)
  const valid = (emphasizedDomains || []).filter(d => DOMAIN_KEYS.includes(d));
  for (const d of valid) {
    if (remaining > 0) {
      budget[d] = Math.min(2, budget[d] + 1);  // cap at 2 per domain
      remaining--;
    }
  }
  
  // Second round: any remaining extras go to highest-overall-SD domains
  if (remaining > 0) {
    const ranked = DOMAIN_KEYS
      .filter(d => budget[d] < 2)
      .sort((a, b) => {
        const aSd = (byDomain[a][0]?.sd || 0);
        const bSd = (byDomain[b][0]?.sd || 0);
        return bSd - aSd;
      });
    for (const d of ranked) {
      if (remaining <= 0) break;
      budget[d]++;
      remaining--;
    }
  }
  
  // Build the selected list: take the top-SD capabilities from each domain per budget
  const selected = [];
  DOMAIN_KEYS.forEach(d => {
    const n = budget[d];
    byDomain[d].slice(0, n).forEach(c => selected.push(c.key));
  });
  return selected;
};

const stageFromScore = (score) => {
  if (score < 25) return "Stagnating";
  if (score < 50) return "Emerging";
  if (score < 75) return "Scaling";
  return "Future-Built";
};

const computePlayerScores = (answers) => {
  const domains = {};
  const comments = {}; // domain.key -> array of { capability, comment }
  const targets = {};  // domain.key -> avg target
  const answeredPerDomain = {};
  const capabilities = {}; // capability label -> player's current score (matches labels in ASCENT_DATA.capabilities)

  Object.keys(BFF_QUESTIONS).forEach(domKey => {
    const slice = answers[domKey] || [];
    const valid = slice.filter(a => a !== null && !a.dontKnow);
    answeredPerDomain[domKey] = slice.filter(a => a !== null).length;
    if (valid.length > 0) {
      domains[domKey] = Math.round(valid.reduce((s, a) => s + a.current, 0) / valid.length);
      targets[domKey] = Math.round(valid.reduce((s, a) => s + a.target, 0) / valid.length);
    } else {
      domains[domKey] = null;
      targets[domKey] = null;
    }
    const caps = BFF_QUESTIONS[domKey];
    // Per-capability player scores, indexed by capability label so Summit can join
    // against ASCENT_DATA.capabilities[].label
    slice.forEach((a, i) => {
      const cap = caps[i];
      if (!cap) return;
      if (a !== null && !a.dontKnow && typeof a.current === "number") {
        capabilities[cap.capability] = a.current;
      }
    });
    // Collect comments for the PDF shrine section
    comments[domKey] = slice
      .map((a, i) => (a && a.comment && a.comment.trim()) ? { capability: caps[i].capability, comment: a.comment.trim() } : null)
      .filter(Boolean);
  });

  const validDomains = Object.values(domains).filter(d => d !== null);
  const hasAnyAnswers = validDomains.length > 0;

  // For Summit display keys, map our domKey to the Summit's playerDomains keys
  // (Summit used: Strategy, Innovation, CX, Operations, Technology, Data, OpModel, People; same keys)
  const summitDomains = {};
  Object.keys(BFF_QUESTIONS).forEach(k => {
    summitDomains[k] = domains[k] !== null ? domains[k] : MOCK_PLAYER.domains[k];
  });

  const overall = hasAnyAnswers
    ? Math.round(validDomains.reduce((s, v) => s + v, 0) / validDomains.length)
    : MOCK_PLAYER.overall;

  // ---- Confidence interval on the overall score ----
  // The player gave answers on a subset of capabilities. We want a 70% CI
  // on the "true" overall score they'd give if they answered all of them.
  //
  // Math: standard error of the mean with finite-population correction.
  //   SEM_fpc = (s / sqrt(n)) * sqrt((N - n) / (N - 1))
  //   CI = mean +/- 1.04 * SEM_fpc        (z=1.04 -> 70% normal CI)
  //
  // When n == N (everything answered), FPC = 0, CI collapses to the point.
  // When n is small, CI widens. We cap the CI at +/-15 so it never overshoots
  // the 0-100 scale absurdly even on n=1 outliers.
  const allAnsweredCapScores = [];
  Object.keys(BFF_QUESTIONS).forEach(domKey => {
    (answers[domKey] || []).forEach(a => {
      if (a !== null && !a.dontKnow && typeof a.current === "number") {
        allAnsweredCapScores.push(a.current);
      }
    });
  });
  const n = allAnsweredCapScores.length;
  const N = Object.values(BFF_QUESTIONS).reduce((s, arr) => s + arr.length, 0);
  let confidence = null;
  if (hasAnyAnswers && n >= 2) {
    const mean = allAnsweredCapScores.reduce((s, v) => s + v, 0) / n;
    const variance = allAnsweredCapScores.reduce((s, v) => s + (v - mean) ** 2, 0) / (n - 1);
    const sd = Math.sqrt(variance);
    const fpc = n < N ? Math.sqrt((N - n) / (N - 1)) : 0;
    const sem = (sd / Math.sqrt(n)) * fpc;
    const halfWidth = Math.min(15, 1.04 * sem);  // cap at +/-15
    confidence = {
      level: 70,
      n,
      N,
      halfWidth: Math.round(halfWidth * 10) / 10,
      lower: Math.max(0, Math.round(overall - halfWidth)),
      upper: Math.min(100, Math.round(overall + halfWidth)),
      tight: halfWidth < 2,  // flag for UI: very tight CI = effectively a point estimate
    };
  }

  return {
    overall,
    stage: stageFromScore(overall),
    domains: summitDomains,
    capabilities,  // new: per-capability player scores keyed by capability label
    targets,
    comments,
    answeredPerDomain,
    hasAnyAnswers,
    confidence,
    totalAnswered: Object.values(answeredPerDomain).reduce((s, n) => s + n, 0),
    totalQuestions: N,
  };
};

/* ============ ARCHETYPE · derived from domain pattern ============ */
const deriveArchetype = (playerDomains, bench) => {
  // Find strongest and weakest domain vs benchmark
  const deltas = Object.entries(playerDomains).map(([k, v]) => ({
    key: k,
    score: v,
    delta: v - (bench.domains[k] || 0),
  }));
  const sorted = [...deltas].sort((a, b) => b.delta - a.delta);
  const strongest = sorted[0];
  const weakest = sorted[sorted.length - 1];

  // Simple archetype mapping
  const archetypes = {
    Strategy:   { name: "The Strategic Summiteer", blurb: "You lead with vision. Your strategy is clear, your leadership aligned." },
    Innovation: { name: "The Innovator", blurb: "You experiment where others hesitate. New products and processes are your altitude." },
    CX:         { name: "The Customer Champion", blurb: "You win on the ridgelines where customers live. Journeys, personalization, service." },
    Operations: { name: "The Operations Summiteer", blurb: "You excel in the operational peaks. Your teams execute. Your processes scale." },
    Technology: { name: "The Platform Builder", blurb: "Your foundations are solid. Modern platforms carry you higher than most." },
    Data:       { name: "The Data Strategist", blurb: "You treat data as an asset. Governance, quality, analytics: your base camp is strong." },
    OpModel:    { name: "The Agile Architect", blurb: "Your operating model bends without breaking. Product teams, ecosystems, delivery." },
    People:     { name: "The Talent Whisperer", blurb: "You climb with your people. Culture, upskilling, change: the softest terrain mastered." },
  };
  const arch = archetypes[strongest.key] || archetypes.Strategy;
  return { ...arch, strongest, weakest };
};

/* ============ 04 · CAMP · Mid-climb interpretive pause ============
   Camps do three things: provisional snapshot, recognition (what the climb
   has revealed so far), and setup for what's next. Content is honest and
   data-driven; no archetype assignment until all 8 legs are in. */
function Camp({ variant, industry, sector, answers, onNext }) {
  const isFinal = variant === "final";
  const benchObj = getBenchmark(industry, sector, null);
  const benchmark = benchObj.cell;
  const benchmarkLabel = benchObj.label;
  const DOMAIN_LABELS = ASCENT_DATA.meta.domainLabels;
  
  // Derive per-leg progress from actual answers
  const derived = computePlayerScores(answers);
  
  // Legs BEFORE base camp: Strategy, Innovation, CX, Operations.
  // Legs BEFORE final camp: all of the above + Technology, Data, OpModel.
  const legsBefore = isFinal
    ? ["Strategy", "Innovation", "CX", "Operations", "Technology", "Data", "OpModel"]
    : ["Strategy", "Innovation", "CX", "Operations"];
  const legsAfter = isFinal ? ["People"] : ["Technology", "Data", "OpModel", "People"];

  const stageKeyFromScore = (s) => {
    if (s < 25) return "stagnating";
    if (s < 50) return "emerging";
    if (s < 75) return "scaling";
    return "futurebuilt";
  };

  // Only legs with at least one answered question count as complete
  const completedLegs = legsBefore
    .filter(k => derived.answeredPerDomain[k] > 0)
    .map(k => [DOMAIN_LABELS[k], derived.domains[k], stageKeyFromScore(derived.domains[k]), k]);

  const hasRealData = completedLegs.length > 0;
  const displayLegs = hasRealData
    ? completedLegs
    : legsBefore.map(k => [DOMAIN_LABELS[k], 0, "stagnating", k]);

  const upcomingLegs = legsAfter.map(k => DOMAIN_LABELS[k]);

  const weakest = displayLegs.reduce((min, leg) => leg[1] < min[1] ? leg : min, displayLegs[0]);
  const strongest = displayLegs.reduce((max, leg) => leg[1] > max[1] ? leg : max, displayLegs[0]);
  const avgScore = hasRealData
    ? Math.round(displayLegs.reduce((sum, leg) => sum + leg[1], 0) / displayLegs.length)
    : 0;
  const deltaVsBench = (benchmark && hasRealData) ? Math.round(avgScore - benchmark.avgScore) : null;

  // Real question counter: tally across legs BEHIND this camp
  const questionsAnswered = legsBefore.reduce((s, k) => s + (derived.answeredPerDomain[k] || 0), 0);
  const questionsTotalBehind = legsBefore.reduce((s, k) => s + (BFF_QUESTIONS[k] || []).length, 0);

  // Altitude scales with legs behind / 8
  const altitude = Math.round(22 + (legsBefore.length / 8) * 60);

  // === Pattern recognition: what shape did the climber reveal so far? ===
  // For BASE camp (4 domains), we have 4 axes. Look for the thinking-vs-doing split.
  // For FINAL camp (7 domains), we have richer signal across foundations vs value vs talent.
  const shapeReading = React.useMemo(() => {
    if (!hasRealData || completedLegs.length < 3) return null;
    
    const scoreOf = (domKey) => {
      const found = completedLegs.find(leg => leg[3] === domKey);
      return found ? found[1] : null;
    };
    
    const playerOverallAvg = avgScore;
    const SPREAD_THRESHOLD = 8;  // points; less than this = "consistent"
    const scores = completedLegs.map(l => l[1]);
    const spread = Math.max(...scores) - Math.min(...scores);
    
    // BASE camp pattern detection (Strategy/Innovation/CX/Operations)
    if (!isFinal) {
      const strategy = scoreOf("Strategy");
      const innovation = scoreOf("Innovation");
      const cx = scoreOf("CX");
      const ops = scoreOf("Operations");
      
      if (spread < SPREAD_THRESHOLD) {
        return {
          kind: "consistent",
          headline: "Consistent across the four peaks so far.",
          body: `Your scores cluster within ${spread} points (range ${Math.min(...scores)} to ${Math.max(...scores)}). That tells us something itself: companies with this evenness usually have either deliberate cross-functional alignment or a uniform lack of investment. The next four peaks (Tech, Data, Op Model, People) will distinguish which.`,
        };
      }
      
      // Compute thinking (Strategy+Innovation) vs doing (CX+Ops) split
      if (strategy != null && innovation != null && cx != null && ops != null) {
        const thinking = (strategy + innovation) / 2;
        const doing = (cx + ops) / 2;
        const split = thinking - doing;
        if (split > 8) {
          return {
            kind: "thinking-heavy",
            headline: "The shape so far: thinking-heavy, doing-light.",
            body: `Strategy and Innovation are running ${split.toFixed(0)} points ahead of CX and Operations. That's the AI-strategy-on-paper pattern. It's a valid place to be early, but the gap closes one of two ways: the operational peaks lift toward the strategic ones, or the strategic ones drift back to match operational reality. The next four legs will reveal which way you're heading.`,
          };
        }
        if (split < -8) {
          return {
            kind: "doing-heavy",
            headline: "The shape so far: doing-heavy, thinking-light.",
            body: `CX and Operations are running ${Math.abs(split).toFixed(0)} points ahead of Strategy and Innovation. Tactical strength without strategic anchoring. This often shows up in companies that have AI use cases working in pockets but lack the cross-functional thread to scale them. The next four legs (Tech, Data, Op Model, People) will tell us whether the foundation is strong enough to support what you've built.`,
          };
        }
      }
      
      return {
        kind: "mixed",
        headline: "Mixed signals across the first four peaks.",
        body: `Your scores range from ${Math.min(...scores)} to ${Math.max(...scores)} with no clear axis. Strongest: ${strongest[0]} at ${strongest[1]}. Weakest: ${weakest[0]} at ${weakest[1]}. The next four peaks will sharpen the picture; for now, hold off on conclusions.`,
      };
    }
    
    // FINAL camp pattern detection (7 of 8 domains, only People remaining)
    // Look at foundations (Tech/Data/OpModel) vs value (CX/Ops/Innovation) vs strategic spine (Strategy)
    const foundations = ["Technology", "Data", "OpModel"]
      .map(k => scoreOf(k)).filter(v => v != null);
    const value = ["CX", "Operations", "Innovation"]
      .map(k => scoreOf(k)).filter(v => v != null);
    const strategy = scoreOf("Strategy");
    
    if (foundations.length === 0 || value.length === 0) {
      return {
        kind: "incomplete",
        headline: "Almost there.",
        body: `${completedLegs.length} of 7 peaks complete behind you. The pattern is emerging but not yet sharp. People is the final peak.`,
      };
    }
    
    const fAvg = foundations.reduce((a, b) => a + b, 0) / foundations.length;
    const vAvg = value.reduce((a, b) => a + b, 0) / value.length;
    const fvSplit = fAvg - vAvg;
    
    if (spread < SPREAD_THRESHOLD) {
      return {
        kind: "final-consistent",
        headline: "Seven peaks behind. Consistent across all of them.",
        body: `Your scores hold within ${spread} points across foundations, value, and strategy. People remains. This last leg often breaks the symmetry: companies that look balanced for seven domains frequently reveal asymmetry on People (talent, change, leadership savviness). Be especially honest on this one.`,
      };
    }
    
    if (fvSplit > 10) {
      return {
        kind: "foundations-strong",
        headline: "Foundations strong, value-side trailing.",
        body: `Tech, Data, and Op Model are running ${fvSplit.toFixed(0)} points ahead of CX, Operations, and Innovation. The plumbing is there but it isn't being pointed at the work that pays for it. This shows up in companies that have invested heavily in AI infrastructure ahead of demand-side use cases. The People leg will tell us whether the talent is positioned to convert it.`,
      };
    }
    if (fvSplit < -10) {
      return {
        kind: "value-strong",
        headline: "Value-side strong, foundations trailing.",
        body: `CX, Operations, and Innovation are running ${Math.abs(fvSplit).toFixed(0)} points ahead of Tech, Data, and Op Model. You're getting AI value out of weak underpinnings. That's possible in the short run; harder to scale. The People leg matters: if your talent is the reason this works, that's fragile. If your processes are the reason, that's resilient.`,
      };
    }
    
    return {
      kind: "final-balanced",
      headline: "Seven peaks behind. Balanced shape so far.",
      body: `Foundations and value side are within ${Math.abs(fvSplit).toFixed(0)} points of each other (foundations ${fAvg.toFixed(0)}, value ${vAvg.toFixed(0)}). The People leg is the final differentiator. Companies with otherwise-balanced profiles split here: leaders carry People with them, laggards drag everything down with it.`,
    };
  }, [hasRealData, completedLegs, isFinal, avgScore, strongest, weakest]);
  
  // === Provisional position in the global distribution ===
  // Use the global dist (always available) for the provisional reading.
  // We're explicit that this is provisional and the running average is partial signal.
  const provisionalPosition = React.useMemo(() => {
    if (!hasRealData) return null;
    const dist = ASCENT_DATA.meta.globalDist;
    if (!dist) return null;
    const { p10, p25, p50, p75, p90 } = dist;
    let bucket;
    if (avgScore < p10) bucket = "Bottom decile";
    else if (avgScore < p25) bucket = "Bottom quartile";
    else if (avgScore < p50) bucket = "Below median";
    else if (avgScore < p75) bucket = "Above median";
    else if (avgScore < p90) bucket = "Top quartile";
    else bucket = "Top decile";
    return { bucket, dist };
  }, [hasRealData, avgScore]);
  
  // === Setup for what's next: which upcoming peaks have the most variance ===
  // Higher SD across the bench in a domain = more separation between leaders/laggards
  // = "where companies typically break out or get stuck"
  const upcomingFraming = React.useMemo(() => {
    if (!benchmark || !benchmark.domains) return null;
    
    // Use the per-capability SD data we computed in Round B to score each upcoming domain.
    // Average SD across all capabilities in that domain = how variable that domain is in the bench.
    const domainVariance = {};
    legsAfter.forEach(domKey => {
      const caps = ASCENT_DATA.capabilities.filter(c => c.domain === domKey);
      if (caps.length === 0) return;
      const avgSd = caps.reduce((s, c) => s + (c.sd || 0), 0) / caps.length;
      domainVariance[domKey] = avgSd;
    });
    
    const sorted = Object.entries(domainVariance).sort((a, b) => b[1] - a[1]);
    if (sorted.length === 0) return null;
    
    const [topVarDom, topVarSd] = sorted[0];
    const lowVarDom = sorted.length > 1 ? sorted[sorted.length - 1] : null;
    
    return {
      breakoutDomain: DOMAIN_LABELS[topVarDom] || topVarDom,
      breakoutSd: topVarSd,
      tightDomain: lowVarDom ? (DOMAIN_LABELS[lowVarDom[0]] || lowVarDom[0]) : null,
      tightSd: lowVarDom ? lowVarDom[1] : null,
    };
  }, [benchmark, legsAfter]);

  return (
    <div className="min-h-[calc(100vh-96px)] relative overflow-hidden">
      <div className="paper-noise absolute inset-0" />
      <svg viewBox="0 0 1440 900" className="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="campSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={isFinal ? "#1a3025" : "#1a2020"} />
            <stop offset="50%" stopColor="#0f1418" />
            <stop offset="100%" stopColor="#050708" />
          </linearGradient>
          <radialGradient id="campFire" cx="0.5" cy="1" r="0.5"><stop offset="0%" stopColor="#f59e0b" stopOpacity="0.15" /><stop offset="100%" stopColor="#f59e0b" stopOpacity="0" /></radialGradient>
        </defs>
        <rect width="1440" height="900" fill="url(#campSky)" />
        <path d="M 0 900 L 0 450 L 200 380 L 380 410 L 580 300 L 760 340 L 920 200 L 1100 260 L 1280 180 L 1440 220 L 1440 900 Z" fill="#0a1210" opacity="0.6" />
        <path d="M 0 900 L 0 600 L 240 520 L 460 560 L 680 440 L 880 500 L 1080 420 L 1280 470 L 1440 410 L 1440 900 Z" fill="#0e1816" opacity="0.8" />
        <path d="M 0 900 L 0 780 L 240 760 L 480 770 L 720 750 L 960 765 L 1200 755 L 1440 770 L 1440 900 Z" fill="#05090a" />
        <rect x="0" y="600" width="1440" height="300" fill="url(#campFire)" />
        <line
          x1={isFinal ? "1280" : "920"}
          y1={isFinal ? "180" : "200"}
          x2={isFinal ? "1280" : "920"}
          y2={isFinal ? "135" : "175"}
          stroke="#34d399"
          strokeWidth="1"
        />
        <path
          d={isFinal
            ? "M 1280 135 L 1290 140 L 1280 145 Z"
            : "M 920 175 L 930 180 L 920 185 Z"}
          fill="#34d399"
        />
        <circle
          cx={isFinal ? "1280" : "920"}
          cy={isFinal ? "180" : "200"}
          r="2"
          fill="#34d399"
          className="pulse-slow"
        />
      </svg>

      <div className="relative z-10 max-w-6xl mx-auto px-6 py-10">
        <div className="flex items-center gap-3 mb-8 text-[10px] uppercase tracking-[0.3em] text-amber-400">
          <Icon path={icons.flag} size={12} />
          {isFinal ? "Final Camp · between Leg 7 and Leg 8" : "Base Camp · between Leg 4 and Leg 5"} · altitude {altitude}
          <div className="flex-1 h-px bg-stone-800 max-w-[200px]" />
          <span className="text-stone-600">{completedLegs.length} / {legsBefore.length} legs answered · {legsAfter.length} to climb</span>
        </div>

        <h2 className="font-display text-5xl md:text-6xl leading-[1] mb-3">
          {isFinal ? (
            <>One peak <span className="italic text-emerald-400">remains.</span></>
          ) : (
            <>Halfway up. <span className="italic text-emerald-400">Look back.</span></>
          )}
        </h2>
        <p className="text-stone-500 max-w-2xl text-sm leading-relaxed mb-10">
          {isFinal 
            ? "Seven peaks behind. People remains, the softest terrain, often the hardest to cross. Before you summit, here's what the climb has revealed so far." 
            : "Four peaks behind, four ahead. Not enough to assign you an archetype yet, but enough to read the shape you've been climbing in. The next four legs will sharpen or break this reading."}
        </p>

        <div className="grid grid-cols-12 gap-6 mb-10">
          {/* LEFT COLUMN: provisional snapshot + completed legs detail + upcoming */}
          <div className="col-span-12 lg:col-span-7 space-y-6">
            {/* Running summary with provisional position */}
            <div className="border border-stone-800 bg-[#070a0b] p-6">
              <div className="text-[10px] uppercase tracking-widest text-stone-500 mb-4">So far · provisional reading</div>
              <div className="grid grid-cols-3 gap-px bg-stone-900 mb-4">

/* CampMiniDist: a thinner version of the Compare Yourself distribution plot,
   sized for the camp running-summary card. Same visual language as the Summit
   so the player recognizes it later. */
function CampMiniDist({ dist, playerScore }) {
  const W = 600, H = 60;
  const padX = 16;
  const trackY = 22;
  const trackH = 18;
  const scoreToX = (s) => padX + (W - 2 * padX) * (s / 100);
  
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" preserveAspectRatio="xMidYMid meet" style={{ display: "block" }}>
      {/* Stage bands */}
      {[
        { from: 0,  to: 25,  fill: "rgba(244, 63, 94, 0.05)" },
        { from: 25, to: 50,  fill: "rgba(245, 158, 11, 0.05)" },
        { from: 50, to: 75,  fill: "rgba(132, 204, 22, 0.05)" },
        { from: 75, to: 100, fill: "rgba(52, 211, 153, 0.05)" },
      ].map((band, i) => (
        <rect key={i} x={scoreToX(band.from)} y={trackY - 2} width={scoreToX(band.to) - scoreToX(band.from)} height={trackH + 4} fill={band.fill} />
      ))}
      {/* Whiskers p10-p90 */}
      <line x1={scoreToX(dist.p10)} y1={trackY + trackH / 2} x2={scoreToX(dist.p90)} y2={trackY + trackH / 2} stroke="#57534e" strokeWidth="1" />
      {[dist.p10, dist.p90].map((v, i) => (
        <line key={i} x1={scoreToX(v)} y1={trackY + 4} x2={scoreToX(v)} y2={trackY + trackH - 4} stroke="#57534e" strokeWidth="1" />
      ))}
      {/* Box p25-p75 */}
      <rect x={scoreToX(dist.p25)} y={trackY} width={scoreToX(dist.p75) - scoreToX(dist.p25)} height={trackH} fill="#1c1917" stroke="#78716c" strokeWidth="0.6" />
      <line x1={scoreToX(dist.p50)} y1={trackY} x2={scoreToX(dist.p50)} y2={trackY + trackH} stroke="#a8a29e" strokeWidth="1.5" />
      {/* Player marker */}
      <circle cx={scoreToX(playerScore)} cy={trackY + trackH / 2} r="6" fill="rgba(251, 191, 36, 0.25)" />
      <circle cx={scoreToX(playerScore)} cy={trackY + trackH / 2} r="3.5" fill="#fbbf24" stroke="#0a0c0d" strokeWidth="1.5" />
      {/* Player label below marker */}
      <text x={scoreToX(playerScore)} y={trackY + trackH + 14} textAnchor="middle" fill="#fbbf24" fontSize="9" fontFamily="JetBrains Mono, monospace" fontWeight="bold">
        YOU · {playerScore}
      </text>
    </svg>
  );
}

/* recommendPath: given player archetype + their biggest gap to benchmark,
   pick the recommended path. Returns the recommended path + ordered alternatives. */
const recommendPath = (matches, playerDomains, bench) => {
  const primary = matches[0];
  const recommendedKey = primary.playbook;  // archetype dictates default playbook
  
  // But check: is the player's biggest weakness in a domain the recommended path handles?
  // If their biggest gap is in People and the archetype suggests Foundations Path,
  // we override toward Talent Path.
  const deltas = ASCENT_DATA.meta.domainKeys.map(d => ({
    domain: d,
    delta: (playerDomains[d] ?? 0) - (bench.domains[d] ?? 0),
  })).sort((a, b) => a.delta - b.delta);
  const biggestGap = deltas[0];
  
  const PATH_BY_DOMAIN = {
    "Technology": "Foundations Path",
    "Data": "Foundations Path",
    "OpModel": "Foundations Path",
    "CX": "Value Path",
    "Operations": "Value Path",
    "Innovation": "Value Path",
    "People": "Talent Path",
    "Strategy": "Talent Path",
  };
  const gapDriven = PATH_BY_DOMAIN[biggestGap.domain];
  
  // If the biggest gap is severe (>15 points), let it override the archetype default
  let finalKey;
  if (biggestGap.delta < -15 && gapDriven) {
    finalKey = gapDriven;
  } else {
    finalKey = recommendedKey;
  }
  
  const recommended = ROADMAPS[finalKey];
  const alternatives = Object.values(ROADMAPS).filter(p => p.name !== finalKey);
  
  return {
    recommended,
    alternatives,
    biggestGap,
    archetypeDefault: ROADMAPS[recommendedKey],
    overrodeArchetype: finalKey !== recommendedKey,
  };
};

function SummitHero({ playerScore, playerStage, percentile, benchLabel, primaryArchetype, isSmallSample, smallSampleN, confidence }) {
  const stageColor = playerStage === "Future-Built" ? "text-emerald-400"
    : playerStage === "Scaling" ? "text-lime-400"
    : playerStage === "Emerging" ? "text-amber-400" : "text-rose-400";
  
  // Confidence display logic:
  //   - No confidence object (demo or n<2): show nothing extra
  //   - Tight CI (halfWidth < 2): "high confidence"
  //   - Otherwise: show the range
  let confidenceLine = null;
  if (confidence) {
    if (confidence.tight) {
      confidenceLine = `High confidence · ${confidence.n}/${confidence.N} answered`;
    } else {
      confidenceLine = `${confidence.level}% confident range: ${confidence.lower}-${confidence.upper} · ${confidence.n}/${confidence.N} answered`;
    }
  }
  
  return (
    <div className="sticky top-24 z-30 bg-[#0a0c0d]/95 backdrop-blur border-b border-stone-800 -mx-6 px-6 py-5 mb-10">
      <div className="max-w-6xl mx-auto flex items-baseline justify-between gap-6 flex-wrap">

/* ProfileRadarChart, 8-axis radar comparing archetype centroid to player profile.
   Axes go in the order ASCENT_DATA.meta.domainKeys provides: Strategy at top,
   then clockwise around. Both polygons are drawn with semi-transparent fills
   so overlap/divergence is visible at a glance. */
function ProfileRadarChart({ archetypeProfile, playerDomains, accentColor }) {
  const DOMAIN_KEYS = ASCENT_DATA.meta.domainKeys;
  const DOMAIN_LABELS = ASCENT_DATA.meta.domainLabels;
  const N = DOMAIN_KEYS.length;
  const W = 360, H = 360;
  const cx = W / 2, cy = H / 2;
  const maxR = 130;  // outer ring radius
  
  // Each axis at angle: -90deg (top) + i * 360/N, going clockwise
  const angleFor = (i) => (-Math.PI / 2) + (i * 2 * Math.PI / N);
  
  // Convert (domain index, score 0-100) to (x, y)
  const pointFor = (i, score) => {
    const r = (score / 100) * maxR;
    const a = angleFor(i);
    return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  };
  
  // Polygon path string from a list of (x, y) points
  const polygonPath = (pts) => {
    return pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ") + " Z";
  };
  
  // Reference grid: 4 concentric rings at 25, 50, 75, 100
  const ringScores = [25, 50, 75, 100];
  
  // Archetype polygon points
  const archPoints = DOMAIN_KEYS.map((d, i) => pointFor(i, archetypeProfile[d] ?? 0));
  // Player polygon points  
  const playerPoints = DOMAIN_KEYS.map((d, i) => pointFor(i, playerDomains[d] ?? 0));
  
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" preserveAspectRatio="xMidYMid meet" style={{ display: "block" }}>
      {/* Concentric reference rings */}
      {ringScores.map((s) => {
        const r = (s / 100) * maxR;
        return (
          <circle 
            key={s} 
            cx={cx} 
            cy={cy} 
            r={r} 
            fill="none" 
            stroke="#1c1917" 
            strokeWidth={s === 100 ? "0.8" : "0.5"} 
            strokeDasharray={s === 100 ? "0" : "2,3"}
            opacity={s === 100 ? 0.7 : 0.4}
          />
        );
      })}
      
      {/* Ring score labels (subtle, only at 50 and 100 to avoid clutter) */}
      <text x={cx + 3} y={cy - (50 / 100) * maxR + 3} fontSize="8" fill="#3f4540" fontFamily="monospace">50</text>
      <text x={cx + 3} y={cy - maxR + 3} fontSize="8" fill="#3f4540" fontFamily="monospace">100</text>
      
      {/* Radial axis lines */}
      {DOMAIN_KEYS.map((d, i) => {
        const outer = pointFor(i, 100);
        return (
          <line 
            key={d} 
            x1={cx} 
            y1={cy} 
            x2={outer.x} 
            y2={outer.y} 
            stroke="#1c1917" 
            strokeWidth="0.5" 
            opacity="0.6"
          />
        );
      })}
      
      {/* Archetype centroid polygon (semi-transparent fill) */}
      <path 
        d={polygonPath(archPoints)} 
        fill={accentColor || "#10b981"} 
        fillOpacity="0.25" 
        stroke={accentColor || "#10b981"} 
        strokeWidth="1.5" 
        strokeOpacity="0.8"
      />
      
      {/* Player profile polygon (yellow overlay) */}
      <path 
        d={polygonPath(playerPoints)} 
        fill="#fbbf24" 
        fillOpacity="0.18" 
        stroke="#fbbf24" 
        strokeWidth="1.5" 
        strokeDasharray="3,2"
      />
      
      {/* Player score dots at each vertex (so the player's exact scores are precise) */}
      {playerPoints.map((p, i) => (
        <circle 
          key={i} 
          cx={p.x} 
          cy={p.y} 
          r="2.5" 
          fill="#fbbf24" 
          stroke="#0a0c0d" 
          strokeWidth="0.8"
        />
      ))}
      
      {/* Domain labels around the outside */}
      {DOMAIN_KEYS.map((d, i) => {
        const a = angleFor(i);
        const labelR = maxR + 22;
        const lx = cx + Math.cos(a) * labelR;
        const ly = cy + Math.sin(a) * labelR;
        // Anchor based on horizontal position
        const anchor = lx < cx - 5 ? "end" : lx > cx + 5 ? "start" : "middle";
        // Slight vertical adjust based on vertical position
        const dy = ly < cy - 30 ? -2 : ly > cy + 30 ? 8 : 4;
        return (
          <text 
            key={d} 
            x={lx} 
            y={ly + dy} 
            textAnchor={anchor} 
            fontSize="10" 
            fill="#a8a29e" 
            fontFamily="serif" 
            fontStyle="italic"
          >
            {DOMAIN_LABELS[d]}
          </text>
        );
      })}
    </svg>
  );
}

function PeakByPeakSection({ playerDomains, playerCapabilities, bench, hasSectorZoom, industryData, sector }) {

  const DOMAIN_KEYS = ASCENT_DATA.meta.domainKeys;
