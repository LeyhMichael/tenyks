<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="metal" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#d4d4d4"/>
      <stop offset="30%"  stop-color="#ffffff"/>
      <stop offset="55%"  stop-color="#b8b8b8"/>
      <stop offset="80%"  stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="100" height="100" fill="#111111"/>
  <!-- Hollow geometric V: outer triangle minus inner void, evenodd rule -->
  <path fill-rule="evenodd" fill="url(#metal)"
        d="M 9,16 L 91,16 L 50,87 Z
           M 31,16 L 69,16 L 50,50 Z"/>
</svg>
