<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Left arm: brighter, catches more light -->
    <linearGradient id="leftArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f0f0f0"/>
      <stop offset="40%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <!-- Right arm: slightly darker, shadow side -->
    <linearGradient id="rightArm" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d0d0d0"/>
      <stop offset="50%"  stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <!-- Inner triangle face: darker, recessed look -->
    <linearGradient id="innerFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#888888"/>
      <stop offset="100%" stop-color="#555555"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="100" height="100" fill="#0f0f0f"/>

  <!-- Left arm: outer-top-left → inner-top-left (angled) → inner-bottom → outer-bottom-point -->
  <polygon points="9,14 37,20 50,54 50,88" fill="url(#leftArm)"/>

  <!-- Right arm: inner-top-right (angled) → outer-top-right → outer-bottom-point → inner-bottom -->
  <polygon points="63,20 91,14 50,88 50,54" fill="url(#rightArm)"/>

  <!-- Inner recessed face (the hollow triangle) -->
  <polygon points="37,20 63,20 50,54" fill="url(#innerFace)"/>

  <!-- Top edge of left arm (bright highlight strip) -->
  <line x1="9" y1="14" x2="37" y2="20" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Top edge of right arm -->
  <line x1="63" y1="20" x2="91" y2="14" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Outer left edge -->
  <line x1="9" y1="14" x2="50" y2="88" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
  <!-- Outer right edge -->
  <line x1="91" y1="14" x2="50" y2="88" stroke="#cccccc" stroke-width="0.5" stroke-opacity="0.3"/>
</svg>
